 class=\"fr\">Ils se parlent tous les jours. (they talk to each other)</td></tr>\n<tr><td>Pronominal idiomatique</td><td>fixed expression, meaning ≠ base verb</td><td class=\"fr\">Il s'agit de… / Ça se passe bien.</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je me lève à sept heures.</span><span class=\"en\">I get up at seven — reflexive.</span></div>\n<div class=\"ex\"><span class=\"fr\">Nous nous comprenons bien.</span><span class=\"en\">We understand each other well — reciprocal.</span></div>\n<div class=\"ex\"><span class=\"fr\">De quoi s'agit-il ?</span><span class=\"en\">What's it about? — \"s'agir de\" only exists in the pronominal form, with \"il\" impersonal.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Au passé composé, tous les verbes pronominaux se conjuguent avec être.</span>\n<span class=\"en\">All pronominal verbs take être in the passé composé (see the passé composé topic below for agreement rules).</span>\n</div>"}, {"id": "imperatif", "level": "A2", "frTitle": "L'impératif", "enSub": "The imperative — giving orders, advice, instructions", "desc": "Formation: present indicative minus the subject, for tu/nous/vous only. For -er verbs, the final \"-s\" of the tu-form is dropped.", "body": "<div class=\"rule\">\n<span class=\"fr\">Formation : présent de l'indicatif sans le sujet, aux formes tu/nous/vous. Pour les verbes en -er, le \"-s\" final de \"tu\" disparaît.</span>\n<span class=\"en\">Formation: present indicative minus the subject, for tu/nous/vous only. For -er verbs, the final \"-s\" of the tu-form is dropped.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Tu parles → Parle ! / Nous partons → Partons ! / Vous finissez → Finissez !</span><span class=\"en\">You speak → Speak! / We leave → Let's leave! / You finish → Finish!</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Trois verbes irréguliers : être → sois, soyons, soyez ; avoir → aie, ayons, ayez ; savoir → sache, sachons, sachez.</span>\n<span class=\"en\">Three irregular verbs: être → sois, soyons, soyez; avoir → aie, ayons, ayez; savoir → sache, sachons, sachez.</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"pronoms-complements\">→ Pronoun placement with the imperative</a>\n</div>"}, {"id": "passe-compose", "level": "A1/A2", "frTitle": "Le passé composé", "enSub": "Passé composé — the everyday past tense", "desc": "Formed with avoir for most verbs, but être for 15 verbs of movement/state (aller, arriver, descendre, entrer, monter, mourir, naître, partir, passer, rentrer, rester, retourner, sortir, tomber, venir) and all reflexive verbs.", "body": "<div class=\"rule\">\n<span class=\"fr\">Auxiliaire avoir pour la majorité des verbes ; auxiliaire être pour 15 verbes (et leur famille) et les verbes pronominaux.</span>\n<span class=\"en\">Formed with <strong>avoir</strong> for most verbs, but <strong>être</strong> for 15 verbs of movement/state (aller, arriver, descendre, entrer, monter, mourir, naître, partir, passer, rentrer, rester, retourner, sortir, tomber, venir) and all reflexive verbs.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il a pris le bus. / Il est parti. / Il s'est levé tard.</span><span class=\"en\">He took the bus. / He left. / He got up late.</span></div>\n</div></details>\n<table class=\"gtable\">\n<tr><th>Infinitive ending</th><th>Past participle</th><th>Examples</th></tr>\n<tr><td>-er</td><td>-é</td><td class=\"fr\">aimer → aimé</td></tr>\n<tr><td>-ir (regular)</td><td>-i</td><td class=\"fr\">finir → fini</td></tr>\n<tr><td>irregular</td><td>-u / -i / -is / -it / -ert / -eint</td><td class=\"fr\">boire→bu, prendre→pris, faire→fait, ouvrir→ouvert, peindre→peint</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">Accord : avec être, le participe s'accorde avec le sujet ; avec avoir, seulement si le COD est placé avant le verbe.</span>\n<span class=\"en\">Agreement: with être, the participle agrees with the subject. With avoir, it only agrees if the direct object comes before the verb — e.g. <em>Je l'ai reçue</em> (referring to a feminine noun already mentioned). For the full set of rules (pronominal verbs, participle + infinitive, etc.), see below.</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"imparfait\">→ Imparfait (the other past tense)</a>\n<a class=\"xref\" data-target=\"accord-participe-passe\">→ Full participle agreement rules</a>\n</div>"}, {"id": "accord-participe-passe", "level": "B2", "frTitle": "L'accord du participe passé", "enSub": "The full rule set — a classic source of errors even for advanced speakers", "desc": "With être (active or passive voice), the participle always agrees with the subject.", "body": "<div class=\"rule\">\n<span class=\"fr\">Avec <strong>être</strong> (voix active ou passive), le participe s'accorde toujours avec le sujet.</span>\n<span class=\"en\">With <strong>être</strong> (active or passive voice), the participle always agrees with the subject.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Des astéroïdes sont tombés sur la Terre.</span><span class=\"en\">Asteroids fell on Earth (active).</span></div>\n<div class=\"ex\"><span class=\"fr\">Des restrictions sont imposées par le gouvernement.</span><span class=\"en\">Restrictions are imposed by the government (passive).</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Avec <strong>avoir</strong>, le participe ne s'accorde jamais avec le sujet, seulement avec le COD s'il est placé avant.</span>\n<span class=\"en\">With <strong>avoir</strong>, the participle never agrees with the subject — only with a direct object placed before it.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">La maison qu'ils ont achetée domine la mer.</span><span class=\"en\">The house they bought overlooks the sea — \"qu'\" (= la maison) is the COD, placed before, so the participle agrees.</span></div>\n<div class=\"ex\"><span class=\"fr\">Des gens, il en a vu au cours de ses voyages !</span><span class=\"en\">He saw people during his travels! — when the COD is the pronoun \"en\", the participle never agrees, even though \"en\" comes first.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Verbes pronominaux : si le pronom réfléchi est COD, le participe s'accorde avec lui ; si le pronom réfléchi est COI, il ne s'accorde pas.</span>\n<span class=\"en\">Pronominal verbs: if the reflexive pronoun functions as a direct object, the participle agrees with it; if it functions as an indirect object, the participle doesn't agree.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Elle s'est lavée ce matin.</span><span class=\"en\">She washed (herself) this morning — \"se\" = COD (\"laver quelqu'un\"), so the participle agrees with the feminine subject.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ils se sont écrit pendant toutes les vacances.</span><span class=\"en\">They wrote to each other all summer — \"se\" = COI (\"écrire à quelqu'un\"), so no agreement.</span></div>\n<div class=\"ex\"><span class=\"fr\">Elle s'est souvenue de ce concert.</span><span class=\"en\">She remembered that concert — the reflexive pronoun has no COD/COI function here at all, so the participle simply agrees with the subject, as with any other être-verb.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Se rire, se plaire, se déplaire, se complaire font exception : leur participe passé est toujours invariable.</span>\n<span class=\"en\">Se rire, se plaire, se déplaire, se complaire are exceptions: their past participle is always invariable, regardless of meaning.</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Participe passé suivi d'un infinitif : il s'accorde seulement si le COD placé avant fait l'action exprimée par le participe lui-même (pas par l'infinitif).</span>\n<span class=\"en\">Participle followed by an infinitive: it only agrees if the preceding direct object is doing the action of the participle itself (not the infinitive's action).</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Les acteurs qu'on a enfin autorisés à jouer la pièce…</span><span class=\"en\">The actors who were finally authorized to perform the play — \"qu'\" (the actors) is the object of \"autorisés\" itself, so it agrees.</span></div>\n<div class=\"ex\"><span class=\"fr\">Voici les mesures que le gouvernement a souhaité prendre.</span><span class=\"en\">Here are the measures the government wanted to take — \"que\" (the measures) is the object of \"prendre\", not of \"souhaité\", so no agreement.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Le participe passé de \"faire\" suivi d'un infinitif est toujours invariable.</span>\n<span class=\"en\">The past participle of \"faire\" followed by an infinitive (the causative construction) is always invariable, no matter what: <em>Les tartes qu'il a fait préparer sont délicieuses.</em></span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Employé seul, sans auxiliaire, le participe passé s'accorde comme un adjectif ordinaire.</span>\n<span class=\"en\">Used alone, without an auxiliary, the past participle simply agrees like a regular adjective.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Ils vivent dans une maison construite sur pilotis.</span><span class=\"en\">They live in a house built on stilts.</span></div>\n<div class=\"ex\"><span class=\"fr\">Arrivées en retard, elles ont trouvé porte close.</span><span class=\"en\">Having arrived late, they found the door closed.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Les verbes de mesure (peser, mesurer, valoir, coûter, durer…) n'ont pas de vrai COD : leur participe ne s'accorde pas, sauf si le verbe change de sens (ex. \"coûter\" = causer).</span>\n<span class=\"en\">Measurement verbs (peser, mesurer, valoir, coûter, durer…) don't take a true direct object, so their participle doesn't agree — unless the verb shifts to a different meaning (e.g. \"coûter\" meaning \"to cause\").</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Les trois millions d'euros qu'a coûté la construction de l'école…</span><span class=\"en\">The three million euros the school's construction cost… — no agreement, \"coûté\" isn't followed by a real COD.</span></div>\n<div class=\"ex\"><span class=\"fr\">Les difficultés que lui a coûtées le tournage du film…</span><span class=\"en\">The difficulties the film shoot cost him… — here \"coûter\" means \"cause\", and \"difficultés\" is a genuine COD, so the participle agrees.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Le participe passé d'un verbe impersonnel (il a fait, il y a eu…) est toujours invariable.</span>\n<span class=\"en\">The past participle of an impersonal verb (il a fait, il y a eu…) is always invariable, even when preceded by something that looks like a COD.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">La chaleur qu'il a fait cet été !</span><span class=\"en\">The heat we had this summer! — \"qu'\" looks like a COD of \"fait\", but since \"il\" is impersonal (no real agent), the participle stays invariable.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Placés juste devant un nom sans déterminant, les participes <strong>ci-joint, ci-inclus, vu, attendu, excepté, compris, étant donné</strong> restent invariables — ils fonctionnent alors comme des prépositions/adverbes. Placés après le nom (ou attributs), ils s'accordent normalement.</span>\n<span class=\"en\">Right before a noun with no determiner, the participles <strong>ci-joint, ci-inclus, vu, attendu, excepté, compris, étant donné</strong> stay invariable — they act like a preposition or adverb there. Placed after the noun (or as an attribute), they agree as usual.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Ci-joint les documents. / Veuillez observer les documents ci-joints.</span><span class=\"en\">Please find enclosed the documents (invariable, before, no determiner) / Please look at the enclosed documents (agrees, after the noun).</span></div>\n<div class=\"ex\"><span class=\"fr\">Toutes les maisons ont été détruites, excepté celle de Pierre.</span><span class=\"en\">All the houses were destroyed, except Pierre's — \"excepté\" here means \"sauf\" and stays invariable.</span></div>\n</div></details>"}, {"id": "imparfait", "level": "A2", "frTitle": "L'imparfait", "enSub": "Imparfait — background, habits, description in the past", "desc": "Stem = the \"nous\" form of the present tense, minus -ons. Same endings for every verb: -ais, -ais, -ait, -ions, -iez, -aient.", "body": "<div class=\"rule\">\n<span class=\"fr\">Radical = celui de \"nous\" au présent ; terminaisons -ais, -ais, -ait, -ions, -iez, -aient.</span>\n<span class=\"en\">Stem = the \"nous\" form of the present tense, minus -ons. Same endings for every verb: -ais, -ais, -ait, -ions, -iez, -aient.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Nous faisons → je faisais</span><span class=\"en\">we do → I was doing/used to do</span></div>\n<div class=\"ex\"><span class=\"fr\">Avant, j'allais souvent dans ce café.</span><span class=\"en\">I used to go to that café often — habitual past action.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il faisait frais, mais il ne pleuvait pas.</span><span class=\"en\">It was cool, but it wasn't raining — describing circumstances/background.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Passé composé = action ponctuelle/achevée ; imparfait = habitude ou décor.</span>\n<span class=\"en\">Rule of thumb: passé composé for a completed, one-off event; imparfait for background description or repeated habits. They're often combined in the same sentence: <em>Il pleuvait (imparfait, background) quand je suis sorti (passé composé, event).</em></span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref back-style\" data-target=\"passe-compose\">← Passé composé</a>\n<a class=\"xref\" data-target=\"si-conditions\">→ Imparfait is also used after \"si\" for hypothetical present</a>\n</div>"}, {"id": "plus-que-parfait", "level": "B1", "frTitle": "Le plus-que-parfait", "enSub": "Pluperfect — an action completed before another past action", "desc": "Formation: the auxiliary (avoir/être) in the imparfait + past participle. Same auxiliary and agreement rules as the passé composé.", "body": "<div class=\"rule\">\n<span class=\"fr\">Formation : auxiliaire (avoir/être) à l'imparfait + participe passé.</span>\n<span class=\"en\">Formation: the auxiliary (avoir/être) in the imparfait + past participle. Same auxiliary and agreement rules as the passé composé.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">j'avais mangé / elle était partie / ils s'étaient levés</span><span class=\"en\">I had eaten / she had left / they had gotten up</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Le plus-que-parfait exprime une action antérieure à une autre action passée.</span>\n<span class=\"en\">It expresses an action that happened before another past action — the \"past of the past\".</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Quand je suis arrivé, le film avait déjà commencé.</span><span class=\"en\">When I arrived, the film had already started. (started before I arrived)</span></div>\n<div class=\"ex\"><span class=\"fr\">Elle m'a dit qu'elle avait fini le rapport.</span><span class=\"en\">She told me she had finished the report — very common in reported speech about the past.</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"discours-rapporte\">→ Discours rapporté (concordance des temps)</a>\n</div>"}, {"id": "futur-simple", "level": "A2", "frTitle": "Le futur simple", "enSub": "Simple future", "desc": "Stem = the infinitive (drop the final -e for -re verbs), same endings for every verb.", "body": "<div class=\"rule\">\n<span class=\"fr\">Radical = infinitif (on enlève le -e final des verbes en -re) + terminaisons -ai, -as, -a, -ons, -ez, -ont.</span>\n<span class=\"en\">Stem = the infinitive (drop the final -e for -re verbs), same endings for every verb.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">parler → je parlerai / prendre → il prendra</span><span class=\"en\">to speak → I will speak / to take → he will take</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Verbes irréguliers fréquents : être→serai, avoir→aurai, aller→irai, faire→ferai, voir→verrai, pouvoir→pourrai, devoir→devrai, vouloir→voudrai, venir→viendrai, savoir→saurai.</span>\n<span class=\"en\">A handful of very common verbs have an irregular stem — worth memorizing, they recur constantly.</span>\n</div>\n<div class=\"note\">\n<span class=\"fr\">Les verbes en -yer changent le y en i devant un e muet : essuyer → j'essuierai. Les verbes en -eler ou -eter doublent la consonne ou prennent un accent grave : geler → il gèlera ; jeter → il jettera.</span>\n<span class=\"en\">Spelling changes: -yer verbs turn y into i (essuyer → j'essuierai); -eler/-eter verbs double the consonant or add a grave accent (geler → il gèlera; jeter → il jettera).</span>\n</div>\n<div class=\"note\">\n<span class=\"fr\">On emploie le futur simple (et non le présent) après les conjonctions de temps quand, lorsque, dès que, aussitôt que : Nous partirons quand tout le monde sera prêt.</span>\n<span class=\"en\">Use the futur simple (not the present) after the time conjunctions quand, lorsque, dès que, aussitôt que: Nous partirons quand tout le monde sera prêt.</span>\n</div>\n<div class=\"rule\" style=\"margin-top:10px;\">\n<span class=\"fr\">Pour parler du futur, on a le choix entre le présent, le futur proche (aller + infinitif) et le futur simple, selon la certitude et la proximité de l'action.</span>\n<span class=\"en\">French has three ways to talk about the future, chosen by how certain or close the action is.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Tense</th><th>Use</th><th>Example</th></tr>\n<tr><td>Présent</td><td>a scheduled, near-certain event, or a firm decision</td><td class=\"fr\">Nous commençons la partie dans cinq minutes. / C'est décidé, je prends ma retraite l'année prochaine !</td></tr>\n<tr><td>Futur proche (aller + inf.)</td><td>near future, treated as more certain</td><td class=\"fr\">Il va être quelqu'un de meilleur.</td></tr>\n<tr><td>Futur simple</td><td>more distant, less certain, predictions</td><td class=\"fr\">Dans dix ans, la ville aura changé.</td></tr>\n</table>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"futur-proche-passe-recent\">→ Le futur proche et le passé récent (detailed)</a>\n</div>"}, {"id": "futur-proche-passe-recent", "level": "A1", "frTitle": "Le futur proche et le passé récent", "enSub": "Aller + infinitif (near future) and venir de + infinitif (recent past)", "desc": "Two everyday periphrases built the same way — a conjugated semi-auxiliary plus an infinitive — for what's about to happen and what just happened.", "body": "<div class=\"rule\">\n<span class=\"fr\">Futur proche = aller (au présent) + infinitif. Il exprime une action prévue dans un futur proche ou perçue comme certaine.</span>\n<span class=\"en\">The futur proche is aller (conjugated in the present) + infinitive. It's the everyday way to talk about something about to happen, or a plan felt as certain — much more common in speech than the futur simple.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je vais partir dans dix minutes.</span><span class=\"en\">I'm going to leave in ten minutes.</span></div>\n<div class=\"ex\"><span class=\"fr\">Elle va commencer un nouveau travail lundi.</span><span class=\"en\">She's starting a new job on Monday.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ils ne vont pas venir ce soir.</span><span class=\"en\">They're not going to come tonight — ne...pas frames the conjugated aller, not the infinitive.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Passé récent = venir (au présent) + de/d' + infinitif. Il exprime une action qui vient de se terminer, juste avant le moment présent.</span>\n<span class=\"en\">The passé récent is venir (present tense) + de/d' + infinitive. It expresses something that just finished, right before now — the mirror image of the futur proche, pointing at the immediate past instead of the immediate future.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je viens de finir mon travail.</span><span class=\"en\">I just finished my work.</span></div>\n<div class=\"ex\"><span class=\"fr\">Elle vient d'arriver, laisse-lui deux minutes.</span><span class=\"en\">She just arrived, give her a couple of minutes.</span></div>\n<div class=\"ex\"><span class=\"fr\">Nous venons de déménager.</span><span class=\"en\">We just moved.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Ni le futur proche ni le passé récent ne se conjuguent au passé composé : on ne dit jamais \"j'ai venu de\" ni \"j'ai allé faire\". Aller et venir restent au présent (ou à l'imparfait pour situer dans un récit passé : \"je venais de sortir quand...\").</span>\n<span class=\"en\">Neither construction ever goes into the passé composé itself — never \"j'ai venu de\" or \"j'ai allé faire\". Aller and venir stay in the present (or shift together to the imparfait to place the same idea inside a past narrative: je venais de sortir quand... — \"I had just gone out when...\").</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"futur-simple\">→ The futur simple (and the 3-way choice with présent/futur proche)</a>\n<a class=\"xref\" data-target=\"apercu-temps\">→ Overview of moods and tenses</a>\n<a class=\"xref\" data-target=\"imparfait\">→ The imparfait</a>\n</div>"}, {"id": "aspect-verbal", "level": "A2/B1", "frTitle": "« Venir de », « être en train de », « être sur le point de »", "enSub": "Three set expressions marking recent past, present continuous, and imminent future", "desc": "Three set expressions marking recent past, present continuous, and imminent future", "body": "<table class=\"gtable\">\n<tr><th>French</th><th>Meaning</th><th>Example</th></tr>\n<tr><td class=\"fr\">venir de + infinitif</td><td>just did something</td><td class=\"fr\">Je viens de manger.</td></tr>\n<tr><td class=\"fr\">être en train de + infinitif</td><td>doing something right now</td><td class=\"fr\">Je suis en train de manger.</td></tr>\n<tr><td class=\"fr\">être sur le point de + infinitif</td><td>about to do something</td><td class=\"fr\">Je suis sur le point de partir.</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il vient d'arriver.</span><span class=\"en\">He just arrived.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ne me dérange pas, je suis en train de travailler.</span><span class=\"en\">Don't disturb me, I'm working right now.</span></div>\n<div class=\"ex\"><span class=\"fr\">Dépêche-toi, le film est sur le point de commencer.</span><span class=\"en\">Hurry up, the film is about to start.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Ces trois expressions peuvent aussi se conjuguer à l'imparfait pour parler du passé (venait de, était en train de…).</span>\n<span class=\"en\">All three can also be conjugated in the imparfait to talk about the past: <em>Il venait de partir quand tu as appelé.</em> (\"He had just left when you called.\")</span>\n</div>"}, {"id": "futur-anterieur", "level": "B1", "frTitle": "Le futur antérieur", "enSub": "Future perfect — an action that will be completed before another future action", "desc": "Formation: the auxiliary (avoir/être) in the futur simple + past participle.", "body": "<div class=\"rule\">\n<span class=\"fr\">Formation : auxiliaire (avoir/être) au futur simple + participe passé.</span>\n<span class=\"en\">Formation: the auxiliary (avoir/être) in the futur simple + past participle.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">j'aurai fini / elle sera partie / ils se seront levés</span><span class=\"en\">I will have finished / she will have left / they will have gotten up</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Il exprime une action future antérieure à une autre action future, souvent après \"quand\", \"dès que\", \"une fois que\".</span>\n<span class=\"en\">It expresses a future action completed before another future action — very common after \"quand\", \"dès que\", \"une fois que\" (all + futur antérieur when the first action must finish first).</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Quand j'aurai fini mes études, je chercherai un emploi.</span><span class=\"en\">When I've finished my studies, I'll look for a job.</span></div>\n<div class=\"ex\"><span class=\"fr\">Appelle-moi dès que tu seras arrivé.</span><span class=\"en\">Call me as soon as you've arrived.</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref back-style\" data-target=\"plus-que-parfait\">← Plus-que-parfait (the same logic, in the past)</a>\n</div>"}, {"id": "conditionnel", "level": "B1", "frTitle": "Le conditionnel présent", "enSub": "Present conditional — \"would\"", "desc": "Formation: future stem + imparfait endings. So if you know the future stem and the imparfait endings, you already know the conditional.", "body": "<div class=\"rule\">\n<span class=\"fr\">Formation : radical du futur + terminaisons de l'imparfait.</span>\n<span class=\"en\">Formation: future stem + imparfait endings. So if you know the future stem and the imparfait endings, you already know the conditional.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Pourriez-vous m'apporter ces documents ?</span><span class=\"en\">Could you bring me these documents? — polite request.</span></div>\n<div class=\"ex\"><span class=\"fr\">J'aimerais être en vacances.</span><span class=\"en\">I would like to be on vacation — wish.</span></div>\n<div class=\"ex\"><span class=\"fr\">Avec 500 000 €, je serais riche et heureux.</span><span class=\"en\">With €500,000, I would be rich and happy — hypothetical.</span></div>\n</div></details>\n<div class=\"rule\" style=\"margin-top:10px;\">\n<span class=\"fr\">Le \"conditionnel journalistique\" présente une information non confirmée, sans que le journaliste en garantisse l'exactitude.</span>\n<span class=\"en\">The \"journalistic conditional\" presents information that isn't confirmed, without the writer vouching for it — very common in news reporting.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Marc Filou se présenterait aux élections.</span><span class=\"en\">Marc Filou is reportedly running in the elections (unconfirmed).</span></div>\n<div class=\"ex\"><span class=\"fr\">Selon des sources proches du dossier, l'accord serait signé la semaine prochaine.</span><span class=\"en\">According to sources close to the matter, the deal is expected to be signed next week.</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"si-conditions\">→ Si-clauses (condition) use the conditional in the result</a>\n</div>"}, {"id": "subjonctif", "level": "B1", "frTitle": "Le subjonctif présent", "enSub": "Present subjunctive — obligation, emotion, doubt, wish", "desc": "For je/tu/il/ils, take the \"ils\" stem of the present indicative; for nous/vous, take the \"nous\" stem. Endings: -e, -es, -e, -ions, -iez, -ent.", "body": "<div class=\"rule\">\n<span class=\"fr\">Pour je/tu/il/ils : radical de la 3e pers. du pluriel au présent + -e, -es, -e, -ent. Pour nous/vous : radical de \"nous\" au présent + -ions, -iez.</span>\n<span class=\"en\">For je/tu/il/ils, take the \"ils\" stem of the present indicative; for nous/vous, take the \"nous\" stem. Endings: -e, -es, -e, -ions, -iez, -ent.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">ils prennent → il faut que je prenne</span><span class=\"en\">they take → it's necessary that I take</span></div>\n<div class=\"ex\"><span class=\"fr\">nous partons → il faut que nous partions</span><span class=\"en\">we leave → it's necessary that we leave</span></div>\n</div></details>\n<table class=\"gtable\">\n<tr><th>Verb</th><th>que je / j'…</th></tr>\n<tr><td class=\"fr\">avoir</td><td class=\"fr\">aie</td></tr>\n<tr><td class=\"fr\">être</td><td class=\"fr\">sois</td></tr>\n<tr><td class=\"fr\">aller</td><td class=\"fr\">aille</td></tr>\n<tr><td class=\"fr\">faire</td><td class=\"fr\">fasse</td></tr>\n<tr><td class=\"fr\">savoir</td><td class=\"fr\">sache</td></tr>\n<tr><td class=\"fr\">pouvoir</td><td class=\"fr\">puisse</td></tr>\n<tr><td class=\"fr\">vouloir</td><td class=\"fr\">veuille</td></tr>\n<tr><td class=\"fr\">valoir</td><td class=\"fr\">vaille</td></tr>\n<tr><td class=\"fr\">falloir</td><td class=\"fr\">(il) faille</td></tr>\n<tr><td class=\"fr\">pleuvoir</td><td class=\"fr\">(il) pleuve</td></tr>\n</table>\n<div class=\"rule\" style=\"margin-top:10px;\">\n<span class=\"fr\">Le subjonctif est déclenché par des verbes/expressions d'obligation, de nécessité, ou de sentiment — à condition qu'il y ait deux sujets différents.</span>\n<span class=\"en\">Triggered by verbs/expressions of obligation, necessity, or emotion — but only when there are <strong>two different subjects</strong>. With the same subject, use the infinitive instead.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il faut que tu apprennes des langues.</span><span class=\"en\">You need to learn languages.</span></div>\n<div class=\"ex\"><span class=\"fr\">Julie aimerait aller à Zanzibar. <em>(même sujet → infinitif)</em></span><span class=\"en\">Julie would like to go to Zanzibar (same subject → infinitive).</span></div>\n<div class=\"ex\"><span class=\"fr\">Julie aimerait que son ami aille à Zanzibar. <em>(2 sujets → subjonctif)</em></span><span class=\"en\">Julie would like her friend to go to Zanzibar (2 subjects → subjunctive).</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Pour exprimer la volonté ou le souhait (2 sujets différents), on utilise aussi le subjonctif : vouloir que, souhaiter que, aimer que, désirer que, préférer que.</span>\n<span class=\"en\">Expressing a wish or desire toward someone else also triggers the subjunctive: vouloir que, souhaiter que, aimer que, désirer que, préférer que.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je veux que tu viennes avec moi.</span><span class=\"en\">I want you to come with me.</span></div>\n<div class=\"ex\"><span class=\"fr\">Nous souhaitons que ce projet réussisse.</span><span class=\"en\">We hope this project succeeds.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Le subjonctif passé (avoir/être au subjonctif + participe passé) exprime une action antérieure à celle du verbe principal.</span>\n<span class=\"en\">The subjonctif passé (avoir/être in the subjunctive + past participle) expresses an action that happened before the main verb's action.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je suis content que tu aies réussi ton examen.</span><span class=\"en\">I'm glad you passed your exam (the passing happened before \"je suis content\").</span></div>\n<div class=\"ex\"><span class=\"fr\">Bien qu'elle soit partie tôt, elle a raté le train.</span><span class=\"en\">Although she left early, she missed the train.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Le subjonctif imparfait (que je fusse, qu'il aimât…) est un temps littéraire, quasiment disparu à l'oral et à l'écrit courant. À reconnaître dans les textes classiques, jamais à produire.</span>\n<span class=\"en\">The subjonctif imparfait (que je fusse, qu'il aimât…) is a literary tense, essentially extinct in everyday speech and writing — like the passé simple, you only need to recognize it in classic literature, never produce it yourself.</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also — the subjunctive is also required after these connectors:</span>\n<a class=\"xref\" data-target=\"opposition-concession\">→ Concession: bien que, jusqu'à ce que…</a>\n<a class=\"xref\" data-target=\"but\">→ Purpose: pour que</a>\n<a class=\"xref\" data-target=\"opinion\">→ Opinion verbs: subjunctive after doubt/disagreement</a>\n</div>"}, {"id": "infinitif", "level": "B1/B2", "frTitle": "L'infinitif", "enSub": "The infinitive as a mood: present, past, and negation", "desc": "The infinitif passé (avoir/être + past participle) expresses a completed action, used when both verbs share the same subject.", "body": "<div class=\"rule\">\n<span class=\"fr\">L'infinitif passé (avoir/être à l'infinitif + participe passé) exprime une action achevée avant celle du verbe principal, quand les deux verbes ont le même sujet.</span>\n<span class=\"en\">The infinitif passé (avoir/être + past participle) expresses a completed action, used when both verbs share the same subject.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il regrette d'avoir menti.</span><span class=\"en\">He regrets having lied.</span></div>\n<div class=\"ex\"><span class=\"fr\">Merci d'être venu.</span><span class=\"en\">Thanks for coming.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">À la forme négative, les deux mots de la négation se placent ensemble, avant l'infinitif.</span>\n<span class=\"en\">In the negative, both negation words go together, right before the infinitive (unlike a conjugated verb, where they surround it).</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il m'a demandé de ne pas partir.</span><span class=\"en\">He asked me not to leave.</span></div>\n<div class=\"ex\"><span class=\"fr\">Elle regrette de ne jamais avoir voyagé.</span><span class=\"en\">She regrets never having traveled.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">L'infinitif peut aussi être sujet d'une phrase, souvent dans un style plus formel.</span>\n<span class=\"en\">The infinitive can also serve as the subject of a sentence, often in a more formal register: <em>Voyager forme la jeunesse.</em> (\"Traveling shapes the young.\")</span>\n</div>"}, {"id": "forme-impersonnelle", "level": "B1/B2", "frTitle": "La forme impersonnelle", "enSub": "Impersonal constructions with \"il\" — no real subject", "desc": "Impersonal \"il\" doesn't refer to anyone or anything specific — it's just a grammatical placeholder subject for weather verbs, necessity expressions, and existence.", "body": "<div class=\"rule\">\n<span class=\"fr\">Le \"il\" impersonnel ne représente rien de précis ; il sert de sujet grammatical à des verbes/expressions météo, de nécessité, ou d'existence.</span>\n<span class=\"en\">Impersonal \"il\" doesn't refer to anyone or anything specific — it's just a grammatical placeholder subject for weather verbs, necessity expressions, and existence.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Type</th><th>Examples</th></tr>\n<tr><td>Météo</td><td class=\"fr\">il pleut, il neige, il fait beau</td></tr>\n<tr><td>Nécessité/possibilité</td><td class=\"fr\">il faut, il est nécessaire de/que, il est possible que</td></tr>\n<tr><td>Existence</td><td class=\"fr\">il y a, il existe</td></tr>\n<tr><td>Apparence/opinion rapportée</td><td class=\"fr\">il paraît que, il semble que</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il paraît qu'il va démissionner.</span><span class=\"en\">Apparently he's going to resign (reported, not vouched for).</span></div>\n<div class=\"ex\"><span class=\"fr\">Il est possible qu'il pleuve demain.</span><span class=\"en\">It's possible it will rain tomorrow.</span></div>\n</div></details>"}, {"id": "passe-simple", "level": "B2", "frTitle": "Le passé simple", "enSub": "The literary past tense — for reading, not everyday speech", "desc": "Same meaning as the passé composé (a completed past action), but reserved for literary, historical, or formal journalistic writing — never used in everyday speech. You mainly need to recognize it when reading novels, articles, or history books.", "body": "<div class=\"rule\">\n<span class=\"fr\">Le passé simple exprime une action achevée dans le passé ; il est réservé à l'écrit littéraire, historique ou journalistique soutenu — on ne l'utilise jamais à l'oral courant.</span>\n<span class=\"en\">Same meaning as the passé composé (a completed past action), but reserved for literary, historical, or formal journalistic writing — never used in everyday speech. You mainly need to recognize it when reading novels, articles, or history books.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Group</th><th>Endings (il/elle)</th><th>Example</th></tr>\n<tr><td>-er verbs</td><td class=\"fr\">-a</td><td class=\"fr\">il parla</td></tr>\n<tr><td>-ir/-re verbs (most)</td><td class=\"fr\">-it</td><td class=\"fr\">il finit, il prit</td></tr>\n<tr><td>Many irregular verbs</td><td class=\"fr\">-ut</td><td class=\"fr\">il fut, il eut, il put</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il naquit en 1830 et mourut en 1890.</span><span class=\"en\">He was born in 1830 and died in 1890 — typical of a biography or history text.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Pour l'expression orale et écrite courante, on utilise toujours le passé composé à la place.</span>\n<span class=\"en\">For everyday speaking and writing, always use the passé composé instead — active production of the passé simple is not expected at this level, only recognition.</span>\n</div>"}, {"id": "indicatif-subjonctif-infinitif", "level": "B2", "frTitle": "Indicatif, subjonctif ou infinitif ?", "enSub": "Choosing the right mood after a verb or expression", "desc": "Two questions decide the mood: is the subject the same in both clauses? And does the verb express a certainty, or a wish/doubt/feeling?", "body": "<div class=\"rule\">\n<span class=\"fr\">Trois questions à se poser : le sujet est-il le même dans les deux parties de la phrase ? Le verbe exprime-t-il un fait certain ou un souhait/doute/sentiment ?</span>\n<span class=\"en\">Two questions decide the mood: is the subject the same in both clauses? And does the verb express a certainty, or a wish/doubt/feeling?</span>\n</div>\n<table class=\"gtable\">\n<tr><th></th><th>Même sujet</th><th>Sujets différents</th></tr>\n<tr><td>Fait certain (penser, savoir, dire que)</td><td class=\"fr\">indicatif</td><td class=\"fr\">indicatif</td></tr>\n<tr><td>Souhait / obligation / sentiment (vouloir, falloir, être content que)</td><td class=\"fr\">infinitif</td><td class=\"fr\">subjonctif</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je sais qu'il a raison.</span><span class=\"en\">I know he's right — certainty → indicative.</span></div>\n<div class=\"ex\"><span class=\"fr\">Je veux partir. / Je veux qu'il parte.</span><span class=\"en\">I want to leave (same subject → infinitive) / I want him to leave (different subjects → subjunctive).</span></div>\n<div class=\"ex\"><span class=\"fr\">Je suis content d'être ici. / Je suis content que tu sois ici.</span><span class=\"en\">I'm happy to be here (same subject → infinitive) / I'm happy you're here (different subjects → subjunctive).</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref back-style\" data-target=\"subjonctif\">← Subjonctif présent</a>\n<a class=\"xref\" data-target=\"opinion\">→ Opinion verbs (indicative vs subjunctive)</a>\n</div>"}, {"id": "passif", "level": "B1", "frTitle": "Le passif", "enSub": "The passive voice", "desc": "The active object becomes the subject; the active subject becomes the \"agent\" (introduced by \"par\" = \"by\"); the auxiliary être carries the tense, followed by the past participle (which agrees with the subject).", "body": "<div class=\"rule\">\n<span class=\"fr\">Le COD de la phrase active devient sujet ; le sujet actif devient complément d'agent (introduit par \"par\") ; être porte le temps du verbe, suivi du participe passé accordé.</span>\n<span class=\"en\">The active object becomes the subject; the active subject becomes the \"agent\" (introduced by \"par\" = \"by\"); the auxiliary être carries the tense, followed by the past participle (which agrees with the subject).</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Le chat mange la souris. → La souris est mangée par le chat.</span><span class=\"en\">The cat eats the mouse. → The mouse is eaten by the cat.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Se faire + infinitif exprime aussi une action subie par le sujet, souvent avec une nuance de désagrément.</span>\n<span class=\"en\">\"Se faire\" + infinitive also expresses an action undergone by the subject, often with a sense of misfortune.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il s'est fait voler son téléphone.</span><span class=\"en\">His phone got stolen (from him).</span></div>\n<div class=\"ex\"><span class=\"fr\">Elle s'est fait renvoyer.</span><span class=\"en\">She got fired.</span></div>\n</div></details>"}, {"id": "gerondif", "level": "B1", "frTitle": "Le gérondif", "enSub": "The gerund — \"by/while doing\"", "desc": "Formed with en + present participle (nous-stem + -ant). Exceptions: être→étant, avoir→ayant, savoir→sachant.", "body": "<div class=\"rule\">\n<span class=\"fr\">Formation : en + participe présent (radical de \"nous\" + -ant).</span>\n<span class=\"en\">Formed with en + present participle (nous-stem + -ant). Exceptions: être→étant, avoir→ayant, savoir→sachant.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">D'habitude, je travaille en écoutant la radio.</span><span class=\"en\">I usually work while listening to the radio.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il a appris le portugais en travaillant avec des Brésiliens.</span><span class=\"en\">He learned Portuguese by working with Brazilians.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Les deux verbes doivent avoir le même sujet.</span>\n<span class=\"en\">Both actions must share the same subject — the gérondif expresses simultaneity or manner.</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Ne pas confondre le gérondif (en + participe présent), le participe présent seul (verbal, invariable) et l'adjectif verbal (variable, accordé comme un adjectif).</span>\n<span class=\"en\">Don't confuse three related forms: the gérondif (en + present participle), the present participle alone (verb-like, invariable), and the adjectif verbal (adjective-like, agrees like a normal adjective).</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Forme</th><th>Nature</th><th>Exemple</th></tr>\n<tr><td>Gérondif</td><td>simultanéité/manière, invariable</td><td class=\"fr\">Elle travaille en chantant.</td></tr>\n<tr><td>Participe présent</td><td>action, invariable, remplace une relative</td><td class=\"fr\">Les gens habitant ici… (= qui habitent ici)</td></tr>\n<tr><td>Adjectif verbal</td><td>qualité, variable</td><td class=\"fr\">une histoire fascinante</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">Certains adjectifs verbaux s'écrivent différemment du participe présent : fatigant (adj.) vs fatiguant (participe) ; négligent (adj.) vs négligeant (participe).</span>\n<span class=\"en\">A few adjectifs verbaux are spelled differently from the present participle: fatigant (adj., \"tiring\") vs fatiguant (participle, \"tiring [someone]\"); négligent (adj., \"negligent\") vs négligeant (participle, \"neglecting\").</span>\n</div>"}, {"id": "verbes-changements-orthographiques", "level": "A2", "frTitle": "Les verbes à changements orthographiques", "enSub": "Spelling-change -er verbs", "desc": "-e_er (lever), -é_er (céder), -eler/-eter (appeler/acheter), -yer (employer), -cer/-ger (commencer/manger): the spelling shifts that keep pronunciation regular.", "body": "<div class=\"rule\">\n<span class=\"fr\">Les verbes en <strong>-e_er</strong> (lever, acheter, peser…) changent le <strong>e</strong> muet du radical en <strong>è</strong> devant une syllabe finale contenant un e muet (donc partout sauf nous/vous au présent).</span>\n<span class=\"en\">Verbs like <strong>lever, acheter, peser</strong> (a mute \"e\" before the final consonant) change that \"e\" to <strong>è</strong> whenever the ending that follows is itself a mute \"e\" — i.e. everywhere except nous/vous forms.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>LEVER</th><th></th></tr>\n<tr><td class=\"fr\">je lève, tu lèves, il lève, ils lèvent</td><td>è (stressed syllable)</td></tr>\n<tr><td class=\"fr\">nous levons, vous levez</td><td>e (unstressed, keeps ordinary \"e\")</td></tr>\n</table>\n<div class=\"rule\" style=\"margin-top:10px;\">\n<span class=\"fr\">Les verbes en <strong>-é_er</strong> (céder, préférer, espérer…) suivent la même logique, mais avec <strong>é → è</strong> — sauf au futur et au conditionnel, où le <strong>é</strong> est conservé.</span>\n<span class=\"en\">Verbs like <strong>céder, préférer, espérer</strong> (an acute-accented é before the final consonant) follow the same pattern, changing <strong>é → è</strong> — except in the futur and conditionnel, where the é stays put (an exception to the \"same as -e_er\" rule).</span>\n</div>\n<table class=\"gtable\">\n<tr><th>CÉDER</th><th></th></tr>\n<tr><td class=\"fr\">je cède, tu cèdes, il cède, ils cèdent</td><td>è</td></tr>\n<tr><td class=\"fr\">nous cédons, vous cédez</td><td>é (unstressed)</td></tr>\n<tr><td class=\"fr\">je céderai, je céderais</td><td>é kept even though unstressed — exception</td></tr>\n</table>\n<div class=\"rule\" style=\"margin-top:10px;\">\n<span class=\"fr\">Les verbes en <strong>-eler</strong> et <strong>-eter</strong> doublent en général la consonne (<strong>ll</strong>, <strong>tt</strong>) devant un e muet : appeler → j'appelle ; jeter → je jette. Quelques-uns prennent un accent grave à la place : acheter → j'achète, geler → je gèle.</span>\n<span class=\"en\"><strong>-eler/-eter</strong> verbs usually double the consonant before a mute e: appeler → j'appelle; jeter → je jette. A smaller set instead takes a grave accent, like the -e_er verbs above: acheter → j'achète, geler → je gèle, peler → je pèle. Since 1990 the spelling reform allows the accent-grave pattern for all -eler/-eter verbs except appeler, jeter and their families, which keep doubling.</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Les verbes en <strong>-yer</strong> changent le <strong>y</strong> en <strong>i</strong> devant un e muet (obligatoire pour -oyer/-uyer, facultatif pour -ayer).</span>\n<span class=\"en\"><strong>-yer</strong> verbs change <strong>y → i</strong> before a mute e: nous employons but j'emploie, tu emploies. This is obligatory for -oyer and -uyer verbs (envoyer → j'envoie); for -ayer verbs it's optional — je paie/je paye are both correct.</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Les verbes en <strong>-cer</strong> prennent une cédille (<strong>ç</strong>) et ceux en <strong>-ger</strong> gardent un <strong>e</strong> devant les terminaisons commençant par <strong>a</strong> ou <strong>o</strong>, pour garder le son [s]/[ʒ].</span>\n<span class=\"en\"><strong>-cer</strong> verbs add a cedilla (nous plaçons) and <strong>-ger</strong> verbs keep an extra e (nous mangeons) whenever the ending starts with a or o — purely to preserve the soft [s]/[ʒ] sound, which \"c\"/\"g\" would otherwise lose before a or o.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Nous commençons le cours à huit heures.</span><span class=\"en\">We start class at eight — commencer needs the cedilla before \"ons\".</span></div>\n<div class=\"ex\"><span class=\"fr\">Il mangeait tous les jours au restaurant.</span><span class=\"en\">He used to eat at the restaurant every day — manger keeps the \"e\" before \"ait\" (imparfait).</span></div>\n<div class=\"ex\"><span class=\"fr\">Nous voyageons beaucoup en été.</span><span class=\"en\">We travel a lot in summer — voyager keeps the \"e\" before \"ons\".</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Ces changements sont purement orthographiques : ils s'appliquent au présent, à l'imparfait, au subjonctif présent, au futur et au conditionnel selon le même principe — devant une syllabe muette pour -e_er/-é_er/-eler/-eter/-yer, devant a/o pour -cer/-ger.</span>\n<span class=\"en\">These are spelling rules, not separate conjugations — they apply the same way across present, imparfait, subjonctif, futur and conditionnel: whenever the ending that follows triggers the pattern (a mute e for the first group, an a/o for -cer/-ger).</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"verbes-reguliers\">→ Les verbes réguliers au présent</a>\n</div>"}]}, {"id": "cat-avance", "label": "5. Advanced Structures", "frLabel": "Structures avancées", "desc": "Subjunctive, passive, reported speech, style tools for writing at a higher level.", "levelRange": "A2–B2", "lessons": [{"id": "si-conditions", "level": "B1/B2", "frTitle": "Les phrases avec si (condition)", "enSub": "Si-clauses — matching tenses for real, possible, and unreal conditions", "desc": "The tense after \"si\" sets how likely/real the condition is. There are three main patterns — mixing them is the classic mistake to avoid.", "body": "<div class=\"rule\">\n<span class=\"fr\">Le temps après \"si\" détermine le degré de réalité de la condition.</span>\n<span class=\"en\">The tense after \"si\" sets how likely/real the condition is. There are three main patterns — mixing them is the classic mistake to avoid.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Si + …</th><th>Result clause</th><th>Meaning</th></tr>\n<tr><td class=\"fr\">présent</td><td class=\"fr\">présent / impératif / futur</td><td>Real / likely condition</td></tr>\n<tr><td class=\"fr\">imparfait</td><td class=\"fr\">conditionnel présent</td><td>Hypothetical / unlikely (present or future)</td></tr>\n<tr><td class=\"fr\">plus-que-parfait</td><td class=\"fr\">conditionnel passé</td><td>Unreal, contrary-to-fact (past)</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Si tu as le temps demain, passe me voir.</span><span class=\"en\">If you have time tomorrow, come see me. (real condition)</span></div>\n<div class=\"ex\"><span class=\"fr\">Si j'avais plus de temps, je voyagerais davantage.</span><span class=\"en\">If I had more time, I would travel more. (hypothetical)</span></div>\n<div class=\"ex\"><span class=\"fr\">Si j'avais su, je ne serais pas venu.</span><span class=\"en\">If I had known, I wouldn't have come. (contrary to fact, past)</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Pour exprimer une certitude temporelle (pas une condition), on utilise \"quand\", pas \"si\".</span>\n<span class=\"en\">To express a certain future event (not a condition), use \"quand\" (\"when\"), not \"si\": <em>Quand tu seras en vacances, n'oublie pas de passer me voir.</em></span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref back-style\" data-target=\"imparfait\">← Imparfait</a>\n<a class=\"xref back-style\" data-target=\"conditionnel\">← Conditionnel présent</a>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">D'autres structures que \"si\" permettent aussi d'exprimer une hypothèse, surtout à l'écrit soutenu.</span>\n<span class=\"en\">Besides \"si\", other structures also express a hypothesis, especially in formal writing.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>French</th><th>Construction</th><th>Example</th></tr>\n<tr><td class=\"fr\">au cas où</td><td>+ conditionnel</td><td class=\"fr\">Prends un parapluie, au cas où il pleuvrait.</td></tr>\n<tr><td class=\"fr\">à supposer que / en admettant que</td><td>+ subjonctif</td><td class=\"fr\">En admettant qu'il pleuve, l'événement sera annulé.</td></tr>\n<tr><td class=\"fr\">avec + nom</td><td>+ conditionnel</td><td class=\"fr\">Avec plus de temps, je voyagerais davantage.</td></tr>\n</table>"}, {"id": "opposition-concession", "level": "B2", "frTitle": "L'opposition et la concession", "enSub": "Opposition and concession: \"although\", \"whereas\", \"despite\"", "desc": "Concession acknowledges a fact while keeping your main point; opposition contrasts two ideas. Some connectors require the subjunctive.", "body": "<div class=\"rule\">\n<span class=\"fr\">La concession admet un fait tout en maintenant l'idée principale ; l'opposition met en parallèle deux idées contraires.</span>\n<span class=\"en\">Concession acknowledges a fact while keeping your main point; opposition contrasts two ideas. Some connectors require the subjunctive.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Connector</th><th>Construction</th><th>Mood</th></tr>\n<tr><td class=\"fr\">bien que, quoique</td><td>+ subjonctif</td><td>subjunctive</td></tr>\n<tr><td class=\"fr\">jusqu'à ce que</td><td>+ subjonctif</td><td>subjunctive (time limit, related idea)</td></tr>\n<tr><td class=\"fr\">malgré</td><td>+ nom</td><td>indicative (not a clause)</td></tr>\n<tr><td class=\"fr\">alors que, tandis que</td><td>+ indicatif</td><td>indicative</td></tr>\n<tr><td class=\"fr\">pourtant, cependant, néanmoins</td><td>connecteur (2e phrase)</td><td>indicative</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Bien qu'il pleuve, nous sortons.</span><span class=\"en\">Although it's raining, we're going out.</span></div>\n<div class=\"ex\"><span class=\"fr\">J'attendrai jusqu'à ce que tu arrives.</span><span class=\"en\">I'll wait until you arrive.</span></div>\n<div class=\"ex\"><span class=\"fr\">Malgré la pluie, nous sortons.</span><span class=\"en\">Despite the rain, we're going out — \"malgré\" takes a noun, no subjunctive needed.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il est calme, alors que sa sœur est très nerveuse.</span><span class=\"en\">He's calm, whereas his sister is very nervous.</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref back-style\" data-target=\"subjonctif\">← Subjonctif présent (needed after bien que / jusqu'à ce que)</a>\n</div>"}, {"id": "mise-en-relief", "level": "B1", "frTitle": "La mise en relief", "enSub": "Emphatic structures — highlighting the subject or object", "desc": "Emphatic structures — highlighting the subject or object", "body": "<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">C'est un plat qui est délicieux.</span><span class=\"en\">It's a dish that is delicious. (emphasizes subject)</span></div>\n<div class=\"ex\"><span class=\"fr\">C'est un restaurant que je recommande.</span><span class=\"en\">It's a restaurant that I recommend. (emphasizes object)</span></div>\n<div class=\"ex\"><span class=\"fr\">Ce que je préfère, c'est le gâteau au chocolat.</span><span class=\"en\">What I prefer is chocolate cake.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ce qui me plaît, ce sont les desserts au chocolat.</span><span class=\"en\">What I like is chocolate desserts.</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref back-style\" data-target=\"relatifs-composes\">← Ce qui / ce que (compound relative pronouns)</a>\n</div>"}, {"id": "discours-rapporte", "level": "B1", "frTitle": "Le discours rapporté", "enSub": "Reported (indirect) speech", "desc": "When reporting at the present tense, verb tenses stay the same, but pronouns and possessives shift to match the new speaker's perspective.", "body": "<div class=\"rule\">\n<span class=\"fr\">Au présent, les temps ne changent pas, mais les pronoms et adjectifs possessifs changent.</span>\n<span class=\"en\">When reporting at the present tense, verb tenses stay the same, but pronouns and possessives shift to match the new speaker's perspective.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Direct speech</th><th>Reported speech</th></tr>\n<tr><td class=\"fr\">Il dit : « J'ai perdu ma montre. »</td><td class=\"fr\">Il dit qu'il a perdu sa montre.</td></tr>\n<tr><td class=\"fr\">Il me demande : « Es-tu triste ? »</td><td class=\"fr\">Il me demande si je suis triste.</td></tr>\n<tr><td class=\"fr\">Elle me demande : « Qu'est-ce que tu veux ? »</td><td class=\"fr\">Elle me demande ce que je veux.</td></tr>\n<tr><td class=\"fr\">Tu veux savoir : « Qu'est-ce qui te plaît ici ? »</td><td class=\"fr\">Tu veux savoir ce qui me plaît ici.</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">Yes/no questions → \"si\" ; questions avec \"qu'est-ce que\" → \"ce que\" ; \"qu'est-ce qui\" → \"ce qui\".</span>\n<span class=\"en\">Yes/no questions are introduced with \"si\" (\"whether\"). \"Qu'est-ce que\" becomes \"ce que\", and \"qu'est-ce qui\" becomes \"ce qui\" — the same forms used in the mise en relief and compound relative pronouns above.</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Quand le verbe introducteur est au passé (il a dit, elle a demandé…), les temps du discours direct changent : c'est la concordance des temps.</span>\n<span class=\"en\">When the reporting verb is in the past (il a dit, elle a demandé…), the tense of the original sentence shifts back — this is the \"sequence of tenses\" (concordance des temps).</span>\n</div>\n<div class=\"table-scroll\">\n<table class=\"gtable\">\n<tr><th>Discours direct</th><th>Discours rapporté (au passé)</th></tr>\n<tr><td class=\"fr\">présent</td><td class=\"fr\">imparfait</td></tr>\n<tr><td class=\"fr\">passé composé</td><td class=\"fr\">plus-que-parfait</td></tr>\n<tr><td class=\"fr\">imparfait</td><td class=\"fr\">imparfait (inchangé)</td></tr>\n<tr><td class=\"fr\">futur simple</td><td class=\"fr\">conditionnel présent</td></tr>\n<tr><td class=\"fr\">futur proche (aller + infinitif)</td><td class=\"fr\">allait + infinitif</td></tr>\n<tr><td class=\"fr\">conditionnel</td><td class=\"fr\">conditionnel (inchangé)</td></tr>\n</table>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il a dit : « Je suis fatigué. » → Il a dit qu'il était fatigué.</span><span class=\"en\">présent → imparfait</span></div>\n<div class=\"ex\"><span class=\"fr\">Elle a dit : « J'ai fini le rapport. » → Elle a dit qu'elle avait fini le rapport.</span><span class=\"en\">passé composé → plus-que-parfait</span></div>\n<div class=\"ex\"><span class=\"fr\">Il m'a dit : « Je viendrai demain. » → Il m'a dit qu'il viendrait le lendemain.</span><span class=\"en\">futur simple → conditionnel présent (note aussi le changement de \"demain\")</span></div>\n<div class=\"ex\"><span class=\"fr\">Elle a annoncé : « Je vais déménager. » → Elle a annoncé qu'elle allait déménager.</span><span class=\"en\">futur proche → allait + infinitif</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Les expressions de temps changent aussi, car elles sont maintenant vues depuis le moment où l'on rapporte, pas depuis le moment où la phrase a été dite.</span>\n<span class=\"en\">Time expressions shift too, since they're now anchored to the moment of reporting rather than the moment the original sentence was spoken.</span>\n</div>\n<div class=\"table-scroll\">\n<table class=\"gtable\">\n<tr><th>Discours direct</th><th>Discours rapporté</th></tr>\n<tr><td class=\"fr\">aujourd'hui</td><td class=\"fr\">ce jour-là</td></tr>\n<tr><td class=\"fr\">hier</td><td class=\"fr\">la veille</td></tr>\n<tr><td class=\"fr\">demain</td><td class=\"fr\">le lendemain</td></tr>\n<tr><td class=\"fr\">avant-hier</td><td class=\"fr\">l'avant-veille</td></tr>\n<tr><td class=\"fr\">après-demain</td><td class=\"fr\">le surlendemain</td></tr>\n<tr><td class=\"fr\">la semaine dernière</td><td class=\"fr\">la semaine précédente</td></tr>\n<tr><td class=\"fr\">la semaine prochaine</td><td class=\"fr\">la semaine suivante</td></tr>\n<tr><td class=\"fr\">maintenant</td><td class=\"fr\">à ce moment-là</td></tr>\n<tr><td class=\"fr\">ici</td><td class=\"fr\">là</td></tr>\n</table>\n</div>\n<div class=\"note\">\n<span class=\"fr\">Si le verbe introducteur est au présent ou si le fait rapporté reste vrai au moment où l'on parle, on peut garder le temps d'origine.</span>\n<span class=\"en\">If the reporting verb is in the present, or the reported fact is still true at the moment of speaking, the original tense can be kept unchanged.</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Au lieu de répéter \"dire\", on utilise souvent des verbes déclaratifs plus précis, surtout à l'écrit (article, compte rendu).</span>\n<span class=\"en\">Instead of repeating \"dire\" (\"to say\"), more precise reporting verbs are used, especially in writing (articles, meeting minutes, interviews) — very useful given how often you summarize what someone said.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Verbe déclaratif</th><th>Nuance</th></tr>\n<tr><td class=\"fr\">affirmer, déclarer</td><td>stating firmly</td></tr>\n<tr><td class=\"fr\">préciser</td><td>clarifying a detail</td></tr>\n<tr><td class=\"fr\">souligner, insister sur le fait que</td><td>emphasizing</td></tr>\n<tr><td class=\"fr\">ajouter</td><td>adding a point</td></tr>\n<tr><td class=\"fr\">expliquer</td><td>explaining</td></tr>\n<tr><td class=\"fr\">admettre, reconnaître</td><td>conceding</td></tr>\n<tr><td class=\"fr\">nier</td><td>denying</td></tr>\n<tr><td class=\"fr\">s'interroger sur / se demander</td><td>wondering</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Le responsable a précisé que le projet serait retardé.</span><span class=\"en\">The manager clarified that the project would be delayed.</span></div>\n<div class=\"ex\"><span class=\"fr\">Elle a souligné que ce résultat était inattendu.</span><span class=\"en\">She emphasized that this result was unexpected.</span></div>\n</div></details>"}, {"id": "indicateurs-temps", "level": "B1", "frTitle": "Les indicateurs de temps", "enSub": "Time markers — a frequent source of confusion for English speakers", "desc": "Future-oriented time markers fall into three grammatical categories: adverbs, conjunctions, and prepositions.", "body": "<table class=\"gtable\">\n<tr><th>French</th><th>Use</th><th>Example</th></tr>\n<tr><td class=\"fr\">depuis</td><td>start of an ongoing action</td><td class=\"fr\">J'habite ici depuis dix ans.</td></tr>\n<tr><td class=\"fr\">il y a</td><td>ago (past, finished)</td><td class=\"fr\">Je suis arrivée il y a une heure.</td></tr>\n<tr><td class=\"fr\">pendant</td><td>duration (limited)</td><td class=\"fr\">Je t'ai attendu pendant dix minutes.</td></tr>\n<tr><td class=\"fr\">pour</td><td>planned duration</td><td class=\"fr\">Je pars en vacances pour deux semaines.</td></tr>\n<tr><td class=\"fr\">à partir de</td><td>starting point</td><td class=\"fr\">Je serai en vacances à partir de lundi.</td></tr>\n<tr><td class=\"fr\">jusqu'à</td><td>deadline / end point</td><td class=\"fr\">Le magasin est ouvert jusqu'à 19h.</td></tr>\n<tr><td class=\"fr\">dès que</td><td>as soon as</td><td class=\"fr\">Appelle-moi dès que tu arrives.</td></tr>\n<tr><td class=\"fr\">en</td><td>time needed to complete an action</td><td class=\"fr\">J'ai fait ce trajet en deux heures.</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">Ne pas confondre \"en\" (temps nécessaire pour finir une action) et \"pendant\" (durée pendant laquelle une action se déroule).</span>\n<span class=\"en\">Don't confuse \"en\" (how long it takes to complete something) with \"pendant\" (how long an action lasts): <em>J'ai lu ce livre en trois jours</em> (it took 3 days to finish) vs <em>J'ai lu pendant trois jours</em> (I spent 3 days reading, may not have finished).</span>\n</div>\n<div class=\"note\">\n<span class=\"fr\">Séquence : d'abord, puis, ensuite, enfin.</span>\n<span class=\"en\">To sequence actions: d'abord (first), puis/ensuite (then), enfin (finally).</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Les indicateurs de temps orientés vers le futur se répartissent en trois catégories grammaticales : adverbes, conjonctions et prépositions.</span>\n<span class=\"en\">Future-oriented time markers fall into three grammatical categories: adverbs, conjunctions, and prepositions.</span>\n</div>\n<div class=\"table-scroll\">\n<table class=\"gtable\">\n<tr><th>Les adverbes</th><th>Les conjonctions</th><th>Les prépositions</th></tr>\n<tr><td class=\"fr\">demain</td><td class=\"fr\">après que</td><td class=\"fr\">dans</td></tr>\n<tr><td class=\"fr\">après-demain</td><td class=\"fr\">dès que</td><td class=\"fr\">d'ici</td></tr>\n<tr><td class=\"fr\">plus tard</td><td class=\"fr\">aussitôt que</td><td class=\"fr\">à partir de</td></tr>\n<tr><td class=\"fr\">bientôt</td><td class=\"fr\">une fois que</td><td class=\"fr\">dès</td></tr>\n<tr><td class=\"fr\">après</td><td class=\"fr\">—</td><td class=\"fr\">après</td></tr>\n</table>\n</div>\n<div class=\"note\">\n<span class=\"fr\">Les conjonctions (après que, dès que, aussitôt que, une fois que) sont suivies de l'indicatif.</span>\n<span class=\"en\">The conjunctions (après que, dès que, aussitôt que, une fois que) are followed by the indicative — not the subjunctive, even though \"après que\" is often mistakenly paired with it.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je te rappelle plus tard.</span><span class=\"en\">adverb</span></div>\n<div class=\"ex\"><span class=\"fr\">Je te rappelle dès que j'arrive.</span><span class=\"en\">conjunction + indicative</span></div>\n<div class=\"ex\"><span class=\"fr\">Je te rappelle dans une heure.</span><span class=\"en\">preposition + duration</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">On distingue les indicateurs de temps liés au moment où on parle et ceux liés à un moment différent (un autre point de repère, comme dans un récit) — et, dans chaque cas, on distingue un moment précis d'un moment général.</span>\n<span class=\"en\">Time markers fall into two axes: whether they're anchored to the moment of speaking or to a different reference point (as in a narrative), and whether they refer to a precise moment or a general one.</span>\n</div>\n<div class=\"table-scroll\">\n<table class=\"gtable\">\n<tr><th></th><th>Au moment où on parle</th><th>À un moment différent</th></tr>\n<tr><td class=\"fr\">Avant un moment précis</td><td class=\"fr\">la semaine / le mois d'avant</td><td class=\"fr\">deux semaines / deux mois avant</td></tr>\n<tr><td class=\"fr\">Avant</td><td class=\"fr\">la semaine / le mois dernier(-ère)</td><td class=\"fr\">la semaine / le mois précédent(e) / d'avant</td></tr>\n<tr><td class=\"fr\">À ce moment-là</td><td class=\"fr\">aujourd'hui</td><td class=\"fr\">ce jour-là</td></tr>\n<tr><td class=\"fr\">Après</td><td class=\"fr\">la semaine / le mois prochain(e)</td><td class=\"fr\">la semaine / le mois suivant(e) / d'après</td></tr>\n<tr><td class=\"fr\">Après un moment précis</td><td class=\"fr\">la semaine / le mois d'après</td><td class=\"fr\">deux semaines / deux mois après</td></tr>\n</table>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">La réunion est le 10. La semaine d'avant, il faut tout préparer.</span><span class=\"en\">the week before [a precise, named moment] — from now</span></div>\n<div class=\"ex\"><span class=\"fr\">La réunion était le 10 mai. Deux semaines avant, on avait envoyé les invitations.</span><span class=\"en\">two weeks before [a precise moment] — from a different reference point</span></div>\n<div class=\"ex\"><span class=\"fr\">Le mois dernier, on a fêté son anniversaire.</span><span class=\"en\">last month (general, not tied to a precise date) — from now</span></div>\n<div class=\"ex\"><span class=\"fr\">Il avait changé de travail le mois précédent / le mois d'avant.</span><span class=\"en\">the previous month (general) — from a different reference point</span></div>\n<div class=\"ex\"><span class=\"fr\">L'année prochaine, je vais déménager.</span><span class=\"en\">next year (general) — from now</span></div>\n<div class=\"ex\"><span class=\"fr\">Il a trouvé un travail en 2020 ; l'année suivante, il a déménagé.</span><span class=\"en\">the following year (general) — from a different reference point</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">\"D'avant\" et \"d'après\" servent pour un moment précis (avec un point de repère daté) ; \"dernier\" et \"prochain\" servent au moment où on parle pour une période générale ; \"précédent(e)\" et \"suivant(e)\" servent à un moment différent pour une période générale.</span>\n<span class=\"en\">\"D'avant\" and \"d'après\" are used with a precise, dated reference point; \"dernier\" and \"prochain\" are used from the moment of speaking for a general period; \"précédent(e)\" and \"suivant(e)\" are used from a different reference point for a general period.</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"nombres-heure-date\">→ Les nombres, l'heure et la date (basics)</a>\n<a class=\"xref back-style\" data-target=\"discours-rapporte\">Discours rapporté (concordance des temps)</a>\n</div>"}, {"id": "cause", "level": "B1", "frTitle": "L'expression de la cause", "enSub": "Expressing cause/reason", "desc": "In more formal writing: puisque (since, known reason), étant donné que / vu que (given that), sous prétexte que (on the pretext that — implies doubt about the reason given).", "body": "<table class=\"gtable\">\n<tr><th>Connector</th><th>Nuance</th></tr>\n<tr><td class=\"fr\">parce que</td><td>neutral explanation</td></tr>\n<tr><td class=\"fr\">comme</td><td>always at the start of the sentence</td></tr>\n<tr><td class=\"fr\">à cause de + nom</td><td>negative cause</td></tr>\n<tr><td class=\"fr\">grâce à + nom</td><td>positive cause</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Comme il fait chaud, je vais à la piscine.</span><span class=\"en\">Since it's hot, I'm going to the pool.</span></div>\n<div class=\"ex\"><span class=\"fr\">La route est bloquée à cause de la neige.</span><span class=\"en\">The road is blocked because of the snow.</span></div>\n<div class=\"ex\"><span class=\"fr\">Grâce à tes explications, j'ai compris.</span><span class=\"en\">Thanks to your explanations, I understood.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">À l'écrit plus soutenu, on trouve aussi puisque, étant donné que, vu que, sous prétexte que.</span>\n<span class=\"en\">In more formal writing: puisque (since, known reason), étant donné que / vu que (given that), sous prétexte que (on the pretext that — implies doubt about the reason given).</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Puisque tu es là, autant en profiter.</span><span class=\"en\">Since you're here, we might as well make the most of it.</span></div>\n<div class=\"ex\"><span class=\"fr\">Étant donné que les délais sont courts, il faut agir vite.</span><span class=\"en\">Given that the deadlines are short, we need to act quickly.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il a annulé sous prétexte qu'il était malade.</span><span class=\"en\">He cancelled on the pretext that he was sick (implies doubt about the real reason).</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"consequence\">→ Consequence</a>\n<a class=\"xref\" data-target=\"but\">→ Purpose</a>\n</div>"}, {"id": "consequence", "level": "B1", "frTitle": "L'expression de la conséquence", "enSub": "Expressing consequence/result", "desc": "Expressing consequence/result", "body": "<table class=\"gtable\">\n<tr><th>Connector</th><th>Nuance</th></tr>\n<tr><td class=\"fr\">donc</td><td>logical consequence</td></tr>\n<tr><td class=\"fr\">alors</td><td>consequence of a preceding event</td></tr>\n<tr><td class=\"fr\">c'est pour ça que / c'est pourquoi</td><td>structured discourse</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il pleut, donc je prends mon parapluie.</span><span class=\"en\">It's raining, so I'm taking my umbrella.</span></div>\n<div class=\"ex\"><span class=\"fr\">J'ai raté le bus, c'est pourquoi je suis en retard.</span><span class=\"en\">I missed the bus, which is why I'm late.</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref back-style\" data-target=\"cause\">← Cause</a>\n</div>"}, {"id": "but", "level": "B1", "frTitle": "L'expression du but", "enSub": "Expressing purpose — \"in order to / so that\"", "desc": "Same rule as the subjunctive: same subject → infinitive; two different subjects → subjunctive.", "body": "<div class=\"rule\">\n<span class=\"fr\">Pour + infinitif (même sujet) ; pour que + subjonctif (deux sujets différents).</span>\n<span class=\"en\">Same rule as the subjunctive: same subject → infinitive; two different subjects → subjunctive.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je vais me coucher pour me reposer.</span><span class=\"en\">I'm going to bed to rest. (same subject → infinitive)</span></div>\n<div class=\"ex\"><span class=\"fr\">J'économise pour que nous puissions acheter une maison.</span><span class=\"en\">I'm saving so that we can buy a house. (two subjects → subjunctive)</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref back-style\" data-target=\"subjonctif\">← Subjonctif présent</a>\n</div>"}, {"id": "verbe-preposition", "level": "B1/B2", "frTitle": "Verbes + préposition", "enSub": "Verb-preposition constructions — French verbs don't always match English patterns", "desc": "Many French verbs pair with a different preposition than their English equivalent — or none at all. Worth learning verb + preposition as a single unit.", "body": "<div class=\"rule\">\n<span class=\"fr\">Beaucoup de verbes français exigent une préposition différente de l'anglais, ou aucune.</span>\n<span class=\"en\">Many French verbs pair with a different preposition than their English equivalent — or none at all. Worth learning verb + preposition as a single unit.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Verb + preposition</th><th>Meaning</th></tr>\n<tr><td class=\"fr\">penser à qqch/qqn</td><td>to think about sth/sb</td></tr>\n<tr><td class=\"fr\">penser de qqch (opinion)</td><td>to think of sth (opinion)</td></tr>\n<tr><td class=\"fr\">parler de qqch</td><td>to talk about sth</td></tr>\n<tr><td class=\"fr\">avoir besoin de</td><td>to need</td></tr>\n<tr><td class=\"fr\">s'intéresser à</td><td>to be interested in</td></tr>\n<tr><td class=\"fr\">réussir à + infinitif</td><td>to succeed in / manage to</td></tr>\n<tr><td class=\"fr\">décider de + infinitif</td><td>to decide to</td></tr>\n<tr><td class=\"fr\">écouter qqn (no preposition!)</td><td>to listen to sb</td></tr>\n<tr><td class=\"fr\">attendre qqn (no preposition!)</td><td>to wait for sb</td></tr>\n<tr><td class=\"fr\">chercher qqch (no preposition!)</td><td>to look for sth</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">Ces prépositions déterminent ensuite quel pronom relatif utiliser (dont, auquel…).</span>\n<span class=\"en\">These prepositions are exactly what determines whether a relative clause needs \"dont\" or \"lequel/auquel\" — worth cross-checking.</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"prepositions-a-de-en-par-pour\">→ Les prépositions à, de, en, par, pour</a>\n<a class=\"xref back-style\" data-target=\"relatifs-composes\">← Compound relative pronouns</a>\n</div>"}, {"id": "necessite-obligation", "level": "B
