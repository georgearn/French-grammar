t chez le coiffeur.</span><span class=\"en\">The cat sleeps on the sofa (concrete surface) / She's at the hairdresser's (an activity + person, not a container).</span></div>\n</div></details><div class=\"rule\">\n<span class=\"fr\">Devant / derrière, dessus / dessous, en haut / en bas expriment une position sans contact obligatoire ; sur / sous impliquent en général un contact.</span>\n<span class=\"en\">Devant/derrière (in front of/behind) and dessus/dessous, en haut/en bas (above/below, on top/underneath) describe relative position without necessarily touching; sur/sous (on/under) usually imply actual contact with a surface.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Le vase est sur la table. (contact) / La lampe est au-dessus de la table. (pas de contact)</span><span class=\"en\">The vase is on the table — touching it. / The lamp is above the table — no contact, just hanging over it.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il y a un parking devant l'immeuble.</span><span class=\"en\">There's a parking lot in front of the building — proximity, not contact.</span></div>\n</div></details><div class=\"rule\">\n<span class=\"fr\">Entre s'utilise pour deux éléments (ou un nombre limité, nettement identifiés) ; parmi s'utilise pour un élément choisi dans un ensemble plus large et indéfini.</span>\n<span class=\"en\">Entre (between) is for two things, or a small, clearly identified set; parmi (among) picks one element out of a larger, less defined group.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">La poste se trouve entre la mairie et l'église.</span><span class=\"en\">The post office is between the town hall and the church — two clear landmarks.</span></div>\n<div class=\"ex\"><span class=\"fr\">Parmi les candidats, trois seulement ont été retenus.</span><span class=\"en\">Among the candidates, only three were kept — one subset of a larger, less defined group.</span></div>\n<div class=\"ex\"><span class=\"fr\">C'est l'un d'entre eux qui a proposé cette idée.</span><span class=\"en\">It's one of them who suggested this idea — d'entre eux after a pronoun like l'un, quelques-uns, plusieurs, chacun.</span></div>\n</div></details><div class=\"rule\">\n<span class=\"fr\">Près de / proche de indiquent une distance courte ; ici, là, là-bas situent par rapport au locuteur, et sont souvent repris par le pronom y.</span>\n<span class=\"en\">Près de/proche de (near, close to) mark a short distance; ici (here), là (there), là-bas (over there) locate things relative to the speaker, and are picked up again with the pronoun y once the place has been named.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Tu connais ce restaurant ? — Oui, j'y vais souvent.</span><span class=\"en\">Do you know that restaurant? — Yes, I go there often — y replaces the place already mentioned.</span></div>\n<div class=\"ex\"><span class=\"fr\">Elle habite tout près d'ici, mais son bureau est assez loin, là-bas, de l'autre côté du pont.</span><span class=\"en\">She lives very close by, but her office is quite far, over there, on the other side of the bridge.</span></div>\n</div></details><div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"prepositions-lieu\">→ Prepositions of place (à, en, dans...)</a>\n</div>"}, {"id": "b2c2-geographie-prepositions", "level": "C2", "frTitle": "Prépositions et noms de lieux géographiques", "enSub": "à/en/au(x) with cities, countries, continents, regions and départements", "desc": "Which preposition goes with which kind of place name — gender of the country/region drives the choice more than any other rule.", "body": "<div class=\"rule\">\n<span class=\"fr\">Villes : à (+ éventuellement l'article si le nom l'exige). Pays et continents féminins (ou masculins commençant par une voyelle) : en. Pays masculins commençant par une consonne : au. Pays au pluriel : aux.</span>\n<span class=\"en\">Cities take à (plus the article when the name itself includes one, like Le Caire → au Caire). Feminine countries/continents, and masculine ones starting with a vowel, take en. Masculine countries starting with a consonant take au. Plural-named countries take aux.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Elle vit à Berlin. / Il travaille au Caire, en Égypte.</span><span class=\"en\">She lives in Berlin. / He works in Cairo, Egypt — Le Caire keeps its article, contracted with à.</span></div>\n<div class=\"ex\"><span class=\"fr\">Nous partons en France, en Italie, en Iran, en Afrique.</span><span class=\"en\">We're going to France, Italy, Iran, Africa — feminine, or masculine starting with a vowel (Iran).</span></div>\n<div class=\"ex\"><span class=\"fr\">Il a grandi au Japon, au Brésil, au Sénégal.</span><span class=\"en\">He grew up in Japan, Brazil, Senegal — masculine countries starting with a consonant.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ils voyagent aux États-Unis, aux Pays-Bas.</span><span class=\"en\">They're traveling to the United States, the Netherlands — plural country names.</span></div>\n</div></details><div class=\"rule\">\n<span class=\"fr\">Régions et départements féminins : en. Régions et départements masculins : dans le / au. La règle du genre est la même que pour les pays : terminaison en -e = féminin (sauf exceptions), sinon masculin.</span>\n<span class=\"en\">French regions and départements follow the same gender logic as countries: feminine ones (usually ending in -e) take en, masculine ones take dans le or au.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Elle habite en Bretagne, en Normandie, en Provence.</span><span class=\"en\">She lives in Brittany, Normandy, Provence — feminine regions.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il est né dans le Var, dans le Périgord.</span><span class=\"en\">He was born in the Var, in Périgord — masculine, dans le.</span></div>\n</div></details><div class=\"note\">\n<span class=\"fr\">Depuis, de, venir de + ville = de ; + pays féminin = de ; + pays masculin = du ; + pays pluriel = des.</span>\n<span class=\"en\">The same gender logic applies in reverse for \"from\": de for cities and feminine countries, du for masculine countries, des for plural ones — Elle vient de Rome, du Portugal, des Philippines.</span>\n</div><div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"prepositions-lieu\">→ Prepositions of place (à, en, dans...)</a>\n</div>"}, {"id": "b2c2-verbes-voyage", "level": "C2", "frTitle": "Les verbes du voyage et du déplacement", "enSub": "venir/aller/revenir/retourner, apporter/amener vs emporter/emmener, joindre/rejoindre/retrouver", "desc": "A family of near-synonyms for movement and travel that trip up even advanced learners — direction, what you carry vs who you accompany, meeting up vs catching up.", "body": "<div class=\"rule\">\n<span class=\"fr\">Aller = se déplacer vers un lieu (hors d'ici) ; venir = se déplacer vers le locuteur (vers ici) ; retourner = aller de nouveau dans un lieu où l'on a déjà été (le lieu n'est pas celui où l'on parle) ; revenir = venir de nouveau vers le lieu où l'on est/parle ; rentrer = revenir chez soi.</span>\n<span class=\"en\">Aller (go) always moves away from the speaker's viewpoint, venir (come) always moves toward it. Retourner is going back somewhere that isn't where you're speaking from; revenir is coming back to where you are now; rentrer narrows revenir to coming back home.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je vais à Lyon la semaine prochaine.</span><span class=\"en\">I'm going to Lyon next week — away from here.</span></div>\n<div class=\"ex\"><span class=\"fr\">Tu viens chez moi ce soir ?</span><span class=\"en\">Are you coming to my place tonight? — toward the speaker.</span></div>\n<div class=\"ex\"><span class=\"fr\">L'été prochain, je retournerai en Grèce.</span><span class=\"en\">Next summer I'll go back to Greece — a place I've been, not where I am now.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il est reparti aussi vite qu'il était revenu.</span><span class=\"en\">He left again as fast as he'd come back — revenir, because he came back to here.</span></div>\n<div class=\"ex\"><span class=\"fr\">Je rentre tard ce soir.</span><span class=\"en\">I'm getting home late tonight — rentrer, specifically home.</span></div>\n</div></details><div class=\"rule\">\n<span class=\"fr\">Apporter / emporter concernent un objet ; amener / emmener concernent une personne ou un animal. Apporter et amener = mouvement vers le lieu où l'on est ou sera (comme venir) ; emporter et emmener = mouvement loin de ce lieu (comme aller).</span>\n<span class=\"en\">Apporter/emporter are for objects, amener/emmener for people or animals. Apporter and amener move toward the reference point (like venir); emporter and emmener move away from it (like aller).</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">N'oublie pas d'apporter ton maillot de bain !</span><span class=\"en\">Don't forget to bring your swimsuit! (an object, toward here).</span></div>\n<div class=\"ex\"><span class=\"fr\">Tu peux emporter ces livres, je n'en ai plus besoin.</span><span class=\"en\">You can take these books away, I don't need them anymore (an object, away from here).</span></div>\n<div class=\"ex\"><span class=\"fr\">Elle a amené sa fille à la fête.</span><span class=\"en\">She brought her daughter to the party (a person, toward the party).</span></div>\n<div class=\"ex\"><span class=\"fr\">Il faut emmener le chien chez le vétérinaire.</span><span class=\"en\">The dog needs to be taken to the vet (a living being, away from here).</span></div>\n</div></details><div class=\"rule\">\n<span class=\"fr\">Joindre = entrer en contact (souvent par téléphone) ; rejoindre = aller retrouver quelqu'un quelque part, ou aboutir à un même point ; rencontrer = se trouver en présence de quelqu'un (par hasard ou pour la première fois) ; retrouver = revoir quelqu'un avec qui un rendez-vous a été fixé.</span>\n<span class=\"en\">Joindre = get in touch with someone (often by phone); rejoindre = go meet up with someone somewhere, or converge with them; rencontrer = come into someone's presence, often by chance or for the first time; retrouver = see again someone you'd arranged to meet.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je n'arrive pas à le joindre, son téléphone est éteint.</span><span class=\"en\">I can't reach him, his phone is off.</span></div>\n<div class=\"ex\"><span class=\"fr\">On se retrouve à 20h au restaurant, je vous rejoins après le travail.</span><span class=\"en\">Let's meet at 8pm at the restaurant, I'll join you after work — an arranged spot.</span></div>\n<div class=\"ex\"><span class=\"fr\">J'ai rencontré ta sœur par hasard dans la rue.</span><span class=\"en\">I ran into your sister by chance in the street — unplanned.</span></div>\n</div></details><div class=\"rule\">\n<span class=\"fr\">Partir = quitter un lieu (le point de départ est souligné) ; s'en aller = quitter un lieu (insiste sur l'éloignement, parfois avec une nuance affective) ; quitter = se construit obligatoirement avec un complément (quitter quelqu'un/quelque chose).</span>\n<span class=\"en\">Partir (leave) highlights the point of departure; s'en aller (go away/off) stresses moving away, sometimes with emotional weight; quitter (leave/quit) always needs a direct object — you can't just \"quitter\" with nothing.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Le train part à 9h précises.</span><span class=\"en\">The train leaves at 9 sharp.</span></div>\n<div class=\"ex\"><span class=\"fr\">Va-t'en ! Je ne veux plus te voir.</span><span class=\"en\">Go away! I don't want to see you anymore.</span></div>\n<div class=\"ex\"><span class=\"fr\">Elle a quitté son travail pour voyager.</span><span class=\"en\">She left her job to travel — quitter needs the object son travail.</span></div>\n</div></details>"}, {"id": "b2c2-expressions-temporelles-avancees", "level": "C2", "frTitle": "Expressions temporelles avancées", "enSub": "pendant/pour/en, ça fait...que/il y a...que/voilà...que, dès/depuis/aussitôt que, à peine...que", "desc": "The finer points of expressing duration, elapsed time, and immediacy — several near-synonyms with genuinely different meanings.", "body": "<div class=\"rule\">\n<span class=\"fr\">Pendant = la durée pendant laquelle une action se déroule (souvent achevée) ; pour = la durée prévue, envisagée dès le départ (souvent avec un verbe de mouvement) ; en = le temps nécessaire pour accomplir une action, sa vitesse d'exécution.</span>\n<span class=\"en\">Pendant = the span an action actually took (often finished); pour = a duration planned or intended from the outset, often with a verb of movement; en = how much time it takes to complete something — a measure of speed.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il a vécu à Berlin pendant trois ans.</span><span class=\"en\">He lived in Berlin for three years — the actual duration of a completed period.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il part pour trois ans.</span><span class=\"en\">He's leaving for three years — the planned length of the stay, at the moment of departure.</span></div>\n<div class=\"ex\"><span class=\"fr\">Elle a fini le marathon en trois heures.</span><span class=\"en\">She finished the marathon in three hours — how long the action took to accomplish.</span></div>\n</div></details><div class=\"rule\">\n<span class=\"fr\">Ça fait... que / il y a... que / voilà... que + durée + que + verbe (présent ou passé composé) expriment la durée écoulée depuis le début d'une action ; depuis + point de départ ou durée s'utilise sans que.</span>\n<span class=\"en\">Ça fait/il y a/voilà + a length of time + que + verb (present or passé composé) all express how long something has been going on, counting from its start; depuis (since/for) expresses the same idea but stands alone, without que, and can take either a starting point or a duration.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Ça fait deux ans que j'apprends le français. = Il y a deux ans que j'apprends le français. = J'apprends le français depuis deux ans.</span><span class=\"en\">All three mean: I've been learning French for two years — counted from the start, action still ongoing.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il y a trois jours qu'il n'a pas donné de nouvelles.</span><span class=\"en\">It's been three days since he last gave any news — with a negative, the passé composé is common.</span></div>\n</div></details><div class=\"rule\">\n<span class=\"fr\">Dès marque le point de départ immédiat d'une action, avec insistance sur la rapidité ('dès que possible', 'dès le matin') ; aussitôt que / dès que + deux actions qui se suivent immédiatement ; à peine... que inverse le sujet et souligne la brièveté de l'intervalle entre les deux actions.</span>\n<span class=\"en\">Dès marks an immediate starting point, stressing how early or soon (\"as soon as possible\", \"from the very morning\"); aussitôt que/dès que link two actions that follow each other right away; à peine...que (hardly...when) inverts the subject and stresses just how short the gap between the two actions was.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Dès son arrivée, il s'est mis au travail.</span><span class=\"en\">As soon as he arrived, he got to work — dès + noun.</span></div>\n<div class=\"ex\"><span class=\"fr\">Aussitôt qu'il fait beau, tout le monde sort.</span><span class=\"en\">As soon as the weather's nice, everyone goes out.</span></div>\n<div class=\"ex\"><span class=\"fr\">À peine était-il arrivé qu'on lui donna une nouvelle mission.</span><span class=\"en\">He had hardly arrived when he was given a new mission — inversion (était-il) marks the literary register; in speech, il était à peine arrivé que... is more common.</span></div>\n</div></details><div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"indicateurs-temps\">→ Time markers</a>\n<a class=\"xref\" data-target=\"anteriorite-simultaneite-posteriorite\">→ Before / during / after</a>\n</div>"}, {"id": "b2c2-relatifs-composes-nuances", "level": "C2", "frTitle": "Pronoms relatifs composés : les nuances", "enSub": "lequel/auquel/duquel after a preposition, dont vs preposition + qui/lequel", "desc": "When the simple relatives (qui, que, où, dont) aren't enough — choosing between duquel and dont, and picking the right preposition to fuse with lequel.", "body": "<div class=\"rule\">\n<span class=\"fr\">Après une préposition (autre que de), on emploie qui pour une personne, ou lequel/laquelle/lesquels/lesquelles (contracté avec à ou de : auquel, duquel...) pour une chose ou une personne.</span>\n<span class=\"en\">After most prepositions (other than de on its own), use qui for a person, or a form of lequel — contracted with à or de into auquel/duquel and so on — for a thing, or for a person when the relation feels more formal or technical.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">La personne à qui j'ai parlé / à laquelle je me suis adressé.</span><span class=\"en\">The person I spoke to / whom I addressed — both work for people; à laquelle is more formal.</span></div>\n<div class=\"ex\"><span class=\"fr\">Le projet auquel je pense depuis des mois.</span><span class=\"en\">The project I've been thinking about for months — auquel = à + lequel, for a thing.</span></div>\n<div class=\"ex\"><span class=\"fr\">Les outils avec lesquels ils travaillent.</span><span class=\"en\">The tools they work with.</span></div>\n</div></details><div class=\"rule\">\n<span class=\"fr\">Dont remplace de qui / duquel quand le verbe ou l'expression se construit avec de (parler de, avoir besoin de, être fier de...). On garde duquel (plutôt que dont) quand le complément en de dépend d'un nom précédé d'une autre préposition (à côté duquel, au milieu duquel, à cause duquel...).</span>\n<span class=\"en\">Dont replaces de qui/duquel whenever the verb or expression itself is built with de (parler de, avoir besoin de, être fier de...). Duquel is kept, instead of dont, when the de-phrase is really part of a compound preposition — à côté de, au milieu de, à cause de — because dont can't be inserted inside another preposition.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Le livre dont je t'ai parlé.</span><span class=\"en\">The book I told you about — parler de + dont.</span></div>\n<div class=\"ex\"><span class=\"fr\">La maison à côté de laquelle il y a un parc.</span><span class=\"en\">The house next to which there's a park — à côté de is a compound preposition, so duquel/de laquelle is needed, not dont.</span></div>\n</div></details><div class=\"note\">\n<span class=\"fr\">Ne confondez pas dont possessif (= son/sa/ses) et dont complément d'un verbe : 'l'auteur dont j'ai lu tous les livres' (dont = ses livres) vs 'l'auteur dont je te parle' (parler de).</span>\n<span class=\"en\">Two different jobs hide under one word: dont can replace a possessive (\"whose\": the author whose books I've all read), or stand in for a verb's de-complement (the author I'm telling you about) — the sense only becomes clear from what follows.</span>\n</div><div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"relatifs-composes\">→ Compound relative pronouns</a>\n</div>"}, {"id": "c1-mise-en-relief", "level": "C1", "frTitle": "La mise en relief", "enSub": "Cleft sentences: pulling one element of a sentence into the spotlight", "desc": "French has several ways to spotlight one piece of information — more varied than English's single \"it is ... that\" cleft.", "body": "<div class=\"rule\">\n<span class=\"fr\">La mise en relief déplace ou encadre un élément de la phrase pour le souligner : en tête de phrase, repris par un pronom, ou encadré par c'est/ce sont... qui/que/dont/où.</span>\n<span class=\"en\">French has several ways to spotlight one piece of information — more varied than English's single \"it is ... that\" cleft.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Structure</th><th>Example</th></tr>\n<tr><td>Déplacement en tête de phrase</td><td class=\"fr\">Au sein des musées, la question du public est cruciale.</td></tr>\n<tr><td>Tête de phrase + reprise par pronom</td><td class=\"fr\">Cette proposition, elle pousse le curseur assez loin.</td></tr>\n<tr><td>C'est/ce sont + … + qui/que/dont/où</td><td class=\"fr\">Ce sont des gens qui viennent pour la première fois au musée.</td></tr>\n<tr><td>Ce qui/que/dont/à quoi... c'est</td><td class=\"fr\">Ce qui me frappe, c'est la définition française de la culture.</td></tr>\n<tr><td>C'est + … + que (conjonction)</td><td class=\"fr\">C'est grâce au pass Culture que j'ai pu aller à ce concert.</td></tr>\n<tr><td>Si… c'est</td><td class=\"fr\">Si le musée n'a pas de primo-visiteurs, c'est faute d'innovation.</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">C'est l'une des réussites du pass Culture que d'avoir fait entrer certains jeunes dans les librairies.</span><span class=\"en\">One of the pass Culture's successes is having gotten young people into bookshops — c'est ... que frames an infinitive clause as the highlighted element.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Si... c'est s'emploie pour la mise en relief de la cause ou du but.</span>\n<span class=\"en\">Si...c'est (also covered under the five values of si) is really a cleft construction in disguise, dedicated to spotlighting a cause or purpose.</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"b2c2-ce-qui-que-dont-relief\">→ Ce qui/ce que/ce dont... c'est (renforcé)</a>\n<a class=\"xref\" data-target=\"c1-ce-demonstratif\">→ Ce: pronom démonstratif neutre</a>\n<a class=\"xref\" data-target=\"c1-si-cinq-valeurs\">→ Les cinq valeurs de si</a>\n</div>"}, {"id": "b2c2-ce-qui-que-dont-relief", "level": "C2", "frTitle": "Ce qui, ce que, ce dont... c'est : la mise en relief renforcée", "enSub": "Using ce qui/ce que/ce dont/ce à quoi as a cleft subject to spotlight an idea", "desc": "A step up from the basic cleft: opening a sentence with an entire relative clause (ce qui..., ce que..., ce dont...) before naming what it refers to.", "body": "<div class=\"rule\">\n<span class=\"fr\">Ce qui / ce que / ce dont / ce à quoi + proposition, c'est... reprend et met en valeur toute une idée avant de la nommer. Le choix du pronom dépend de la construction du verbe qui suit (sujet : ce qui ; COD : ce que ; verbe + de : ce dont ; verbe + à : ce à quoi).</span>\n<span class=\"en\">Ce qui/ce que/ce dont/ce à quoi + clause, c'est... restates and highlights a whole idea before naming it. Which pronoun to use depends on how the verb inside the clause is built: subject → ce qui, direct object → ce que, verb + de → ce dont, verb + à → ce à quoi.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Ce qui m'inquiète, c'est le silence des autorités.</span><span class=\"en\">What worries me is the authorities' silence — ce qui, because inquiéter has no preposition, m'inquiète is the verb whose subject is being named.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ce que je préfère, c'est travailler tôt le matin.</span><span class=\"en\">What I prefer is working early in the morning — ce que, préférer + COD.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ce dont on a le plus besoin, c'est de temps.</span><span class=\"en\">What's needed most is time — ce dont, avoir besoin de.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ce à quoi je pense sans cesse, c'est à mon prochain voyage.</span><span class=\"en\">What I keep thinking about is my next trip — ce à quoi, penser à.</span></div>\n</div></details><div class=\"rule\">\n<span class=\"fr\">La construction peut aussi s'inverser : c'est... que reprend un élément déjà énoncé pour insister dessus, en particulier avec une cause ou un moyen.</span>\n<span class=\"en\">The construction can also run the other way: c'est...que picks up something already stated and drives the emphasis home, especially for a cause or a means.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">C'est en pratiquant tous les jours qu'on progresse.</span><span class=\"en\">It's by practicing every day that you improve — the means, foregrounded.</span></div>\n</div></details><div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"mise-en-relief\">→ Cleft sentences</a>\n<a class=\"xref\" data-target=\"c1-mise-en-relief\">→ Cleft sentences (C1)</a>\n</div>"}, {"id": "b2c2-negation-nuances", "level": "C2", "frTitle": "Les nuances de la négation", "enSub": "ne...guère, ne...que, ni...ni, sans...ni, nul, aucun", "desc": "Beyond ne...pas: restrictive and literary negations that narrow, soften, or completely rule something out.", "body": "<div class=\"rule\">\n<span class=\"fr\">Ne... que n'est pas une vraie négation mais une restriction (= seulement). Ne... guère (= pas beaucoup, littéraire/soutenu) nuance l'intensité plutôt que de nier totalement.</span>\n<span class=\"en\">Ne...que isn't a true negation — it's a restriction meaning only. Ne...guère (hardly, not much — a more literary/formal register) softens the negation to an intensity, rather than a flat denial.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je n'ai que deux frères.</span><span class=\"en\">I only have two brothers — que restricts, it doesn't negate having brothers.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il ne travaille guère ces derniers temps.</span><span class=\"en\">He's hardly been working lately — softer than il ne travaille pas.</span></div>\n</div></details><div class=\"rule\">\n<span class=\"fr\">Ni... ni (+ ne) relie deux éléments niés ensemble ; sans... ni combine sans (déjà négatif) avec un second élément introduit par ni, sans répéter sans.</span>\n<span class=\"en\">Ni...ni (+ ne) links two elements negated together (neither...nor); sans...ni combines sans (already negative on its own) with a second element introduced by ni, without repeating sans.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il n'a ni argent ni patience.</span><span class=\"en\">He has neither money nor patience.</span></div>\n<div class=\"ex\"><span class=\"fr\">Elle est partie sans un mot, ni un regard en arrière.</span><span class=\"en\">She left without a word, or a backward glance.</span></div>\n</div></details><div class=\"rule\">\n<span class=\"fr\">Nul et aucun(e) sont des déterminants (et pronoms) négatifs signifiant 'pas un seul' ; nul est plus littéraire, aucun est d'usage courant. Tous deux s'accompagnent de ne et s'accordent avec le nom (surtout au singulier).</span>\n<span class=\"en\">Nul and aucun(e) are negative determiners (and pronouns) meaning \"not a single one\"; nul is the more literary of the two, aucun the everyday choice. Both pair with ne and agree with the noun, and are almost always singular.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Aucune décision n'a encore été prise.</span><span class=\"en\">No decision has been made yet.</span></div>\n<div class=\"ex\"><span class=\"fr\">Nul ne peut ignorer les conséquences de ce choix.</span><span class=\"en\">No one can ignore the consequences of this choice — nul as a pronoun, formal register.</span></div>\n</div></details><div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"negation\">→ Negation</a>\n<a class=\"xref\" data-target=\"restriction\">→ Restriction (ne...que)</a>\n</div>"}, {"id": "c1-imparfait-pc", "level": "C1", "frTitle": "Imparfait ou passé composé ?", "enSub": "Choosing between imparfait and passé composé", "desc": "English often translates both the same way, so the choice is about the speaker's angle, not the English tense used.", "body": "<div class=\"rule\">\n<span class=\"fr\">Le passé composé présente une action achevée et bornée dans le temps ; l'imparfait décrit une situation sans en préciser le début ni la fin.</span>\n<span class=\"en\">English often translates both the same way, so the choice is about the speaker's angle, not the English tense used.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Ce week-end, il a fait chaud.</span><span class=\"en\">It was hot this weekend — a finished, bounded fact; implicitly it's over.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ce week-end, il faisait chaud, et du coup je suis allé à la mer.</span><span class=\"en\">It was hot, so I went to the seaside — imparfait sets the scene, passé composé is the event on top of it.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Dans un récit, l'imparfait est le décor (arrière-plan), le passé composé fait avancer l'action.</span>\n<span class=\"en\">Think theatre: imparfait = the set and backdrop, passé composé = what the actors actually do.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il pleuvait quand nous sommes rentrés.</span><span class=\"en\">It was raining (background) when we got back (event).</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Il a toujours habité dans la même maison (et il y habite encore). / Jusqu'à maintenant, il habitait là, mais il a déménagé.</span>\n<span class=\"en\">Toujours/jamais/jusqu'à maintenant + passé composé = the situation continues today; the same words + imparfait = it has since ended.</span>\n</div>"}, {"id": "c1-pc-ps", "level": "C1", "frTitle": "Passé composé ou passé simple ?", "enSub": "Passé simple vs passé composé", "desc": "In a narrative, passé simple and passé composé are interchangeable — the choice is register, not meaning: passé simple is written/formal, mostly 3rd person.", "body": "<div class=\"rule\">\n<span class=\"fr\">Le passé simple et le passé composé expriment tous deux une action achevée ; le passé simple appartient surtout à l'écrit littéraire, journalistique ou historique.</span>\n<span class=\"en\">In a narrative, passé simple and passé composé are interchangeable — the choice is register, not meaning: passé simple is written/formal, mostly 3rd person.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Nous étions presque au sommet quand la foudre frappa. = ... quand la foudre a frappé.</span><span class=\"en\">We were nearly at the summit when the lightning struck — imparfait sets the scene either way.</span></div>\n<div class=\"ex\"><span class=\"fr\">Je vins, je vis, je conquis.</span><span class=\"en\">I came, I saw, I conquered — a string of passé simple verbs gives rhythm and punch that passé composé can't match.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Il partit sans se retourner. Je ne l'ai jamais oublié.</span>\n<span class=\"en\">Watch out: passé simple has no link to the present moment; passé composé can. Here \"leaving\" is closed (passé simple) but \"never forgetting\" still holds true now (passé composé) — the two combine in the same passage.</span>\n</div>"}, {"id": "c1-concordance-1", "level": "C1", "frTitle": "Concordance des temps (1) — verbe principal au présent ou au futur", "enSub": "Sequence of tenses when the main verb is present/future", "desc": "The tense of the second verb depends purely on the timing of its action relative to the main verb — not on some fixed rule of thumb.", "body": "<div class=\"rule\">\n<span class=\"fr\">Quand le verbe principal est au présent ou au futur, le second verbe se met au présent (simultanéité), à un temps du passé (antériorité) ou au futur/subjonctif (postériorité).</span>\n<span class=\"en\">The tense of the second verb depends purely on the timing of its action relative to the main verb — not on some fixed rule of thumb.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Relation</th><th>Tense of 2nd verb</th><th>Example</th></tr>\n<tr><td>Same time</td><td>présent (indicatif/subjonctif)</td><td class=\"fr\">Je sais qu'il est parti… non — qu'il part.</td></tr>\n<tr><td>Before</td><td>passé composé / imparfait / plus-que-parfait / futur antérieur</td><td class=\"fr\">Je pense qu'il est parti ce matin.</td></tr>\n<tr><td>After</td><td>futur / subjonctif présent</td><td class=\"fr\">J'espère que vous irez bientôt mieux.</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Tu iras jouer quand tu auras fini tes devoirs.</span><span class=\"en\">You'll play once you've finished your homework — futur antérieur for a future action completed before another future action.</span></div>\n</div></details>"}, {"id": "c1-concordance-2", "level": "C1", "frTitle": "Concordance des temps (2) — verbe principal au passé ou au conditionnel", "enSub": "Sequence of tenses when the main verb is past/conditional", "desc": "French is stricter than English here: an action further back in the past than the main past verb needs the plus-que-parfait, even when English just uses the simple past.", "body": "<div class=\"rule\">\n<span class=\"fr\">Quand le verbe principal est au passé, le français exige souvent le plus-que-parfait là où l'anglais garde le prétérit ou le present perfect.</span>\n<span class=\"en\">French is stricter than English here: an action further back in the past than the main past verb needs the plus-que-parfait, even when English just uses the simple past.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">La police a demandé à quelle heure ils étaient partis.</span><span class=\"en\">The Police asked what time they left/had left — French needs plus-que-parfait.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ils ont dit qu'ils viendraient demain.</span><span class=\"en\">They said they would come tomorrow — conditionnel présent for \"after the main action\".</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Après un verbe principal au conditionnel, le second verbe (souvent au subjonctif) ne change pas selon le moment.</span>\n<span class=\"en\">After a conditional main verb, the dependent verb — often subjunctive — stays present or past subjunctive regardless of relative timing.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">J'aurais voulu qu'elle soit là.</span><span class=\"en\">I would have liked her to be there.</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref back-style\" data-target=\"c1-concordance-1\">← Sequence of tenses (1) — present/future</a>\n</div>"}, {"id": "c1-temps-recit-passe", "level": "C1", "frTitle": "Maîtriser les temps du récit au passé", "enSub": "Six past tenses, six distinct jobs: sequencing, backgrounding, and flash-forwarding a narrative", "body": "<div class=\"rule\">\n<span class=\"fr\">Chaque temps du passé a une valeur précise dans un récit : le plus-que-parfait exprime un fait antérieur à un autre fait passé ; le passé simple exprime un fait ponctuel sans rapport direct avec le présent (ou une action de premier plan) ; l'imparfait exprime une habitude, une description ou une action en cours d'accomplissement ; l'imparfait des verbes aller/devoir/être sur le point de + infinitif exprime un futur dans le passé ; le conditionnel présent peut exprimer, comme l'imparfait, un futur dans le passé.</span>\n<span class=\"en\">A written narrative typically layers several past tenses at once, each doing a distinct job — this is the literary equivalent of camera angles: which event is foreground, which is backstory, which hasn't happened yet from the narrator's vantage point.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Temps</th><th>Valeur</th></tr>\n<tr><td>Plus-que-parfait</td><td>fait antérieur à un autre fait passé</td></tr>\n<tr><td>Passé simple</td><td>fait ponctuel sans rapport avec le présent ; action de premier plan</td></tr>\n<tr><td>Imparfait</td><td>habitude, description, action en cours d'accomplissement dans le passé</td></tr>\n<tr><td>Imparfait de aller/devoir/être sur le point de + infinitif</td><td>futur dans le passé (n'exploite ni le futur simple ni le futur antérieur)</td></tr>\n<tr><td>Conditionnel présent</td><td>futur dans le passé (registre plus littéraire)</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Suite au succès d'Horizon, un traité avait été signé entre plusieurs nations... Mais la Chine investit des milliards de dollars... Son objectif était simple et pratique : utiliser sa masse critique pour former la plus grande partie innovante qui allait gagner la bataille mondiale de l'intelligence artificielle.</span><span class=\"en\">Plus-que-parfait (background event before the story's \"now\"), passé simple (the main narrated events), imparfait (ongoing description), and \"allait gagner\" (imparfait of aller + infinitive = future-in-the-past) all work together in one passage.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Modifier les temps verbaux d'un récit permet de créer une ambiance ou un rythme particulier, de suciter des émotions et d'influencer la manière dont le récit est perçu par le lecteur — mais cela ne change jamais le contenu factuel de l'histoire.</span>\n<span class=\"en\">Choosing passé simple over passé composé (or imparfait over passé composé) changes the feel of a passage — distance vs. immediacy, a finished era vs. a lingering state — without changing what actually happened.</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"passe-simple\">→ Le passé simple (core grammar)</a>\n<a class=\"xref\" data-target=\"plus-que-parfait\">→ Le plus-que-parfait (core grammar)</a>\n<a class=\"xref\" data-target=\"c1-imparfait-pc\">→ Imparfait ou passé composé ? (fiche anglophones)</a>\n</div>", "desc": "Plus-que-parfait, passé simple, imparfait, and the imparfait/conditionnel of aller+infinitive each carry a distinct narrative job when layered in one passage."}, {"id": "c1-place-adverbes", "level": "C1", "frTitle": "La place des adverbes", "enSub": "Where French adverbs go", "desc": "Unlike English, French almost never puts a frequency/manner adverb between subject and verb — it sits after the (auxiliary) verb instead.", "body": "<div class=\"rule\">\n<span class=\"fr\">Avec un verbe simple, l'adverbe se place après le verbe ; avec un temps composé, il se glisse entre l'auxiliaire et le participe passé.</span>\n<span class=\"en\">Unlike English, French almost never puts a frequency/manner adverb between subject and verb — it sits after the (auxiliary) verb instead.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il chante souvent. (pas \"Il souvent chante\")</span><span class=\"en\">He often sings — adverb after the verb, not before.</span></div>\n<div class=\"ex\"><span class=\"fr\">Je suis bien arrivé. / On devrait toujours refuser.</span><span class=\"en\">With compound tenses, the adverb goes between the auxiliary and the past participle.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Elle a habité ici. (pas \"Elle a ici habité\")</span>\n<span class=\"en\">Watch out: place adverbs (ici, là, partout...) go after the past participle, not between it and the auxiliary.</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">La place de l'adverbe peut changer le sens de la phrase.</span>\n<span class=\"en\">Position isn't just style — it can flip the meaning.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Elle ne travaille toujours pas. ≠ Elle ne travaille pas toujours.</span><span class=\"en\">She still doesn't work ≠ She doesn't always work.</span></div>\n</div></details>"}, {"id": "c1-voix-passive", "level": "C1", "frTitle": "Choisir la voix active ou passive", "enSub": "Active vs passive voice, and passive-flavoured verbs", "desc": "Only transitive verbs (with a direct object) can go passive. The passive voice lets you foreground the process or the result instead of who did it.", "body": "<div class=\"rule\">\n<span class=\"fr\">Seuls les verbes ayant un COD peuvent se mettre au passif. Formation : être (au temps du verbe actif) + participe passé.</span>\n<span class=\"en\">Only transitive verbs (with a direct object) can go passive. The passive voice lets you foreground the process or the result instead of who did it.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Les processus de justice restaurative sont animés par des personnes spécialement formées.</span><span class=\"en\">Restorative-justice processes are run by specially trained people — passive shifts focus onto the process, not the people running it.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Le complément d'agent est en général introduit par \"par\", mais par \"de\" avec les verbes de sentiment (admirer, aimer, détester, estimer...) et certains verbes comme connaître, oublier, ignorer.</span>\n<span class=\"en\">Most agent complements use par (\"by\"), but a specific set of feeling/state verbs use de instead — a common near-miss for learners.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il est aimé de tous. / Il est détesté de ses voisins.</span><span class=\"en\">He is loved by everyone. / He is hated by his neighbours — de, not par, after verbs of feeling.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Au passif, il n'y a pas de complément d'agent quand le sujet actif était \"on\", quand il est sous-entendu, ou quand on ne veut/peut pas le nommer.</span>\n<span class=\"en\">Three reasons a passive sentence can drop the \"by ...\" agent entirely: the active subject was the impersonal on, it's understood from context, or the speaker chooses not to name it.</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Certains verbes pronominaux (se dérouler, se vendre, se boire, s'apprendre, se lire...) sont à la forme active mais ont un sens passif ; à l'inverse, certains verbes non pronominaux (subir, endurer, souffrir, être la cible de...) sont actifs en forme mais passifs en sens.</span>\n<span class=\"en\">Two more disguises for the passive: some pronominal verbs read as active but mean passive (this wine drinks well = is drunk), and some ordinary verbs mean \"have X done to you\" without any passive marking at all.</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Se faire, se laisser, se voir, s'entendre, se sentir + infinitif = sens passif. Aux temps composés, le participe passé s'accorde avec le COD placé avant s'il fait l'action de l'infinitif ; se faire et se laisser restent invariables.</span>\n<span class=\"en\">The pronominal-passive family from Fiche 1 gets one more nuance here: se faire and se laisser never agree, even when the other rule would call for it — a fixed exception worth memorizing as such.</span>\n</div>\n<div class=\"note\">\n<span class=\"fr\">Durant les médiations restauratives, il est recouru au bâton de parole.</span>\n<span class=\"en\">The impersonal passive (il est + past participle) is mostly found in administrative and legal writing — recognize it in formal texts more than you'll need to produce it.</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"b2c2-voix-passive-nuances\">→ La voix passive : agent, de/par, se faire</a>\n<a class=\"xref\" data-target=\"c1-pronominal-passif\">→ Les verbes pronominaux à sens passif (fiche anglophones)</a>\n</div>"}, {"id": "c1-pronominal-passif", "level": "C1", "frTitle": "Les verbes pronominaux à sens passif", "enSub": "Pronominal verbs used with a passive meaning", "desc": "French often prefers a pronominal verb (se + verb) to the passive voice, to avoid naming who does the action. English has no real equivalent — it falls back on the passive.", "body": "<div class=\"rule\">\n<span class=\"fr\">On utilise souvent un verbe pronominal (se + verbe) à la place du passif pour ne pas nommer l'agent de l'action.</span>\n<span class=\"en\">French often prefers a pronominal verb (se + verb) to the passive voice, to avoid naming who does the action. English has no real equivalent — it falls back on the passive.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Ça se dit souvent.</span><span class=\"en\">This is often said (we don't know by whom) — equals On dit souvent ça / C'est souvent dit.</span></div>\n<div class=\"ex\"><span class=\"fr\">Cet emballage se recycle.</span><span class=\"en\">This packaging should be recycled — the construction can also carry a sense of obligation.</span></div>\n<div class=\"ex\"><span class=\"fr\">L'alphabet s'apprend facilement en chantant.</span><span class=\"en\">The alphabet is easy to learn through song — only 3rd person, subject always inanimate.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Se faire, se laisser, se voir, s'entendre + infinitif : le sujet subit l'action ou la fait faire par quelqu'un d'autre.</span>\n<span class=\"en\">These four constructions + infinitive mean the subject isn't doing the action himself — either something is done for him, or something happens to him. Unlike the first pattern, the subject here is always animate, in any person.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je me suis fait construire une maison.</span><span class=\"en\">I had a house built for me.</span></div>\n<div class=\"ex\"><span class=\"fr\">Elle s'est fait agresser en rentrant chez elle.</span><span class=\"en\">She got mugged going home.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il se laisse pousser les cheveux.</span><span class=\"en\">He's letting his hair grow long.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Avec se faire/laisser/voir/entendre + infinitif, le participe passé reste invariable quand le sujet ne fait pas l'action de l'infinitif.</span>\n<span class=\"en\">Watch out: with these constructions in the passé composé, the past participle does NOT agree — the subject isn't the one performing the infinitive's action. <em>La gagnante s'est vu décerner une médaille</em> (no agreement: she didn't give the medal). Compare <em>elle s'est vue tomber</em> (agrees: she is the one falling).</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"b2c2-voix-passive-nuances\">→ La voix passive : agent, de/par, se faire</a>\n</div>"}, {"id": "b2c2-voix-passive-nuances", "level": "C2", "frTitle": "La voix passive : agent, de/par, se faire", "enSub": "When to omit the agent, de vs par, and se faire + infinitive for something happening to you", "desc": "Refinements on the passive voice: when the agent can (or must) disappear, which preposition introduces it, and the se faire + infinitive pattern for things that happen to someone.", "body": "<div class=\"rule\">\n<span class=\"fr\">Le complément d'agent est souvent omis : quand le sujet actif est on, quand il est évident ou déjà connu du contexte, ou quand on préfère ne pas le nommer (discrétion, généralité).</span>\n<span class=\"en\">The agent complement is often dropped entirely: when the active subject would have been on, when it's obvious or already established by context, or when the speaker deliberately avoids naming it.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Le suspect a été arrêté hier soir.</span><span class=\"en\">The suspect was arrested last night — no need to name the police, it's understood.</span></div>\n<div class=\"ex\"><span class=\"fr\">De nouvelles mesures ont été annoncées.</span><span class=\"en\">New measures have been announced — the announcer isn't the point, the measures are.</span></div>\n</div></details><div class=\"rule\">\n<span class=\"fr\">Par introduit l'agent dans la majorité des cas ; de s'emploie avec les verbes de sentiment, d'opinion ou de perception (aimer, détester, admirer, respecter, connaître, entourer, couvrir, accompagner...) et dans des expressions figées.</span>\n<span class=\"en\">Par introduces the agent in most cases; de is used instead with verbs of feeling, opinion, or general perception/state (aimer, détester, admirer, respecter, connaître, entourer, couvrir, accompagner...) and in a number of fixed expressions.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Le pont a été détruit par la tempête.</span><span class=\"en\">The bridge was destroyed by the storm — par, a concrete action.</span></div>\n<div class=\"ex\"><span class=\"fr\">Elle est respectée de tous ses collègues.</span><span class=\"en\">She's respected by all her colleagues — de, a feeling/opinion verb.</span></div>\n<div class=\"ex\"><span class=\"fr\">La ville est entourée de collines.</span><span class=\"en\">The town is surrounded by hills — de, a descriptive, static state.</span></div>\n</div></details><div class=\"rule\">\n<span class=\"fr\">Se faire + infinitif exprime qu'un sujet animé subit une action, souvent désagréable, causée par un tiers (parfois non exprimé) : un sens proche du passif, mais avec un sujet grammaticalement actif.</span>\n<span class=\"en\">Se faire + infinitive expresses that an animate subject undergoes an action, often an unpleasant one, caused by someone else (who may go unnamed) — a meaning close to the passive, even though the subject stays grammatically active.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il s'est fait voler son vélo.</span><span class=\"en\">His bike got stolen (from him) — the action happened to him, agent not named.</span></div>\n<div class=\"ex\"><span class=\"fr\">Elle s'est fait renvoyer de son poste.</span><span class=\"en\">She got fired from her job.</span></div>\n</div></details><div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"passif\">→ The passive voice</a>\n<a class=\"xref\" data-target=\"c1-voix-passive\">→ Active vs passive voice (C1)</a>\n<a class=\"xref\" data-target=\"c1-pronominal-passif\">→ Pronominal verbs with passive meaning</a>\n</div>"}, {"id": "c1-participe-gerondif-adjectif-verbal", "level": "C1", "frTitle": "Le participe présent, le gérondif et l'adjectif verbal", "enSub": "Three -ant forms that look alike but work differently: verbal form, adverbial clause, and true adjective", "body": "<div class=\"rule\">\n<span class=\"fr\">Le participe présent se construit sur le radical de \"nous\" au présent de l'indicatif + -ant. Il exprime surtout une action ou un état, s'emploie souvent à l'écrit à la place d'une relative avec \"qui\", et peut avoir une valeur causale ou exprimer la simultanéité. Il est invariable.</span>\n<span class=\"en\">The participe présent is a verb form standing in for a \"qui\" relative clause: tous les supports permettant (= qui permettent) d'extériorister des émotions. It never agrees.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Tous les supports permettant d'extérioriser des émotions sont des supports ayant une vraie valeur thérapeutique.</span><span class=\"en\">All media that allow emotions to be expressed are media that have real therapeutic value — permettant and ayant both replace \"qui + verb\".</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Le gérondif se construit avec en + participe présent. Il peut exprimer la manière, le temps (simultanéité), la condition ou la cause. Avec \"tout\", il peut exprimer l'opposition.</span>\n<span class=\"en\">The gérondif always attaches to the sentence's own subject and is introduced by en — it answers \"how/when/if\" something is done, and tout + gérondif flips it into a concession (\"while/even though doing X\").</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">En sortant du métro, un match se termine.</span><span class=\"en\">As he's coming out of the metro, a match is ending — simultaneity/manner.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il continue de jouer tout en sachant que ses chances de gagner sont très faibles.</span><span class=\"en\">He keeps playing even though he knows his odds of winning are very low — tout + gérondif = opposition/concession.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">L'adjectif verbal est un participe présent employé comme adjectif : il s'accorde donc avec le nom, le sujet ou le complément auquel il se rapporte, et n'a jamais de complément d'objet. Certains adjectifs verbaux ont une orthographe différente de celle du participe présent correspondant.</span>\n<span class=\"en\">The adjectif verbal is the one of the three that behaves like a normal adjective — it agrees in gender and number, and a fixed list of common ones is spelled differently from their participe présent twin (below). Never has a direct object of its own.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Participe présent</th><th>Adjectif verbal</th></tr>\n<tr><td>adhérant, communiquant, convainquant, convergeant, différant, équivalant, excellant, naviguant, fatiguant, négligeant, précédant, provoquant, suffoquant</td><td>adhérent, communicant, convaincant, convergent, différent, équivalent, excellent, navigant, fatigant, négligent, précédent, provocant, suffocant</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Une offre d'une profession hallucinante.</span><span class=\"en\">A dizzying job offer — hallucinante agrees with \"offre\" like any adjective, with no object of its own.</span></div>\n<div class=\"ex\"><span class=\"fr\">Les arguments contre les jeux d'argent sont rarement convaincants auprès des joueurs pathologiques.</span><span class=\"en\">Arguments against gambling are rarely convincing to pathological gamblers — convaincants (adjectif verbal spelling, with a c) not convainquant.</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"b2c2-gerondif-participe-present\">→ Gérondif ou participe présent ? (renforcé)</a>\n<a class=\"xref\" data-target=\"gerondif\">→ Le gérondif (core grammar)</a>\n</div>", "desc": "Participe présent replaces a qui-clause; gérondif (en + -ant) answers how/when; adjectif verbal agrees like any adjective — and a handful are spelled differently from their participe présent twin."}, {"id": "b2c2-gerondif-participe-present", "level": "C2", "frTitle": "Gérondif ou participe présent ?", "enSub": "Same subject + simultaneity (gérondif) vs an invariable, written substitute for a relative clause (participe présent)", "desc": "Two forms that look alike (both end in -ant) but do different jobs: the gérondif always modifies the main verb's own subject, the participe présent behaves like an invariable relative clause.", "body": "<div class=\"rule\">\n<span class=\"fr\">Le gérondif (en + participe présent) exprime la simultanéité, la manière, le temps ou la condition, et se rapporte obligatoirement au sujet du verbe principal — les deux actions doivent avoir le même sujet.</span>\n<span class=\"en\">The gérondif (en + present participle) expresses simultaneity, manner, time, or condition, and must refer back to the main verb's own subject — both actions have to share the same doer.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il écoute de la musique en travaillant.</span><span class=\"en\">He listens to music while working — same subject (il) for both actions.</span></div>\n<div class=\"ex\"><span class=\"fr\">C'est en forgeant qu'on devient forgeron.</span><span class=\"en\">It's by forging that one becomes a blacksmith — manner/means.</span></div>\n<div class=\"ex\"><span class=\"fr\">Tout en comprenant ses raisons, je ne suis pas d'accord.</span><span class=\"en\">While I do understand his reasons, I don't agree — tout en reinforces the simultaneity/concession and is common with an opposition nuance.</span></div>\n</div></details><div class=\"rule\">\n<span class=\"fr\">Le participe présent (invariable, sans en) équivaut souvent à une proposition relative à l'écrit ; il peut avoir un sujet différent de celui du verbe principal, ce que le gérondif ne permet jamais.</span>\n<span class=\"en\">The participe présent (invariable, no en) often stands in for a relative clause in writing; unlike the gérondif, it can have a subject of its own, different from the main verb's subject.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Les touristes visitant le musée doivent réserver en ligne.</span><span class=\"en\">Tourists visiting the museum must book online — equals les touristes qui visitent.</span></div>\n<div class=\"ex\"><span class=\"fr\">Le temps se dégradant, la randonnée a été annulée.</span><span class=\"en\">The weather turning bad, the hike was cancelled — a subject of its own (le temps), independent of the main clause's subject (la randonnée); impossible with a gérondif.</span></div>\n</div></details><div class=\"note\">\n<span class=\"fr\">Le participe présent est invariable (contrairement à l'adjectif verbal correspondant, qui s'accorde) : 'une décision surprenant tout le monde' (participe présent) vs 'une décision surprenante' (adjectif).</span>\n<span class=\"en\">The participe présent never agrees (unlike the matching verbal adjective, which does): a decision surprising everyone (participe présent, invariable) vs a surprising decision (adjective, agrees) — see the dedicated C1 lesson for the full three-way contrast.</span>\n</div><div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"gerondif\">→ The gérondif</a>\n<a class=\"xref\" data-target=\"c1-participe-gerondif-adjectif-verbal\">→ Gérondif, participe présent, adjectif verbal (C1)</a>\n</div>"}, {"id": "c1-si-whether-if", "level": "C1", "frTitle": "Si : question indirecte ou hypothèse ?", "enSub": "Si = \"whether\" or \"if\"?", "desc": "Test: if si can be translated by BOTH \"if\" and \"whether\", it's an indirect question. If only \"if\" works, it's a hypothesis (conditional clause).", "body": "<div class=\"rule\">\n<span class=\"fr\">Si introduit soit une question indirecte (= whether/if), soit une hypothèse (= if seulement).</span>\n<span class=\"en\">Test: if si can be translated by BOTH \"if\" and \"whether\", it's an indirect question. If only \"if\" works, it's a hypothesis (conditional clause).</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je me demande si elle accepte cette offre.</span><span class=\"en\">I wonder if/whether she accepts this offer — indirect question, any tense can follow.</span></div>\n<div class=\"ex\"><span class=\"fr\">Si elle accepte, je serai très contente.</span><span class=\"en\">If she accepts, I'll be delighted — hypothesis; \"whether\" is impossible here.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Dans une hypothèse, si n'est jamais suivi du futur ou du conditionnel : la séquence des temps est fixe.</span>\n<span class=\"en\">In a conditional clause (not an indirect question), si is never followed by a future or conditional verb — the tense pairing is strict.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Si + …</th><th>… + main clause</th></tr>\n<tr><td class=\"fr\">présent</td><td class=\"fr\">présent / futur / futur proche / impératif</td></tr>\n<tr><td class=\"fr\">imparfait</td><td class=\"fr\">conditionnel présent</td></tr>\n<tr><td class=\"fr\">plus-que-parfait</td><td class=\"fr\">conditionnel passé</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Si elle venait, je resterais.</span><span class=\"en\">If she came, I would stay.</span></div>\n<div class=\"ex\"><span class=\"fr\">Si elle était venue, je serais restée.</span><span class=\"en\">Had she come, I would have stayed.</span></div>\n</div></details>\n<div class=\"xref-box\"><span class=\"xref-label\">See also:</span><a class=\"xref\" data-target=\"c1-si-cinq-valeurs\">→ Les cinq valeurs de si (textbook)</a></div>"}, {"id": "c1-si-cinq-valeurs", "level": "C1", "frTitle": "Les cinq valeurs de si", "enSub": "Si: condition, concession, cleft emphasis, comparison, or intensity — five different jobs, one word", "desc": "This goes well beyond the whether/if distinction (Fiche 3) — in narrative and essay French, si has five distinct jobs, each with its own structure.", "body": "<div class=\"rule\">\n<span class=\"fr\">Si est un mot polysémique : selon le contexte, il exprime la condition, la concession, la mise en relief, la comparaison ou la conséquence (intensité). Attention aux contresens !</span>\n<span class=\"en\">This goes well beyond the whether/if distinction (Fiche 3) — in narrative and essay French, si has five distinct jobs, each with its own structure.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Value</th><th>Structure</th><th>≈ Meaning</th></tr>\n<tr><td>Condition / hypothèse</td><td class=\"fr\">si + indicatif, …</td><td>à condition que / dans l'hypothèse où</td></tr>\n<tr><td>Concession</td><td class=\"fr\">si + adj. + subj. (sujet inversé) / si + adj. + que + subj.</td><td>certes… mais / il est vrai que… mais</td></tr>\n<tr><td>Mise en relief</td><td class=\"fr\">si + proposition, c'est…</td><td>highlights the cause or purpose</td></tr>\n<tr><td>Comparaison (négative)</td><td class=\"fr\">ne pas si + adj. + que</td><td>aussi (as ... as)</td></tr>\n<tr><td>Conséquence / intensité</td><td class=\"fr\">si + adj. + que + proposition</td><td>tellement (so ... that)</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Si motivé soit-il, il ne pourra pas réduire son empreinte carbone par trois en un tel délai.</span><span class=\"en\">However motivated he is, he won't be able to cut his carbon footprint threefold in that time — concession, subject-verb inversion after si + adjective.</span></div>\n<div class=\"ex\"><span class=\"fr\">Si cette technologie a pu être mise en place à Tahiti, c'est parce que l'eau froide des profondeurs est rapidement accessible.</span><span class=\"en\">This technology could be set up in Tahiti because deep cold water is quickly accessible there — si...c'est puts the cause in the spotlight.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ce dispositif n'est pas si efficace qu'on le prétend.</span><span class=\"en\">This system isn't as effective as claimed — negative comparison, si...que = aussi...que.</span></div>\n<div class=\"ex\"><span class=\"fr\">Le niveau des nappes phréatiques est si bas que l'on s'attend à des pénuries d'eau.</span><span class=\"en\">Groundwater levels are so low that shortages are expected — intensity/consequence, si...que = tellement...que.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">De nombreuses combinaisons de temps sont possibles, mais si-condition est toujours suivi d'un verbe à l'indicatif.</span>\n<span class=\"en\">Whatever the tense pairing, the si-condition clause itself is always indicative — the future/conditional restriction from Fiche 3 still holds for this first value only.</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"b2c2-expressions-condition-avancees\">→ Les expressions de condition avancées</a>\n<a class=\"xref\" data-target=\"c1-si-whether-if\">→ Si: \"whether\" or \"if\"? (fiche anglophones)</a>\n</div>"}, {"id": "b2c2-expressions-condition-avancees", "level": "C2", "frTitle": "Les expressions de condition avancées", "enSub": "pourvu que, à moins que, en admettant que, selon que, du moment que", "desc": "A wider family of conditional connectors beyond si, split by whether they take the subjunctive or the indicative.", "body": "<div class=\"rule\">\n<span class=\"fr\">La plupart des conjonctions de condition autres que si se construisent avec le subjonctif : à condition que, pourvu que, à moins que, en admettant que, en supposant que, si tant est que, pour peu que, pour autant que, sans que.</span>\n<span class=\"en\">Most condition conjunctions other than si themselves take the subjunctive: à condition que, pourvu que (provided that), à moins que (unless), en admettant que/en supposant que (assuming that), si tant est que (if indeed), pour peu que (if only slightly), pour autant que (as far as), sans que (without).</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Tu peux venir, à condition que tu sois à l'heure.</span><span class=\"en\">You can come, provided you're on time.</span></div>\n<div class=\"ex\"><span class=\"fr\">Pourvu qu'il fasse beau dimanche !</span><span class=\"en\">Let's hope the weather's nice on Sunday! — pourvu que alone can also express a hope.</span></div>\n<div class=\"ex\"><span class=\"fr\">Nous partirons demain, à moins qu'il n'y ait une grève.</span><span class=\"en\">We'll leave tomorrow, unless there's a strike — note the optional ne explétif (n'y ait) after à moins que, which carries no negative meaning of its own.</span></div>\n<div class=\"ex\"><span class=\"fr\">Pour peu qu'on l'encourage, il donne le meilleur de lui-même.</span><span class=\"en\">Given just a little encouragement, he gives his best.</span></div>\n</div></details><div class=\"rule\">\n<span class=\"fr\">Quelques conjonctions de condition, en revanche, se construisent avec l'indicatif : selon que... ou que, suivant que, du moment que, dès lors que — elles marquent une alternative réelle plutôt qu'une hypothèse incertaine.</span>\n<span class=\"en\">A handful of condition conjunctions instead take the indicative: selon que...ou que, suivant que (depending on whether), du moment que, dès lors que (as long as/given that) — they present a real alternative rather than an uncertain hypothesis.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Selon qu'il pleut ou qu'il fait beau, nous irons à la plage ou au musée.</span><span class=\"en\">Depending on whether it rains or is sunny, we'll go to the beach or the museum.</span></div>\n<div class=\"ex\"><span class=\"fr\">Du moment que tu es d'accord, on peut signer.</span><span class=\"en\">As long as you agree, we can sign.</span></div>\n</div></details><div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"c1-si-cinq-valeurs\">→ Les cinq valeurs de si (C1)</a>\n<a class=\"xref\" data-target=\"si-conditions\">→ Si and conditions</a>\n<a class=\"xref\" data-target=\"subjonctif\">→ The subjunctive</a>\n</div>"}, {"id": "c1-connecteurs-logiques", "level": "C1", "frTitle": "Les connecteurs logiques", "enSub": "Linking words for cause, consequence, purpose, opposition, concession", "desc": "Choosing the right connector means choosing the right logical relationship first — the mode that follows isn't free, it's locked to the connector.", "body": "<div class=\"rule\">\n<span class=\"fr\">Chaque relation logique (cause, conséquence, but, opposition, concession) a sa propre famille de connecteurs et son propre mode (indicatif, subjonctif ou infinitif).</span>\n<span class=\"en\">Choosing the right connector means choosing the right logical relationship first — the mode that follows isn't free, it's locked to the connector.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Relation</th><th>Connectors</th><th>Mode</th></tr>\n<tr><td>Cause</td><td class=\"fr\">comme, puisque, étant donné que, vu que, sous prétexte que, d'autant que, grâce à, à force de, faute de</td><td>indicatif (+ subj. after non pas que, soit que...soit que)</td></tr>\n<tr><td>Conséquence</td><td class=\"fr\">si bien que, de sorte que, de manière que, tellement/tant que, par conséquent, au point que, assez/trop... pour que</td><td>indicatif (pour que + subj.)</td></tr>\n<tr><td>But</td><td class=\"fr\">pour que, afin que, pour, afin de, de manière à, de peur que, dans l'espoir que</td><td>subjonctif / infinitif</td></tr>\n<tr><td>Opposition</td><td class=\"fr\">alors que, cependant, tandis que, au contraire, pourtant, en revanche, contrairement à, à l'inverse, or</td><td>indicatif</td></tr>\n<tr><td>Concession</td><td class=\"fr\">toutefois, néanmoins, même si, certes, malgré, bien que, quoique, avoir beau, quitte à</td><td>subjonctif after bien que / quoique</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">de sorte que, de manière que, de façon que + indicatif = conséquence ; de sorte de, de manière à, de façon à + infinitif ou de façon à ce que + subjonctif = insistent sur la manière d'agir pour atteindre un but.</span>\n<span class=\"en\">Watch out: the same root words (sorte, manière, façon) express either consequence or purpose depending on what follows — que + indicative is a result already achieved, à + infinitive is a goal being pursued.</span>\n</div>"}, {"id": "b2c2-subordonnees-temps-mode", "level": "C2", "frTitle": "Subordonnées de temps : indicatif ou subjonctif ?", "enSub": "avant que, jusqu'à ce que, le temps que vs tant que, après que, dès que — a recap table", "desc": "Time clauses split into two camps depending on whether the event they describe is seen as still uncertain (subjunctive) or as a settled fact (indicative).", "body": "<div class=\"rule\">\n<span class=\"fr\">Les conjonctions de temps qui annoncent un fait non encore réalisé au moment de l'action principale (l'antériorité incertaine) se construisent avec le subjonctif : avant que, en attendant que, jusqu'à ce que, le temps que, d'ici (à ce) que.</span>\n<span class=\"en\">Conjunctions that point to something not yet accomplished at the time of the main action — an uncertain \"before\" — take the subjunctive: avant que, en attendant que, jusqu'à ce que, le temps que, d'ici (à ce) que.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Range tes affaires avant que tes parents arrivent.</span><span class=\"en\">Put your things away before your parents get here.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il a attendu jusqu'à ce que tout le monde soit parti.</span><span class=\"en\">He waited until everyone had left.</span></div>\n<div class=\"ex\"><span class=\"fr\">Reste ici en attendant qu'on te rappelle.</span><span class=\"en\">Stay here while you wait to be called back.</span></div>\n</div></details><div class=\"rule\">\n<span class=\"fr\">Les conjonctions qui présentent un fait comme accompli ou simultané, réel, se construisent avec l'indicatif : tant que, aussi longtemps que, après que, une fois que, dès que, aussitôt que, à peine... que, pendant que.</span>\n<span class=\"en\">Conjunctions that present the event as a real, accomplished, or simultaneous fact take the indicative: tant que, aussi longtemps que, après que, une fois que, dès que, aussitôt que, à peine...que, pendant que.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Tant qu'il fera beau, nous resterons dehors.</span><span class=\"en\">As long as the weather stays nice, we'll stay outside.</span></div>\n<div class=\"ex\"><span class=\"fr\">Après qu'il est parti, la réunion a repris.</span><span class=\"en\">After he left, the meeting resumed — après que officially takes the indicative, even though many speakers use the subjunctive by analogy with avant que; the indicative is the prescribed, tested form.</span></div>\n<div class=\"ex\"><span class=\"fr\">Une fois qu'on a compris la règle, c'est facile.</span><span class=\"en\">Once you've understood the rule, it's easy.</span></div>\n</div></details><div class=\"table-scroll\"><table class=\"gtable\"><tr><th>Subjonctif (fait incertain / à venir)</th><th>Indicatif (fait réel / accompli)</th></tr><tr><td class=\"fr\">avant que, jusqu'à ce que, en attendant que, le temps que, d'ici (à ce) que</td><td class=\"fr\">tant que, aussi longtemps que, après que, une fois que, dès que, aussitôt que, à peine...que, pendant que</td></tr></table></div><div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"indicateurs-temps\">→ Time markers</a>\n<a class=\"xref\" data-target=\"anteriorite-simultaneite-posteriorite\">→ Before / during / after</a>\n<a class=\"xref\" data-target=\"subjonctif\">→ The subjunctive</a>\n</div>"}, {"id": "b2c2-subjonctif-verbes-introducteurs", "level": "C2", "frTitle": "Le subjonctif après croire/penser, le superlatif et la rareté", "enSub": "Croire/penser negated or questioned, superlative + subjunctive, personne/rien que + subjunctive", "desc": "Three extra triggers for the subjunctive beyond the standard list: doubt introduced by negating or questioning an opinion verb, an absolute superlative, and expressions of rarity or exclusivity.", "body": "<div class=\"rule\">\n<span class=\"fr\">Croire, penser, trouver, être sûr/certain que + indicatif à la forme affirmative ; mais + subjonctif à la forme négative ou interrogative, car la certitude devient un doute.</span>\n<span class=\"en\">Croire, penser, trouver, être sûr/certain que all take the indicative when affirmative — but switch to the subjunctive once negated or turned into a question, because certainty has given way to doubt.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je pense qu'il a raison.</span><span class=\"en\">I think he's right — affirmative, indicative.</span></div>\n<div class=\"ex\"><span class=\"fr\">Je ne pense pas qu'il ait raison.</span><span class=\"en\">I don't think he's right — negated, subjunctive.</span></div>\n<div class=\"ex\"><span class=\"fr\">Crois-tu qu'elle vienne ce soir ?</span><span class=\"en\">Do you think she'll come tonight? — questioned, subjunctive.</span></div>\n</div></details><div class=\"rule\">\n<span class=\"fr\">Après un superlatif (le plus, le moins, le seul, l'unique, le premier, le dernier...) + qui/que, on emploie souvent le subjonctif pour exprimer un jugement subjectif plutôt qu'un fait objectif.</span>\n<span class=\"en\">After a superlative (the most/least, the only, the first, the last...) + qui/que, the subjunctive often follows to mark a subjective judgment rather than a plain fact.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">C'est le plus beau film que j'aie jamais vu.</span><span class=\"en\">It's the most beautiful film I've ever seen — subjective judgment, subjunctive.</span></div>\n<div class=\"ex\"><span class=\"fr\">C'est le seul restaurant qui soit ouvert un dimanche dans ce quartier.</span><span class=\"en\">It's the only restaurant open on a Sunday in this neighborhood.</span></div>\n</div></details><div class=\"rule\">\n<span class=\"fr\">Après personne, rien, aucun(e), ou ne... que + qui/que (expression de la rareté ou de l'exclusivité), le verbe se met souvent au subjonctif.</span>\n<span class=\"en\">After personne, rien, aucun(e), or ne...que + qui/que — all expressing rarity or exclusivity — the following verb often goes into the subjunctive too.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il n'y a personne ici qui puisse m'aider.</span><span class=\"en\">There's no one here who can help me.</span></div>\n<div class=\"ex\"><span class=\"fr\">C'est la seule chose qu'il ne sache pas encore.</span><span class=\"en\">It's the only thing he doesn't know yet.</span></div>\n</div></details><div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"subjonctif\">→ The subjunctive</a>\n<a class=\"xref\" data-target=\"indicatif-subjonctif-infinitif\">→ Indicative, subjunctive or infinitive?</a>\n</div>"}, {"id": "b2c2-le-fait-que", "level": "C2", "frTitle": "Le fait que vs le fait est que", "enSub": "Two look-alike expressions that take opposite moods", "desc": "A classic false-friend pair for advanced learners: identical vocabulary, opposite grammar and opposite communicative purpose.", "body": "<div class=\"rule\">\n<span class=\"fr\">Le fait que + subjonctif met en lumière un fait, souvent pour le commenter ou le nuancer (le fait lui-même est connu ou présupposé) ; le fait est que + indicatif
