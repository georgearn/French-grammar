<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>French Grammar Guide — A2 to C1</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f2f2; --card:#ffffff; --surface:#eae9e9; --ink:#201e1d; --muted:#7d7979;
  --line:rgba(32,30,29,0.14); --accent:#0088b0; --accent-dark:#006786; --accent-light:#e9f8ff;
  --accent2:#d6006c; --accent2-dark:#aa0b56; --accent2-light:#fff1f4;
  --radius:4px; --radius-lg:8px; --maxw:1180px; --maxw-read:720px;
  --font-heading:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  font-size:16px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#17191b; --card:#1f2225; --surface:#26292d; --ink:#e9e7e4; --muted:#9b9793;
  --line:rgba(233,231,228,0.14); --accent:#3ec4e8; --accent-dark:#7ddcf3; --accent-light:#0d3541;
  --accent2:#ff5a9b; --accent2-dark:#ff8fbb; --accent2-light:#3a1424;
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6;padding-bottom:60px;
  transition:background .15s ease,color .15s ease;}
h1,h2,h3{font-family:var(--font-heading);font-weight:600;margin:0;}
.fr{font-style:normal;}
.en{color:var(--muted);font-size:0.92em;}
a{color:var(--accent-dark);}
button{font-family:var(--font-body);}

/* nav */
nav.topnav{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:18px;padding:12px 18px;flex-wrap:wrap;}
nav.topnav .brand{font-family:var(--font-heading);font-weight:600;font-size:1.15rem;cursor:pointer;margin-right:auto;}
nav.topnav a{color:var(--ink);text-decoration:none;font-size:0.92rem;cursor:pointer;}
nav.topnav a.active{color:var(--accent-dark);font-weight:600;}
nav.topnav a:hover{color:var(--accent-dark);}
#navSearch{width:220px;max-width:40vw;padding:7px 10px;border-radius:var(--radius);border:1px solid var(--line);
  background:var(--surface);font-family:var(--font-body);font-size:0.88rem;color:var(--ink);}
#navSearch:focus{outline:2px solid var(--accent);outline-offset:0;}
#themeToggle{background:transparent;border:1px solid var(--line);border-radius:var(--radius);color:var(--ink);
  width:36px;height:36px;font-size:0.95rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
#themeToggle:hover{border-color:var(--accent);}

main{max-width:var(--maxw);margin:0 auto;padding:24px 18px 40px;}
.reading{max-width:var(--maxw-read);margin:0 auto;}

.kicker{display:block;font-size:0.78rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px;}
.crumb{font-size:0.82rem;color:var(--muted);margin-bottom:16px;}
.crumb a{cursor:pointer;color:var(--muted);text-decoration:none;}
.crumb a:hover{color:var(--accent-dark);}
.crumb .cur{color:var(--ink);}

/* hero */
.hero h1{font-size:2.2rem;line-height:1.15;letter-spacing:-0.01em;margin-bottom:14px;}
.hero p.sub{font-size:1.02rem;color:var(--muted);max-width:60ch;margin:0 0 22px;}
.stat-strip{display:flex;flex-wrap:wrap;gap:0 22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:14px 0;margin:0 0 34px;}
.stat-strip .stat{font-size:0.88rem;display:flex;align-items:baseline;gap:6px;padding:3px 0;}
.stat-strip .stat b{font-family:var(--font-heading);font-weight:600;color:var(--accent-dark);}

/* grids */
.grid{display:grid;gap:14px;grid-template-columns:1fr;}
@media(min-width:640px){.grid.g2{grid-template-columns:repeat(2,1fr);}}
@media(min-width:960px){.grid.g3{grid-template-columns:repeat(3,1fr);}.grid.g2{grid-template-columns:repeat(2,1fr);}}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;position:relative;}
.card:hover{border-color:var(--accent);}
.card .card-kicker{font-size:0.66rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent-dark);font-weight:600;}
.card .card-title{font-family:var(--font-heading);font-weight:600;font-size:1.05rem;}
.card .card-body{font-size:0.86rem;color:var(--muted);margin:0;flex:1;}
.card .card-meta{font-size:0.76rem;color:var(--muted);}
.card .bookmark-btn{position:absolute;top:12px;right:12px;background:transparent;border:none;cursor:pointer;color:var(--accent2);padding:2px;}
.progress-track{height:5px;background:var(--surface);border-radius:3px;overflow:hidden;margin-top:6px;}
.progress-fill{height:100%;background:var(--accent);border-radius:3px;}

/* lesson rows */
.lesson-row{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
.lesson-row:hover{background:var(--accent-light);}
.lesson-row .row-title{font-family:var(--font-heading);font-weight:600;font-size:1rem;}
.lesson-row .row-desc{font-size:0.86rem;color:var(--muted);margin-top:2px;}
.lesson-row .row-main{flex:1;min-width:0;}
.lesson-row .bookmark-btn{background:transparent;border:none;cursor:pointer;color:var(--accent2);flex:none;padding:4px;}

/* tags */
.tag{display:inline-flex;align-items:center;font-size:0.68rem;letter-spacing:0.03em;font-weight:600;
  padding:3px 9px;border-radius:3px;}
.tag-accent{background:var(--accent-light);color:var(--accent-dark);}
.tag-accent2{background:var(--accent2-light);color:var(--accent2-dark);}
.tag-outline{border:1px solid var(--accent);color:var(--accent-dark);}

/* search input */
.input{width:100%;padding:9px 12px;border-radius:var(--radius);border:1px solid var(--line);
  background:var(--surface);font-family:var(--font-body);font-size:0.95rem;color:var(--ink);}
.input:focus{outline:2px solid var(--accent);outline-offset:0;}

/* lesson content */
.lesson-title{font-size:1.7rem;margin-bottom:4px;}
.lesson-sub{color:var(--muted);font-size:0.95rem;margin-bottom:18px;}
.tag-row{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
.bookmark-toggle{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:transparent;
  border:1px solid var(--line);border-radius:var(--radius);padding:7px 12px;font-size:0.82rem;cursor:pointer;color:var(--ink);}
.bookmark-toggle.on{border-color:var(--accent2);color:var(--accent2-dark);background:var(--accent2-light);}

.rule{margin:14px 0;font-size:0.98rem;}
.rule .fr{display:block;font-family:var(--font-heading);}
.rule .en{display:block;margin-top:3px;}
table.gtable{width:100%;border-collapse:collapse;margin:14px 0;font-size:0.88rem;}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:14px 0;}
.table-scroll table.gtable{margin:0;min-width:560px;}
.table-scroll td,.table-scroll th{white-space:nowrap;}
table.gtable th,table.gtable td{border:1px solid var(--line);padding:7px 9px;text-align:left;}
table.gtable th{background:var(--surface);font-size:0.72rem;letter-spacing:0.05em;text-transform:uppercase;font-weight:600;}

details.examples-toggle{margin:14px 0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
details.examples-toggle summary{list-style:none;cursor:pointer;padding:10px 14px;font-family:var(--font-heading);
  font-weight:600;font-size:0.88rem;color:var(--accent-dark);background:var(--surface);
  display:flex;align-items:center;justify-content:space-between;}
details.examples-toggle summary::-webkit-details-marker{display:none;}
details.examples-toggle summary::after{content:"▾";transition:transform .15s ease;color:var(--muted);}
details.examples-toggle[open] summary::after{transform:rotate(180deg);}
details.examples-toggle .examples{margin:0;padding:12px 14px;background:var(--accent-light);border-left:none;border-radius:0;}
.examples .ex{margin:8px 0;font-size:0.92rem;}
.examples .ex .fr{font-family:var(--font-heading);font-weight:600;display:block;}
.examples .ex .en{display:block;margin-top:2px;}

.note{margin-top:14px;padding:10px 12px;background:var(--accent2-light);border-left:3px solid var(--accent2);
  border-radius:0 var(--radius) var(--radius) 0;font-size:0.88rem;}
.note .fr{display:block;font-family:var(--font-heading);font-weight:600;}
.note .en{display:block;}

.xref-box{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);font-size:0.86rem;}
.xref-box .xref-label{color:var(--muted);margin-right:4px;}
.xref{display:inline-block;background:var(--accent-light);color:var(--accent-dark);text-decoration:none;
  padding:5px 11px;border-radius:3px;font-size:0.83rem;margin:3px 4px 3px 0;cursor:pointer;border:1px solid transparent;}
.xref:hover{border-color:var(--accent);}
.xref.back-style{background:var(--accent2-light);color:var(--accent2-dark);}

.empty{color:var(--muted);font-size:0.9rem;padding:20px 0;}

.level-row{display:flex;gap:10px;flex-wrap:wrap;}
.level-chip{font-size:0.82rem;padding:8px 18px;cursor:pointer;background:transparent;}
.level-chip:hover{background:var(--accent-light);}
.cta-row{margin-top:10px;}
.btn-cta{font-family:var(--font-heading);font-weight:600;font-size:0.95rem;color:#fff;background:var(--accent);
  border:none;padding:12px 22px;border-radius:var(--radius);cursor:pointer;}
.btn-cta:hover{background:var(--accent-dark);}

/* mobile adjustments */
@media(max-width:639px){
  nav.topnav{gap:10px;}
  #navSearch{order:3;flex:1 1 100%;width:100%;max-width:none;}
  .hero h1{font-size:1.7rem;}
  .stat-strip{gap:0 16px;}
  main{padding:18px 14px 40px;}
}
</style>

</head>

<script id="fg-data" type="application/json">[{"id": "cat-nom", "label": "1. The Noun Group", "frLabel": "Le groupe nominal", "desc": "Gender, articles, adjectives, possessives, demonstratives — everything that hangs off a noun.", "levelRange": "A1–B2", "lessons": [{"id": "genre-noms", "level": "A1", "frTitle": "Le genre des noms", "enSub": "Gender of nouns", "desc": "Every French noun is either masculine or feminine — there's no neuter. Certain endings are a useful (not perfect) clue.", "body": "<div class=\"rule\">\n<span class=\"fr\">En français, chaque nom a un genre : masculin ou féminin.</span>\n<span class=\"en\">Every French noun is either masculine or feminine — there's no neuter. Certain endings are a useful (not perfect) clue.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Often masculine</th><th>Often feminine</th></tr>\n<tr><td>-ment, -eil, -ier, -isme, -oir, -eau, -ail, -in, -al, -teur, -age, -on</td>\n<td>-té, -tude, -ette, -aille, -ie, -ade, -esse, -ure, -ance, -ence, -tion, -son, -eur</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">un chien, une chienne</span><span class=\"en\">a (male) dog, a (female) dog — for people/animals, gender usually matches sex.</span></div>\n</div></details>"}, {"id": "articles", "level": "A1/A2", "frTitle": "Les articles", "enSub": "Definite, indefinite, partitive, and contracted articles", "desc": "In the negative, du/de la/des/un/une all become \"de\" (d' before a vowel): Je ne mange pas de viande. Exception: after \"être\", the article stays: Ce n'est pas une pomme.", "body": "<table class=\"gtable\">\n<tr><th>Type</th><th>Masc.</th><th>Fém.</th><th>Pluriel</th><th>Use</th></tr>\n<tr><td>Défini</td><td class=\"fr\">le (l')</td><td class=\"fr\">la (l')</td><td class=\"fr\">les</td><td>specific/known thing</td></tr>\n<tr><td>Indéfini</td><td class=\"fr\">un</td><td class=\"fr\">une</td><td class=\"fr\">des</td><td>one among several, unspecified</td></tr>\n<tr><td>Partitif</td><td class=\"fr\">du (de l')</td><td class=\"fr\">de la (de l')</td><td class=\"fr\">des</td><td>an uncountable/unspecified quantity</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je voudrais du pain, de la confiture et de l'eau.</span><span class=\"en\">I'd like some bread, some jam, and some water — a part of something uncountable.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il fait du sport. Elle a de la patience.</span><span class=\"en\">He does sports. She has patience — the partitive is also used with activities and abstract qualities.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">À la forme négative, du/de la/des/un/une deviennent \"de\" (d').</span>\n<span class=\"en\">In the negative, du/de la/des/un/une all become \"de\" (d' before a vowel): <em>Je ne mange pas de viande.</em> Exception: after \"être\", the article stays: <em>Ce n'est pas une pomme.</em></span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Article contracté : à/de + le/les se combinent.</span>\n<span class=\"en\">The prepositions \"à\" and \"de\" contract with the definite article le/les (never with la/l').</span>\n</div>\n<table class=\"gtable\">\n<tr><th></th><th>+ le</th><th>+ les</th><th>+ la / l'</th></tr>\n<tr><td class=\"fr\">à</td><td class=\"fr\">au</td><td class=\"fr\">aux</td><td class=\"fr\">à la / à l' (no change)</td></tr>\n<tr><td class=\"fr\">de</td><td class=\"fr\">du</td><td class=\"fr\">des</td><td class=\"fr\">de la / de l' (no change)</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je vais au marché. / Je reviens du marché.</span><span class=\"en\">I'm going to the market. / I'm coming back from the market.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">On omet l'article devant un nom de métier/nationalité après \"être\", après \"sans\" et \"avec\" (+ nom abstrait), dans une liste, et dans beaucoup d'expressions figées avec \"avoir\".</span>\n<span class=\"en\">The article is dropped after \"être\" + profession/nationality, after \"sans\" and \"avec\" (+ abstract noun), in lists, and in many fixed expressions with \"avoir\".</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Elle est médecin. / Il travaille sans relâche.</span><span class=\"en\">She's a doctor. / He works tirelessly.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il a faim, il a soif, il a peur.</span><span class=\"en\">He's hungry, thirsty, scared — no article in these fixed expressions with \"avoir\".</span></div>\n</div></details>"}, {"id": "nombre-noms", "level": "A1", "frTitle": "Le nombre des noms", "enSub": "Singular / plural of nouns", "desc": "The default plural adds -s (silent). There are a few common exceptions.", "body": "<div class=\"rule\">\n<span class=\"fr\">Le pluriel régulier s'obtient en ajoutant -s.</span>\n<span class=\"en\">The default plural adds -s (silent). There are a few common exceptions.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Ending</th><th>Rule</th><th>Example</th></tr>\n<tr><td>-eu, -eau</td><td>+ x</td><td class=\"fr\">un cheveu → des cheveux</td></tr>\n<tr><td>-al</td><td>→ -aux</td><td class=\"fr\">un journal → des journaux</td></tr>\n<tr><td>-s, -x, -z</td><td>no change</td><td class=\"fr\">un pays → des pays</td></tr>\n</table>"}, {"id": "adjectifs-qualificatifs", "level": "A2", "frTitle": "Les adjectifs qualificatifs", "enSub": "Descriptive adjectives: agreement & position", "desc": "Adjectives agree with the noun in gender and number. Most just add -e (feminine) and -s (plural).", "body": "<div class=\"rule\">\n<span class=\"fr\">L'adjectif s'accorde en genre et en nombre avec le nom.</span>\n<span class=\"en\">Adjectives agree with the noun in gender and number. Most just add -e (feminine) and -s (plural).</span>\n</div>\n<div class=\"note\">\n<span class=\"fr\">beau/nouveau/vieux → bel/nouvel/vieil devant une voyelle ou un h muet.</span>\n<span class=\"en\">A handful of masculine adjectives change form before a vowel sound: un <strong>bel</strong> appartement, un <strong>nouvel</strong> étudiant, un <strong>vieil</strong> homme.</span>\n</div>\n<div class=\"rule\" style=\"margin-top:10px;\">\n<span class=\"fr\">La place de l'adjectif : la plupart se placent après le nom ; certains courts et fréquents se placent avant.</span>\n<span class=\"en\">Most adjectives follow the noun (color, nationality, shape…). A short list of common short adjectives go before it: petit, grand, beau, joli, bon, jeune, vieux, long, dernier, mauvais, nouveau.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">une bonne amie / un long voyage</span><span class=\"en\">a good (female) friend / a long trip — short, frequent adjectives go before the noun.</span></div>\n<div class=\"ex\"><span class=\"fr\">une table ronde / un ami sénégalais</span><span class=\"en\">a round table / a Senegalese friend — shape and nationality go after.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Certains adjectifs changent de sens selon leur place.</span>\n<span class=\"en\">A few adjectives shift meaning depending on position: <em>un homme pauvre</em> (a poor/penniless man, literal) vs <em>mon pauvre ami</em> (my poor friend, meaning \"I feel sorry for you\", figurative).</span>\n</div>"}, {"id": "demonstratifs", "level": "A2", "frTitle": "Démonstratifs : adjectifs et pronoms", "enSub": "Demonstrative adjectives (this/that) and pronouns (this one/that one)", "desc": "Demonstrative adjectives (this/that) and pronouns (this one/that one)", "body": "<table class=\"gtable\">\n<tr><th></th><th>Masc. sg.</th><th>Fem. sg.</th><th>Plural</th></tr>\n<tr><td>Adjective</td><td class=\"fr\">ce / cet</td><td class=\"fr\">cette</td><td class=\"fr\">ces</td></tr>\n<tr><td>Pronoun</td><td class=\"fr\">celui</td><td class=\"fr\">celle</td><td class=\"fr\">ceux / celles</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">cette série / ces grands enfants</span><span class=\"en\">this series / these big kids</span></div>\n<div class=\"ex\"><span class=\"fr\">Celles de Marjane Satrapi ? / Celles-ci ou celles-là ?</span><span class=\"en\">The ones by Marjane Satrapi? / These ones or those ones? — pronouns replace \"adjective + noun\" to avoid repeating the noun.</span></div>\n</div></details>"}, {"id": "cest-il-est", "level": "A2", "frTitle": "« C'est » et « il/elle est »", "enSub": "Two ways to identify or describe someone/something", "desc": "Ce, cela, ça as subject take a 3rd-person-singular verb, except \"ce sont\" before a plural noun, which pluralizes.", "body": "<table class=\"gtable\">\n<tr><th></th><th>Use</th><th>Example</th></tr>\n<tr><td class=\"fr\">C'est + nom</td><td>identification (who/what it is), + article</td><td class=\"fr\">C'est un médecin. C'est ma sœur.</td></tr>\n<tr><td class=\"fr\">Il/elle est + adjectif</td><td>description, no article</td><td class=\"fr\">Elle est médecin. Il est sympa.</td></tr>\n<tr><td class=\"fr\">C'est + adjectif</td><td>commenting on a situation/idea (not a person)</td><td class=\"fr\">C'est intéressant. C'est difficile.</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">C'est un professeur très apprécié.</span><span class=\"en\">He's a very well-liked teacher — noun with article → \"c'est\".</span></div>\n<div class=\"ex\"><span class=\"fr\">Il est professeur.</span><span class=\"en\">He's a teacher — profession alone, no article → \"il est\".</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Devant un adjectif qui qualifie une personne déjà identifiée, on utilise il/elle est ; pour commenter une situation générale, on utilise c'est.</span>\n<span class=\"en\">Before an adjective describing an already-identified person, use il/elle est. To comment on a general situation or idea, use c'est — it doesn't refer back to a specific noun.</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Ce, cela, ça comme sujet entraînent un accord à la 3e personne du singulier, sauf \"ce sont\" devant un nom pluriel.</span>\n<span class=\"en\">Ce, cela, ça as subject take a 3rd-person-singular verb, except \"ce sont\" before a plural noun, which pluralizes.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Cela fit beaucoup de bruit dans la presse.</span><span class=\"en\">That caused a lot of noise in the press.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ce sont des sujets qui sont rarement abordés.</span><span class=\"en\">These are topics rarely discussed — \"ce sont\" + plural noun.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">À l'oral courant, on entend souvent \"c'est\" même devant un pluriel (\"c'est des sujets…\"), mais \"ce sont\" reste la forme correcte à l'écrit.</span>\n<span class=\"en\">In casual speech, \"c'est\" is often used even before a plural (\"c'est des sujets…\"), but \"ce sont\" remains the correct written form.</span>\n</div>"}, {"id": "possessifs", "level": "A2", "frTitle": "Possessifs : adjectifs et pronoms", "enSub": "Possessive adjectives (my/your…) and pronouns (mine/yours…)", "desc": "Unlike English, the possessive adjective agrees with the thing owned, not the owner: ma maison (\"my house\", feminine) but mon chat (\"my cat\", masculine) — even said by the same person.", "body": "<div class=\"rule\">\n<span class=\"fr\">L'adjectif possessif s'accorde avec l'objet possédé, pas avec le possesseur.</span>\n<span class=\"en\">Unlike English, the possessive adjective agrees with the thing owned, not the owner: <em>ma maison</em> (\"my house\", feminine) but <em>mon chat</em> (\"my cat\", masculine) — even said by the same person.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Owned (masc.)</th><th>Mine</th><th>Owned (fem.)</th><th>Mine</th></tr>\n<tr><td class=\"fr\">mon livre</td><td class=\"fr\">le mien</td><td class=\"fr\">ma sœur</td><td class=\"fr\">la mienne</td></tr>\n<tr><td class=\"fr\">ton fils</td><td class=\"fr\">le tien</td><td class=\"fr\">ta fille</td><td class=\"fr\">la tienne</td></tr>\n<tr><td class=\"fr\">notre cours</td><td class=\"fr\">le nôtre</td><td class=\"fr\">notre amie</td><td class=\"fr\">la nôtre</td></tr>\n</table>"}, {"id": "indefinis", "level": "A2/B1", "frTitle": "Indéfinis : chaque, tout", "enSub": "Indefinite adjectives & pronouns expressing quantity", "desc": "Chaque (\"each\") is always singular. Tout (\"all/every\") agrees: tout/toute/tous/toutes.", "body": "<div class=\"rule\">\n<span class=\"fr\"><strong>Chaque</strong> est toujours singulier ; <strong>tout</strong> s'accorde en genre et en nombre.</span>\n<span class=\"en\"><strong>Chaque</strong> (\"each\") is always singular. <strong>Tout</strong> (\"all/every\") agrees: tout/toute/tous/toutes.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je parle à chaque étudiant.</span><span class=\"en\">I speak to each student (one at a time).</span></div>\n<div class=\"ex\"><span class=\"fr\">Je parle à tous les étudiants.</span><span class=\"en\">I speak to all the students (as a group).</span></div>\n<div class=\"ex\"><span class=\"fr\">Chaque étudiant(e) a parlé → Chacun(e) a parlé.</span><span class=\"en\">The pronoun chacun(e) replaces \"chaque + noun\".</span></div>\n<div class=\"ex\"><span class=\"fr\">Tout va bien. / Je sais tout.</span><span class=\"en\">Everything is fine. / I know everything — here \"tout\" is invariable, meaning \"everything\".</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Autres indéfinis fréquents : plusieurs, certain(e)s, quelques, quelqu'un, quelque chose, n'importe qui/quoi/lequel.</span>\n<span class=\"en\">Other common indefinites: plusieurs (several), certain(e)s (some/certain), quelques (a few), quelqu'un (someone), quelque chose (something), n'importe qui/quoi/lequel (anyone/anything/any one at all).</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Plusieurs candidats se sont présentés.</span><span class=\"en\">Several candidates applied.</span></div>\n<div class=\"ex\"><span class=\"fr\">Certaines personnes préfèrent travailler seules.</span><span class=\"en\">Some people prefer working alone.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il dit n'importe quoi.</span><span class=\"en\">He's talking nonsense (lit. \"he says anything at all\").</span></div>\n</div></details>"}, {"id": "nominalisation-adjectif", "level": "B1/B2", "frTitle": "La nominalisation", "enSub": "Turning an adjective or a verb into a noun", "desc": "Many adjectives can become nouns, usually with a suffix (-té, -ie, -esse, -eur, -itude…), to talk about a quality in the abstract — useful for more formal, essay-style writing.", "body": "<div class=\"rule\">\n<span class=\"fr\">On transforme un adjectif en nom, souvent avec un suffixe (-té, -ie, -esse, -eur, -itude…), pour parler d'une qualité de façon abstraite.</span>\n<span class=\"en\">Many adjectives can become nouns, usually with a suffix (-té, -ie, -esse, -eur, -itude…), to talk about a quality in the abstract — useful for more formal, essay-style writing.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Adjectif</th><th>Nom</th></tr>\n<tr><td class=\"fr\">généreux</td><td class=\"fr\">la générosité</td></tr>\n<tr><td class=\"fr\">triste</td><td class=\"fr\">la tristesse</td></tr>\n<tr><td class=\"fr\">joyeux</td><td class=\"fr\">la joie</td></tr>\n<tr><td class=\"fr\">grand</td><td class=\"fr\">la grandeur</td></tr>\n<tr><td class=\"fr\">solitaire</td><td class=\"fr\">la solitude</td></tr>\n<tr><td class=\"fr\">jeune</td><td class=\"fr\">la jeunesse</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il est très généreux. → Sa générosité est connue de tous.</span><span class=\"en\">He's very generous. → His generosity is known to everyone — the idea shifts from describing a person to naming a quality directly.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Ces noms sont presque toujours féminins.</span>\n<span class=\"en\">Nouns formed this way are almost always feminine.</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">On peut aussi nominaliser un verbe (souvent avec -tion, -age, -ment, -ure), très utile pour un style plus formel et synthétique.</span>\n<span class=\"en\">Verbs can be nominalized too (often with -tion, -age, -ment, -ure) — useful for a more formal, condensed style, common in essays and press writing.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Verbe</th><th>Nom</th></tr>\n<tr><td class=\"fr\">décider</td><td class=\"fr\">la décision</td></tr>\n<tr><td class=\"fr\">augmenter</td><td class=\"fr\">l'augmentation</td></tr>\n<tr><td class=\"fr\">développer</td><td class=\"fr\">le développement</td></tr>\n<tr><td class=\"fr\">fermer</td><td class=\"fr\">la fermeture</td></tr>\n<tr><td class=\"fr\">licencier</td><td class=\"fr\">le licenciement</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Le gouvernement a décidé de baisser les impôts. → La décision du gouvernement de baisser les impôts…</span><span class=\"en\">The government decided to lower taxes. → The government's decision to lower taxes… — a whole clause compresses into a noun phrase, typical of news headlines and formal writing.</span></div>\n</div></details>"}]}, {"id": "cat-pronoms", "label": "2. Pronouns", "frLabel": "Les pronoms", "desc": "Object pronouns, y and en, relative pronouns (qui/que/dont), question words.", "levelRange": "A2–B2", "lessons": [{"id": "pronoms-complements", "level": "B1", "frTitle": "Pronoms compléments, y et en", "enSub": "Direct/indirect object pronouns, and the pronouns y / en", "desc": "En replaces \"de + noun\" — where you're coming from, or a quantity.", "body": "<table class=\"gtable\">\n<tr><th>Direct (COD)</th><th>Indirect (COI)</th></tr>\n<tr><td class=\"fr\">me, te, le/la, nous, vous, les</td><td class=\"fr\">me, te, lui, nous, vous, leur</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">Le, la, les = choses ou personnes ; lui, leur = personnes seulement.</span>\n<span class=\"en\">Le/la/les can replace things or people; lui/leur only replace people (indirect object, \"to someone\").</span>\n</div>\n<div class=\"rule\" style=\"margin-top:10px;\">\n<span class=\"fr\"><strong>En</strong> remplace \"de + nom\" (lieu d'origine, quantité).</span>\n<span class=\"en\"><strong>En</strong> replaces \"de + noun\" — where you're coming from, or a quantity.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Tu viens de l'école ? – Oui, j'en viens.</span><span class=\"en\">Coming from school? – Yes, I'm coming from there.</span></div>\n<div class=\"ex\"><span class=\"fr\">Tu as des amis ici ? – Oui, j'en ai beaucoup.</span><span class=\"en\">Do you have friends here? – Yes, I have many (of them).</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\"><strong>Y</strong> remplace \"à + nom\" ou un lieu (où on est/va).</span>\n<span class=\"en\"><strong>Y</strong> replaces \"à + noun\" or a location (where you are/going).</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Tu vas à l'école ? – Oui, j'y vais.</span><span class=\"en\">Are you going to school? – Yes, I'm going (there).</span></div>\n<div class=\"ex\"><span class=\"fr\">Tu as pensé à ma proposition ? – Oui, j'y ai pensé.</span><span class=\"en\">Did you think about my proposal? – Yes, I thought about it.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Place des pronoms : devant le verbe conjugué, sauf à l'impératif affirmatif.</span>\n<span class=\"en\">Object pronouns go before the conjugated verb (Je le vois / Je l'ai vu / Ne lui parle pas), except after an affirmative command: Donne-<strong>moi</strong> ce livre.</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Ne pas confondre avec les pronoms toniques (moi, toi, lui…) : les pronoms compléments s'attachent toujours à un verbe conjugué ; les toniques ne s'attachent jamais à un verbe.</span>\n<span class=\"en\">Don't confuse these with the pronoms toniques (moi, toi, lui…): object pronouns always attach directly to a conjugated verb; toniques never do — they follow a preposition, stand alone, or add emphasis.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je <strong>le</strong> vois. <em>(complément, attaché au verbe)</em></span><span class=\"en\">I see him.</span></div>\n<div class=\"ex\"><span class=\"fr\">C'est <strong>lui</strong> que je vois. <em>(tonique, pas attaché au verbe)</em></span><span class=\"en\">He's the one I see.</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"pronoms-toniques\">→ Pronoms toniques (moi, toi, lui…)</a>\n</div>"}, {"id": "relatifs-simples", "level": "A2/B1", "frTitle": "Pronoms relatifs simples", "enSub": "Simple relative pronouns: qui, que, où", "desc": "A relative pronoun joins two sentences and avoids repeating the noun — like \"who/which/where\" in English.", "body": "<div class=\"rule\">\n<span class=\"fr\">Le pronom relatif réunit deux phrases et évite une répétition.</span>\n<span class=\"en\">A relative pronoun joins two sentences and avoids repeating the noun — like \"who/which/where\" in English.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Function</th><th>Pronoun</th><th>Example</th></tr>\n<tr><td>Subject</td><td class=\"fr\">qui</td><td class=\"fr\">Le livre <strong>qui</strong> est sur la table est à moi.</td></tr>\n<tr><td>Object</td><td class=\"fr\">que / qu'</td><td class=\"fr\">Voici le travail <strong>que</strong> tu dois faire.</td></tr>\n<tr><td>Place / time</td><td class=\"fr\">où</td><td class=\"fr\">C'est l'entreprise <strong>où</strong> je travaille.</td></tr>\n</table>\n<div class=\"rule\">\n<span class=\"fr\">Quand \"qui\" est sujet, le verbe s'accorde avec l'antécédent de \"qui\", pas avec \"qui\" lui-même.</span>\n<span class=\"en\">When \"qui\" is the subject, the verb agrees with \"qui\"'s antecedent, not with \"qui\" itself — easy to miss when the antecedent isn't \"il/elle\".</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Moi qui ai toujours cru honnête, je suis déçue.</span><span class=\"en\">I, who always believed him honest, am disappointed — the antecedent is \"moi\" (1st person), so the verb is \"ai\", not \"a\".</span></div>\n<div class=\"ex\"><span class=\"fr\">C'est toi qui décides.</span><span class=\"en\">It's you who decides — antecedent \"toi\" (2nd person) → \"décides\".</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">These are the basics — for more complex sentences (whose, prepositions + which):</span>\n<a class=\"xref\" data-target=\"relatifs-composes\">→ Compound relative pronouns (dont, lequel…)</a>\n</div>"}, {"id": "relatifs-composes", "level": "B1/B2", "frTitle": "Pronoms relatifs composés", "enSub": "Compound relative pronouns: dont, lequel/auquel/duquel, ce qui / ce que / ce dont", "desc": "Dont replaces \"de + noun\" — used for verbs/expressions built with \"de\" (parler de, avoir besoin de, être content de…), and covers English \"whose\" and \"of which\".", "body": "<div class=\"rule\">\n<span class=\"fr\">On utilise <strong>dont</strong> quand le verbe ou l'expression se construit avec \"de\".</span>\n<span class=\"en\"><strong>Dont</strong> replaces \"de + noun\" — used for verbs/expressions built with \"de\" (parler de, avoir besoin de, être content de…), and covers English \"whose\" and \"of which\".</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">C'est le livre dont je t'ai parlé.</span><span class=\"en\">That's the book I told you about (parler <strong>de</strong> qqch).</span></div>\n<div class=\"ex\"><span class=\"fr\">Voici l'auteur dont j'ai lu tous les romans.</span><span class=\"en\">Here's the author whose novels I've all read.</span></div>\n</div></details>\n<div class=\"rule\" style=\"margin-top:10px;\">\n<span class=\"fr\"><strong>Lequel / laquelle / lesquels / lesquelles</strong> s'utilisent après une préposition (avec, pour, sans, sur…) quand l'antécédent est une chose.</span>\n<span class=\"en\"><strong>Lequel</strong> and its forms are used after a preposition (avec, pour, sans, sur…) when referring back to a thing. It contracts with à/de: <strong>auquel, duquel</strong>, etc.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Preposition + à</th><th>Preposition + de</th></tr>\n<tr><td class=\"fr\">auquel, à laquelle, auxquels, auxquelles</td><td class=\"fr\">duquel, de laquelle, desquels, desquelles</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Le projet auquel je pense te plaira.</span><span class=\"en\">The project I'm thinking of (penser <strong>à</strong>) will please you.</span></div>\n<div class=\"ex\"><span class=\"fr\">La réunion à laquelle j'ai assisté était longue.</span><span class=\"en\">The meeting I attended was long.</span></div>\n</div></details>\n<div class=\"rule\" style=\"margin-top:10px;\">\n<span class=\"fr\"><strong>Ce qui / ce que / ce dont</strong> s'utilisent quand il n'y a pas d'antécédent précis (= \"la chose qui/que/dont\").</span>\n<span class=\"en\"><strong>Ce qui/ce que/ce dont</strong> are used when there's no specific noun to refer to — \"what\" in English.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je ne sais pas ce qui se passe.</span><span class=\"en\">I don't know what's happening (subject).</span></div>\n<div class=\"ex\"><span class=\"fr\">Dis-moi ce que tu veux.</span><span class=\"en\">Tell me what you want (object).</span></div>\n<div class=\"ex\"><span class=\"fr\">Ce dont j'ai besoin, c'est de temps.</span><span class=\"en\">What I need is time.</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref back-style\" data-target=\"relatifs-simples\">← Simple relative pronouns (qui, que, où)</a>\n<a class=\"xref\" data-target=\"mise-en-relief\">→ Mise en relief (uses \"ce qui/ce que… c'est\")</a>\n</div>"}, {"id": "mots-interrogatifs", "level": "A2/B1", "frTitle": "Les mots interrogatifs et l'exclamation", "enSub": "Question words and exclamative structures", "desc": "Exclamations use \"quel(le)(s) !\" (+ noun) or \"comme/que\" (+ full clause).", "body": "<table class=\"gtable\">\n<tr><th>French</th><th>Meaning / use</th></tr>\n<tr><td class=\"fr\">qui</td><td>who (person, subject or object)</td></tr>\n<tr><td class=\"fr\">que / qu'est-ce que</td><td>what (object)</td></tr>\n<tr><td class=\"fr\">quoi</td><td>what (after a preposition): à quoi, de quoi</td></tr>\n<tr><td class=\"fr\">quel(le)(s)</td><td>which/what + noun, agrees in gender/number</td></tr>\n<tr><td class=\"fr\">où / quand / comment / pourquoi</td><td>where / when / how / why</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Qui a appelé ? / Qu'est-ce que tu fais ?</span><span class=\"en\">Who called? / What are you doing?</span></div>\n<div class=\"ex\"><span class=\"fr\">À quoi penses-tu ? Quelle heure est-il ?</span><span class=\"en\">What are you thinking about? What time is it?</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Pour l'exclamation, on utilise \"quel(le)(s) !\" (+ nom) ou \"comme/que\" (+ phrase).</span>\n<span class=\"en\">Exclamations use \"quel(le)(s) !\" (+ noun) or \"comme/que\" (+ full clause).</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Quelle bonne idée !</span><span class=\"en\">What a good idea!</span></div>\n<div class=\"ex\"><span class=\"fr\">Comme c'est beau ! / Qu'il fait chaud !</span><span class=\"en\">How beautiful it is! / It's so hot!</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"interrogatifs\">→ Lequel (replacing quel + noun)</a>\n<a class=\"xref\" data-target=\"interrogation\">→ Question formation by register</a>\n</div>"}, {"id": "interrogatifs", "level": "B1", "frTitle": "Pronoms interrogatifs", "enSub": "Interrogative pronouns: lequel and forms — \"which one(s)\"", "desc": "They replace \"quel(le)(s) + noun\" when asking \"which one(s)?\"", "body": "<div class=\"rule\">\n<span class=\"fr\">Ils remplacent \"quel(le)(s) + nom\" pour interroger sur l'identité.</span>\n<span class=\"en\">They replace \"quel(le)(s) + noun\" when asking \"which one(s)?\"</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Quels prénoms préfères-tu ? → Lesquels préfères-tu ?</span><span class=\"en\">Which first names do you prefer? → Which ones do you prefer?</span></div>\n<div class=\"ex\"><span class=\"fr\">De tous tes amis, lequel préfères-tu ?</span><span class=\"en\">Of all your friends, which one do you prefer?</span></div>\n</div></details>"}, {"id": "pronoms-toniques", "level": "A2", "frTitle": "Les pronoms toniques", "enSub": "Stressed pronouns: moi, toi, lui, elle, nous, vous, eux, elles", "desc": "Used after a preposition, to emphasize the subject, in comparisons, or alone (no verb).", "body": "<table class=\"gtable\">\n<tr><th>je</th><th>tu</th><th>il</th><th>elle</th><th>nous</th><th>vous</th><th>ils</th><th>elles</th></tr>\n<tr><td class=\"fr\">moi</td><td class=\"fr\">toi</td><td class=\"fr\">lui</td><td class=\"fr\">elle</td><td class=\"fr\">nous</td><td class=\"fr\">vous</td><td class=\"fr\">eux</td><td class=\"fr\">elles</td></tr>\n</table>\n<div class=\"rule\">\n<span class=\"fr\">On les utilise après une préposition, pour insister sur le sujet, dans une comparaison, ou seuls (sans verbe).</span>\n<span class=\"en\">Used after a preposition, to emphasize the subject, in comparisons, or alone (no verb).</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Tu viens avec moi ?</span><span class=\"en\">Are you coming with me? (after a preposition)</span></div>\n<div class=\"ex\"><span class=\"fr\">Moi, je préfère le thé.</span><span class=\"en\">Me, I prefer tea (emphasis on the subject).</span></div>\n<div class=\"ex\"><span class=\"fr\">Elle est plus grande que lui.</span><span class=\"en\">She's taller than him (comparison).</span></div>\n<div class=\"ex\"><span class=\"fr\">— Qui a fait ça ? — Moi.</span><span class=\"en\">\"Who did that?\" \"Me.\" (alone, no verb)</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Ne pas confondre avec les pronoms compléments (me, te, le/la, lui, nous, vous, les, leur) : ceux-ci s'attachent toujours au verbe conjugué, alors que les toniques ne s'y attachent jamais.</span>\n<span class=\"en\">Don't confuse these with object pronouns (me, te, le/la, lui, nous, vous, les, leur): those always attach to a conjugated verb, while toniques never do.</span>\n</div>\n<table class=\"gtable\">\n<tr><th></th><th>je</th><th>tu</th><th>il</th><th>elle</th><th>nous</th><th>vous</th><th>ils</th><th>elles</th></tr>\n<tr><td>Complément (attaché au verbe)</td><td class=\"fr\">me</td><td class=\"fr\">te</td><td class=\"fr\">le/lui</td><td class=\"fr\">la/lui</td><td class=\"fr\">nous</td><td class=\"fr\">vous</td><td class=\"fr\">les/leur</td><td class=\"fr\">les/leur</td></tr>\n<tr><td>Tonique (jamais attaché)</td><td class=\"fr\">moi</td><td class=\"fr\">toi</td><td class=\"fr\">lui</td><td class=\"fr\">elle</td><td class=\"fr\">nous</td><td class=\"fr\">vous</td><td class=\"fr\">eux</td><td class=\"fr\">elles</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">Pour je/tu/nous/vous, le complément est juste une forme raccourcie du tonique (moi→me, toi→te). Pour il/elle/ils/elles, les deux séries sont différentes (le/lui/les/leur vs lui/elle/eux/elles), donc plus faciles à confondre.</span>\n<span class=\"en\">For je/tu/nous/vous, the object pronoun is basically a shortened version of the tonique (moi→me, toi→te) — easy to see they're related. For il/elle/ils/elles, the two series look genuinely different (le/lui/les/leur vs lui/elle/eux/elles), which is where the confusion usually comes from.</span>\n</div>\n<div class=\"note\">\n<span class=\"fr\">Certains verbes construits avec \"à\" (penser à, tenir à, faire attention à) prennent un pronom tonique, pas \"lui/leur\", quand ils désignent une personne.</span>\n<span class=\"en\">Some verbs built with \"à\" (penser à, tenir à, faire attention à) take a tonique pronoun instead of \"lui/leur\", even when referring to a person: <em>Tu penses à lui</em> (not \"tu lui penses\"), unlike most à-verbs which use lui/leur.</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref back-style\" data-target=\"pronoms-complements\">← Object pronouns, y and en</a>\n</div>"}, {"id": "double-pronominalisation", "level": "B1/B2", "frTitle": "La double pronominalisation", "enSub": "Using two object pronouns together (COD + COI)", "desc": "When a verb has two objects (a person and a thing), both can become pronouns in the same sentence. Word order depends on which pronouns are involved.", "body": "<div class=\"rule\">\n<span class=\"fr\">Quand un verbe a deux compléments (personne + chose), on peut remplacer les deux par des pronoms. L'ordre dépend des pronoms utilisés.</span>\n<span class=\"en\">When a verb has two objects (a person and a thing), both can become pronouns in the same sentence. Word order depends on which pronouns are involved.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>me/te/nous/vous</th><th>le/la/les</th><th>lui/leur</th><th>y</th><th>en</th></tr>\n<tr><td class=\"fr\" colspan=\"5\">Ordre : me/te/nous/vous → le/la/les → lui/leur → y → en</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je donne le livre à Paul. → Je le lui donne.</span><span class=\"en\">I give the book to Paul. → I give it to him. (le before lui)</span></div>\n<div class=\"ex\"><span class=\"fr\">Tu me prêtes ta voiture ? → Tu me la prêtes ?</span><span class=\"en\">Can you lend me your car? → Can you lend it to me? (me before la)</span></div>\n<div class=\"ex\"><span class=\"fr\">Il y a du café ? Donne-m'en.</span><span class=\"en\">Is there coffee? Give me some. — at the affirmative imperative, pronouns follow the verb and \"m'en\" replaces \"moi + en\".</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref back-style\" data-target=\"pronoms-complements\">← Object pronouns, y and en</a>\n</div>"}]}, {"id": "cat-adv", "label": "3. Adverbs, Comparison & Negation", "frLabel": "", "desc": "Comparatives, superlatives, adverb formation, and the many faces of negation.", "levelRange": "A1–B1", "lessons": [{"id": "adverbe", "level": "A2/B1", "frTitle": "L'adverbe", "enSub": "Adverb formation and placement", "desc": "Adverbs never agree (unlike adjectives). They can modify a verb (usually placed after it), an adjective, or another adverb (both placed before).", "body": "<div class=\"rule\">\n<span class=\"fr\">L'adverbe est invariable ; il modifie un verbe, un adjectif ou un autre adverbe.</span>\n<span class=\"en\">Adverbs never agree (unlike adjectives). They can modify a verb (usually placed after it), an adjective, or another adverb (both placed before).</span>\n</div>\n<div class=\"rule\" style=\"margin-top:10px;\">\n<span class=\"fr\">Formation régulière : féminin de l'adjectif + -ment.</span>\n<span class=\"en\">Regular formation: feminine form of the adjective + -ment.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Rule</th><th>Example</th></tr>\n<tr><td>Adjective ending in a vowel (masc.)</td><td class=\"fr\">absolu → absolument, poli → poliment</td></tr>\n<tr><td>-ant → -amment / -ent → -emment</td><td class=\"fr\">méchant → méchamment, récent → récemment</td></tr>\n<tr><td>Irregular</td><td class=\"fr\">bon → bien, mauvais → mal, gentil → gentiment, bref → brièvement</td></tr>\n</table>\n<div class=\"rule\">\n<span class=\"fr\">Les adverbes de modalité (heureusement, probablement, peut-être, franchement, personnellement…) portent un jugement sur toute la phrase, pas sur un seul mot.</span>\n<span class=\"en\">Modality adverbs (heureusement, probablement, peut-être, franchement, personnellement…) comment on the whole sentence, not a single word — they signal the speaker's stance on what follows.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Heureusement, il n'a pas plu.</span><span class=\"en\">Fortunately, it didn't rain.</span></div>\n<div class=\"ex\"><span class=\"fr\">Peut-être qu'il viendra. / Il viendra peut-être.</span><span class=\"en\">Maybe he'll come. — \"peut-être\" at the start of a sentence needs \"que\"; mid-sentence it doesn't.</span></div>\n<div class=\"ex\"><span class=\"fr\">Franchement, je ne suis pas convaincu.</span><span class=\"en\">Frankly, I'm not convinced.</span></div>\n</div></details>"}, {"id": "comparaison", "level": "A2/B1", "frTitle": "La comparaison", "enSub": "Comparative and superlative", "desc": "A comparison can be nuanced by specifying the gap: légèrement/un peu (slightly), bien/beaucoup (much), deux fois plus/moins (twice as much/half as much)…", "body": "<table class=\"gtable\">\n<tr><th></th><th>+ (more)</th><th>= (as)</th><th>– (less)</th></tr>\n<tr><td>Adjective/adverb</td><td class=\"fr\">plus … que</td><td class=\"fr\">aussi … que</td><td class=\"fr\">moins … que</td></tr>\n<tr><td>Noun</td><td class=\"fr\">plus de … que</td><td class=\"fr\">autant de … que</td><td class=\"fr\">moins de … que</td></tr>\n<tr><td>Verb</td><td class=\"fr\">… plus que</td><td class=\"fr\">… autant que</td><td class=\"fr\">… moins que</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Elle est plus travailleuse que lui.</span><span class=\"en\">She's more hard-working than him.</span></div>\n<div class=\"ex\"><span class=\"fr\">C'est la personne la plus discrète du groupe.</span><span class=\"en\">She's the most discreet person in the group — superlative complement is introduced by \"de\", not \"dans\".</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Irréguliers : bon → meilleur, bien → mieux.</span>\n<span class=\"en\">Irregular: bon(ne) → meilleur(e) (\"better\", adjective); bien → mieux (\"better\", adverb) — a very common mix-up.</span>\n</div>\n<div class=\"note\">\n<span class=\"fr\">Mauvais a deux comparatifs possibles : plus mauvais (régulier) et pire (plus fort, souvent au figuré).</span>\n<span class=\"en\">\"Mauvais\" (bad) has two comparatives: \"plus mauvais\" (regular, concrete) and \"pire\" (stronger, often used figuratively): <em>C'est pire que ce que je pensais.</em> (\"It's worse than I thought.\")</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">On peut nuancer un comparatif en précisant l'écart : légèrement, un peu, bien, beaucoup, deux fois plus/moins…</span>\n<span class=\"en\">A comparison can be nuanced by specifying the gap: légèrement/un peu (slightly), bien/beaucoup (much), deux fois plus/moins (twice as much/half as much)…</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Ce modèle est légèrement plus cher que l'ancien.</span><span class=\"en\">This model is slightly more expensive than the old one.</span></div>\n<div class=\"ex\"><span class=\"fr\">Le trajet en train est bien plus rapide qu'en voiture.</span><span class=\"en\">The train journey is much faster than by car.</span></div>\n<div class=\"ex\"><span class=\"fr\">Les ventes ont doublé par rapport à l'an dernier.</span><span class=\"en\">Sales have doubled compared to last year.</span></div>\n</div></details>"}, {"id": "restriction", "level": "B1", "frTitle": "La restriction", "enSub": "Restriction: ne… que = \"only\"", "desc": "Ne … que means \"only\" — it restricts, it doesn't negate. \"Que\" goes right before the word it restricts.", "body": "<div class=\"rule\">\n<span class=\"fr\"><strong>Ne … que</strong> exprime une restriction (= seulement), pas une négation.</span>\n<span class=\"en\"><strong>Ne … que</strong> means \"only\" — it restricts, it doesn't negate. \"Que\" goes right before the word it restricts.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je n'ai que deux heures devant moi.</span><span class=\"en\">I only have two hours ahead of me.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il ne mange que des légumes.</span><span class=\"en\">He only eats vegetables.</span></div>\n<div class=\"ex\"><span class=\"fr\">Elle ne travaille que le matin.</span><span class=\"en\">She only works in the morning.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">On peut aussi utiliser \"seulement\" (avant ou après le verbe), sens équivalent mais registre plus neutre.</span>\n<span class=\"en\">\"Seulement\" is an equivalent, slightly more neutral alternative: <em>Il mange seulement des légumes.</em></span>\n</div>"}, {"id": "negation", "level": "A1/A2", "frTitle": "La négation", "enSub": "Negation: ne… pas, plus, jamais, rien, personne", "desc": "Ne … ni … ni negates two things at once; sans (+ noun/infinitive) is a standalone negative — no \"ne\" needed since \"sans\" already means \"without\".", "body": "<table class=\"gtable\">\n<tr><th>French</th><th>Meaning</th></tr>\n<tr><td class=\"fr\">ne … pas</td><td>not</td></tr>\n<tr><td class=\"fr\">ne … plus</td><td>no longer</td></tr>\n<tr><td class=\"fr\">ne … jamais</td><td>never</td></tr>\n<tr><td class=\"fr\">ne … rien / rien ne</td><td>nothing</td></tr>\n<tr><td class=\"fr\">ne … personne / personne ne</td><td>nobody</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">Au passé composé, les deux mots encadrent l'auxiliaire — sauf \"ne … personne\".</span>\n<span class=\"en\">In the passé composé, the two negation words surround the auxiliary: <em>Il n'a pas fini</em>. Exception: <em>ne … personne</em> surrounds the whole verb group instead: <em>Il n'a vu personne.</em></span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\"><strong>Ne … ni … ni</strong> nie deux éléments à la fois ; <strong>sans</strong> (+ nom/infinitif) est une négation sans \"ne\".</span>\n<span class=\"en\"><strong>Ne … ni … ni</strong> negates two things at once; <strong>sans</strong> (+ noun/infinitive) is a standalone negative — no \"ne\" needed since \"sans\" already means \"without\".</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il ne boit ni thé ni café.</span><span class=\"en\">He drinks neither tea nor coffee.</span></div>\n<div class=\"ex\"><span class=\"fr\">Elle est partie sans dire au revoir.</span><span class=\"en\">She left without saying goodbye.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">D'autres négations plus précises : ne … nulle part, ne … pas encore, ne … aucun(e), ne … guère.</span>\n<span class=\"en\">More precise negations, common at B2 level: ne … nulle part (\"nowhere\"), ne … pas encore (\"not yet\"), ne … aucun(e) (\"no/none at all\", stronger than \"pas de\"), ne … guère (\"hardly, barely\").</span>\n</div>\n<table class=\"gtable\">\n<tr><th>French</th><th>Meaning</th><th>Example</th></tr>\n<tr><td class=\"fr\">ne … nulle part</td><td>nowhere</td><td class=\"fr\">Je ne le trouve nulle part.</td></tr>\n<tr><td class=\"fr\">ne … pas encore</td><td>not yet</td><td class=\"fr\">Il n'est pas encore arrivé.</td></tr>\n<tr><td class=\"fr\">ne … aucun(e)</td><td>none/not a single one</td><td class=\"fr\">Je n'ai aucune idée.</td></tr>\n<tr><td class=\"fr\">ne … guère</td><td>hardly, barely</td><td class=\"fr\">Il ne travaille guère.</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">Ces négations existent aussi sans \"ne\" pour insister, à l'oral ou à l'écrit soutenu : pas du tout, plus du tout, pas un seul, plus un seul, sans aucun(e).</span>\n<span class=\"en\">These also appear as standalone emphatic expressions (no \"ne\" needed since there's no conjugated verb): pas du tout (\"not at all\"), plus du tout (\"not at all anymore\"), pas un seul / plus un seul (\"not a single one\"), sans aucun(e) (\"without any\").</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">— Tu as des regrets ? — Pas du tout.</span><span class=\"en\">\"Any regrets?\" \"Not at all.\"</span></div>\n<div class=\"ex\"><span class=\"fr\">Il a réussi sans aucune aide.</span><span class=\"en\">He succeeded without any help.</span></div>\n</div></details>"}]}, {"id": "cat-verbes", "label": "4. Verbs & Tenses", "frLabel": "Les verbes", "desc": "Present, past, future and the moods — the core tense system, regular and irregular.", "levelRange": "A1–B2", "lessons": [{"id": "apercu-temps", "level": "A2", "frTitle": "Aperçu des modes et des temps", "enSub": "Overview of moods and tenses", "desc": "Overview of moods and tenses", "body": "<table class=\"gtable\">\n<tr><th>Mood</th><th>Tense</th><th>Example</th></tr>\n<tr><td rowspan=\"4\">Indicative</td><td>Present</td><td class=\"fr\">je lis</td></tr>\n<tr><td>Passé composé</td><td class=\"fr\">j'ai lu</td></tr>\n<tr><td>Imparfait</td><td class=\"fr\">je lisais</td></tr>\n<tr><td>Future</td><td class=\"fr\">je lirai</td></tr>\n<tr><td>Conditional</td><td>Present</td><td class=\"fr\">je lirais</td></tr>\n<tr><td>Subjunctive</td><td>Present</td><td class=\"fr\">que je lise</td></tr>\n</table>"}, {"id": "verbes-pronominaux", "level": "A2", "frTitle": "Les verbes pronominaux", "enSub": "Reflexive, reciprocal, and idiomatic pronominal verbs", "desc": "Reflexive, reciprocal, and idiomatic pronominal verbs", "body": "<table class=\"gtable\">\n<tr><th>Type</th><th>Meaning</th><th>Example</th></tr>\n<tr><td>Réfléchi</td><td>the subject acts on itself</td><td class=\"fr\">Elle se lave. (she washes herself)</td></tr>\n<tr><td>Réciproque</td><td>subjects act on each other (plural)</td><td class=\"fr\">Ils se parlent tous les jours. (they talk to each other)</td></tr>\n<tr><td>Pronominal idiomatique</td><td>fixed expression, meaning ≠ base verb</td><td class=\"fr\">Il s'agit de… / Ça se passe bien.</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je me lève à sept heures.</span><span class=\"en\">I get up at seven — reflexive.</span></div>\n<div class=\"ex\"><span class=\"fr\">Nous nous comprenons bien.</span><span class=\"en\">We understand each other well — reciprocal.</span></div>\n<div class=\"ex\"><span class=\"fr\">De quoi s'agit-il ?</span><span class=\"en\">What's it about? — \"s'agir de\" only exists in the pronominal form, with \"il\" impersonal.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Au passé composé, tous les verbes pronominaux se conjuguent avec être.</span>\n<span class=\"en\">All pronominal verbs take être in the passé composé (see the passé composé topic below for agreement rules).</span>\n</div>"}, {"id": "imperatif", "level": "A2", "frTitle": "L'impératif", "enSub": "The imperative — giving orders, advice, instructions", "desc": "Formation: present indicative minus the subject, for tu/nous/vous only. For -er verbs, the final \"-s\" of the tu-form is dropped.", "body": "<div class=\"rule\">\n<span class=\"fr\">Formation : présent de l'indicatif sans le sujet, aux formes tu/nous/vous. Pour les verbes en -er, le \"-s\" final de \"tu\" disparaît.</span>\n<span class=\"en\">Formation: present indicative minus the subject, for tu/nous/vous only. For -er verbs, the final \"-s\" of the tu-form is dropped.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Tu parles → Parle ! / Nous partons → Partons ! / Vous finissez → Finissez !</span><span class=\"en\">You speak → Speak! / We leave → Let's leave! / You finish → Finish!</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Trois verbes irréguliers : être → sois, soyons, soyez ; avoir → aie, ayons, ayez ; savoir → sache, sachons, sachez.</span>\n<span class=\"en\">Three irregular verbs: être → sois, soyons, soyez; avoir → aie, ayons, ayez; savoir → sache, sachons, sachez.</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"pronoms-complements\">→ Pronoun placement with the imperative</a>\n</div>"}, {"id": "passe-compose", "level": "A1/A2", "frTitle": "Le passé composé", "enSub": "Passé composé — the everyday past tense", "desc": "Formed with avoir for most verbs, but être for 15 verbs of movement/state (aller, arriver, descendre, entrer, monter, mourir, naître, partir, passer, rentrer, rester, retourner, sortir, tomber, venir) and all reflexive verbs.", "body": "<div class=\"rule\">\n<span class=\"fr\">Auxiliaire avoir pour la majorité des verbes ; auxiliaire être pour 15 verbes (et leur famille) et les verbes pronominaux.</span>\n<span class=\"en\">Formed with <strong>avoir</strong> for most verbs, but <strong>être</strong> for 15 verbs of movement/state (aller, arriver, descendre, entrer, monter, mourir, naître, partir, passer, rentrer, rester, retourner, sortir, tomber, venir) and all reflexive verbs.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il a pris le bus. / Il est parti. / Il s'est levé tard.</span><span class=\"en\">He took the bus. / He left. / He got up late.</span></div>\n</div></details>\n<table class=\"gtable\">\n<tr><th>Infinitive ending</th><th>Past participle</th><th>Examples</th></tr>\n<tr><td>-er</td><td>-é</td><td class=\"fr\">aimer → aimé</td></tr>\n<tr><td>-ir (regular)</td><td>-i</td><td class=\"fr\">finir → fini</td></tr>\n<tr><td>irregular</td><td>-u / -i / -is / -it / -ert / -eint</td><td class=\"fr\">boire→bu, prendre→pris, faire→fait, ouvrir→ouvert, peindre→peint</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">Accord : avec être, le participe s'accorde avec le sujet ; avec avoir, seulement si le COD est placé avant le verbe.</span>\n<span class=\"en\">Agreement: with être, the participle agrees with the subject. With avoir, it only agrees if the direct object comes before the verb — e.g. <em>Je l'ai reçue</em> (referring to a feminine noun already mentioned). For the full set of rules (pronominal verbs, participle + infinitive, etc.), see below.</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"imparfait\">→ Imparfait (the other past tense)</a>\n<a class=\"xref\" data-target=\"accord-participe-passe\">→ Full participle agreement rules</a>\n</div>"}, {"id": "accord-participe-passe", "level": "B2", "frTitle": "L'accord du participe passé", "enSub": "The full rule set — a classic source of errors even for advanced speakers", "desc": "With être (active or passive voice), the participle always agrees with the subject.", "body": "<div class=\"rule\">\n<span class=\"fr\">Avec <strong>être</strong> (voix active ou passive), le participe s'accorde toujours avec le sujet.</span>\n<span class=\"en\">With <strong>être</strong> (active or passive voice), the participle always agrees with the subject.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Des astéroïdes sont tombés sur la Terre.</span><span class=\"en\">Asteroids fell on Earth (active).</span></div>\n<div class=\"ex\"><span class=\"fr\">Des restrictions sont imposées par le gouvernement.</span><span class=\"en\">Restrictions are imposed by the government (passive).</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Avec <strong>avoir</strong>, le participe ne s'accorde jamais avec le sujet, seulement avec le COD s'il est placé avant.</span>\n<span class=\"en\">With <strong>avoir</strong>, the participle never agrees with the subject — only with a direct object placed before it.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">La maison qu'ils ont achetée domine la mer.</span><span class=\"en\">The house they bought overlooks the sea — \"qu'\" (= la maison) is the COD, placed before, so the participle agrees.</span></div>\n<div class=\"ex\"><span class=\"fr\">Des gens, il en a vu au cours de ses voyages !</span><span class=\"en\">He saw people during his travels! — when the COD is the pronoun \"en\", the participle never agrees, even though \"en\" comes first.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Verbes pronominaux : si le pronom réfléchi est COD, le participe s'accorde avec lui ; si le pronom réfléchi est COI, il ne s'accorde pas.</span>\n<span class=\"en\">Pronominal verbs: if the reflexive pronoun functions as a direct object, the participle agrees with it; if it functions as an indirect object, the participle doesn't agree.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Elle s'est lavée ce matin.</span><span class=\"en\">She washed (herself) this morning — \"se\" = COD (\"laver quelqu'un\"), so the participle agrees with the feminine subject.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ils se sont écrit pendant toutes les vacances.</span><span class=\"en\">They wrote to each other all summer — \"se\" = COI (\"écrire à quelqu'un\"), so no agreement.</span></div>\n<div class=\"ex\"><span class=\"fr\">Elle s'est souvenue de ce concert.</span><span class=\"en\">She remembered that concert — the reflexive pronoun has no COD/COI function here at all, so the participle simply agrees with the subject, as with any other être-verb.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Se rire, se plaire, se déplaire, se complaire font exception : leur participe passé est toujours invariable.</span>\n<span class=\"en\">Se rire, se plaire, se déplaire, se complaire are exceptions: their past participle is always invariable, regardless of meaning.</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Participe passé suivi d'un infinitif : il s'accorde seulement si le COD placé avant fait l'action exprimée par le participe lui-même (pas par l'infinitif).</span>\n<span class=\"en\">Participle followed by an infinitive: it only agrees if the preceding direct object is doing the action of the participle itself (not the infinitive's action).</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Les acteurs qu'on a enfin autorisés à jouer la pièce…</span><span class=\"en\">The actors who were finally authorized to perform the play — \"qu'\" (the actors) is the object of \"autorisés\" itself, so it agrees.</span></div>\n<div class=\"ex\"><span class=\"fr\">Voici les mesures que le gouvernement a souhaité prendre.</span><span class=\"en\">Here are the measures the government wanted to take — \"que\" (the measures) is the object of \"prendre\", not of \"souhaité\", so no agreement.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Le participe passé de \"faire\" suivi d'un infinitif est toujours invariable.</span>\n<span class=\"en\">The past participle of \"faire\" followed by an infinitive (the causative construction) is always invariable, no matter what: <em>Les tartes qu'il a fait préparer sont délicieuses.</em></span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Employé seul, sans auxiliaire, le participe passé s'accorde comme un adjectif ordinaire.</span>\n<span class=\"en\">Used alone, without an auxiliary, the past participle simply agrees like a regular adjective.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Ils vivent dans une maison construite sur pilotis.</span><span class=\"en\">They live in a house built on stilts.</span></div>\n<div class=\"ex\"><span class=\"fr\">Arrivées en retard, elles ont trouvé porte close.</span><span class=\"en\">Having arrived late, they found the door closed.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Les verbes de mesure (peser, mesurer, valoir, coûter, durer…) n'ont pas de vrai COD : leur participe ne s'accorde pas, sauf si le verbe change de sens (ex. \"coûter\" = causer).</span>\n<span class=\"en\">Measurement verbs (peser, mesurer, valoir, coûter, durer…) don't take a true direct object, so their participle doesn't agree — unless the verb shifts to a different meaning (e.g. \"coûter\" meaning \"to cause\").</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Les trois millions d'euros qu'a coûté la construction de l'école…</span><span class=\"en\">The three million euros the school's construction cost… — no agreement, \"coûté\" isn't followed by a real COD.</span></div>\n<div class=\"ex\"><span class=\"fr\">Les difficultés que lui a coûtées le tournage du film…</span><span class=\"en\">The difficulties the film shoot cost him… — here \"coûter\" means \"cause\", and \"difficultés\" is a genuine COD, so the participle agrees.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Le participe passé d'un verbe impersonnel (il a fait, il y a eu…) est toujours invariable.</span>\n<span class=\"en\">The past participle of an impersonal verb (il a fait, il y a eu…) is always invariable, even when preceded by something that looks like a COD.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">La chaleur qu'il a fait cet été !</span><span class=\"en\">The heat we had this summer! — \"qu'\" looks like a COD of \"fait\", but since \"il\" is impersonal (no real agent), the participle stays invariable.</span></div>\n</div></details>"}, {"id": "imparfait", "level": "A2", "frTitle": "L'imparfait", "enSub": "Imparfait — background, habits, description in the past", "desc": "Stem = the \"nous\" form of the present tense, minus -ons. Same endings for every verb: -ais, -ais, -ait, -ions, -iez, -aient.", "body": "<div class=\"rule\">\n<span class=\"fr\">Radical = celui de \"nous\" au présent ; terminaisons -ais, -ais, -ait, -ions, -iez, -aient.</span>\n<span class=\"en\">Stem = the \"nous\" form of the present tense, minus -ons. Same endings for every verb: -ais, -ais, -ait, -ions, -iez, -aient.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Nous faisons → je faisais</span><span class=\"en\">we do → I was doing/used to do</span></div>\n<div class=\"ex\"><span class=\"fr\">Avant, j'allais souvent dans ce café.</span><span class=\"en\">I used to go to that café often — habitual past action.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il faisait frais, mais il ne pleuvait pas.</span><span class=\"en\">It was cool, but it wasn't raining — describing circumstances/background.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Passé composé = action ponctuelle/achevée ; imparfait = habitude ou décor.</span>\n<span class=\"en\">Rule of thumb: passé composé for a completed, one-off event; imparfait for background description or repeated habits. They're often combined in the same sentence: <em>Il pleuvait (imparfait, background) quand je suis sorti (passé composé, event).</em></span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref back-style\" data-target=\"passe-compose\">← Passé composé</a>\n<a class=\"xref\" data-target=\"si-conditions\">→ Imparfait is also used after \"si\" for hypothetical present</a>\n</div>"}, {"id": "plus-que-parfait", "level": "B1", "frTitle": "Le plus-que-parfait", "enSub": "Pluperfect — an action completed before another past action", "desc": "Formation: the auxiliary (avoir/être) in the imparfait + past participle. Same auxiliary and agreement rules as the passé composé.", "body": "<div class=\"rule\">\n<span class=\"fr\">Formation : auxiliaire (avoir/être) à l'imparfait + participe passé.</span>\n<span class=\"en\">Formation: the auxiliary (avoir/être) in the imparfait + past participle. Same auxiliary and agreement rules as the passé composé.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">j'avais mangé / elle était partie / ils s'étaient levés</span><span class=\"en\">I had eaten / she had left / they had gotten up</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Le plus-que-parfait exprime une action antérieure à une autre action passée.</span>\n<span class=\"en\">It expresses an action that happened before another past action — the \"past of the past\".</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Quand je suis arrivé, le film avait déjà commencé.</span><span class=\"en\">When I arrived, the film had already started. (started before I arrived)</span></div>\n<div class=\"ex\"><span class=\"fr\">Elle m'a dit qu'elle avait fini le rapport.</span><span class=\"en\">She told me she had finished the report — very common in reported speech about the past.</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"discours-rapporte\">→ Discours rapporté (concordance des temps)</a>\n</div>"}, {"id": "futur-simple", "level": "A2", "frTitle": "Le futur simple", "enSub": "Simple future", "desc": "Stem = the infinitive (drop the final -e for -re verbs), same endings for every verb.", "body": "<div class=\"rule\">\n<span class=\"fr\">Radical = infinitif (on enlève le -e final des verbes en -re) + terminaisons -ai, -as, -a, -ons, -ez, -ont.</span>\n<span class=\"en\">Stem = the infinitive (drop the final -e for -re verbs), same endings for every verb.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">parler → je parlerai / prendre → il prendra</span><span class=\"en\">to speak → I will speak / to take → he will take</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Verbes irréguliers fréquents : être→serai, avoir→aurai, aller→irai, faire→ferai, voir→verrai, pouvoir→pourrai, devoir→devrai, vouloir→voudrai, venir→viendrai, savoir→saurai.</span>\n<span class=\"en\">A handful of very common verbs have an irregular stem — worth memorizing, they recur constantly.</span>\n</div>\n<div class=\"rule\" style=\"margin-top:10px;\">\n<span class=\"fr\">Pour parler du futur, on a le choix entre le présent, le futur proche (aller + infinitif) et le futur simple, selon la certitude et la proximité de l'action.</span>\n<span class=\"en\">French has three ways to talk about the future, chosen by how certain or close the action is.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Tense</th><th>Use</th><th>Example</th></tr>\n<tr><td>Présent</td><td>a scheduled, near-certain event</td><td class=\"fr\">Le train part dans dix minutes.</td></tr>\n<tr><td>Futur proche (aller + inf.)</td><td>near future, intention</td><td class=\"fr\">Je vais appeler le médecin.</td></tr>\n<tr><td>Futur simple</td><td>more distant, less certain, predictions</td><td class=\"fr\">Dans dix ans, la ville aura changé.</td></tr>\n</table>"}, {"id": "aspect-verbal", "level": "A2/B1", "frTitle": "« Venir de », « être en train de », « être sur le point de »", "enSub": "Three set expressions marking recent past, present continuous, and imminent future", "desc": "Three set expressions marking recent past, present continuous, and imminent future", "body": "<table class=\"gtable\">\n<tr><th>French</th><th>Meaning</th><th>Example</th></tr>\n<tr><td class=\"fr\">venir de + infinitif</td><td>just did something</td><td class=\"fr\">Je viens de manger.</td></tr>\n<tr><td class=\"fr\">être en train de + infinitif</td><td>doing something right now</td><td class=\"fr\">Je suis en train de manger.</td></tr>\n<tr><td class=\"fr\">être sur le point de + infinitif</td><td>about to do something</td><td class=\"fr\">Je suis sur le point de partir.</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il vient d'arriver.</span><span class=\"en\">He just arrived.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ne me dérange pas, je suis en train de travailler.</span><span class=\"en\">Don't disturb me, I'm working right now.</span></div>\n<div class=\"ex\"><span class=\"fr\">Dépêche-toi, le film est sur le point de commencer.</span><span class=\"en\">Hurry up, the film is about to start.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Ces trois expressions peuvent aussi se conjuguer à l'imparfait pour parler du passé (venait de, était en train de…).</span>\n<span class=\"en\">All three can also be conjugated in the imparfait to talk about the past: <em>Il venait de partir quand tu as appelé.</em> (\"He had just left when you called.\")</span>\n</div>"}, {"id": "futur-anterieur", "level": "B1", "frTitle": "Le futur antérieur", "enSub": "Future perfect — an action that will be completed before another future action", "desc": "Formation: the auxiliary (avoir/être) in the futur simple + past participle.", "body": "<div class=\"rule\">\n<span class=\"fr\">Formation : auxiliaire (avoir/être) au futur simple + participe passé.</span>\n<span class=\"en\">Formation: the auxiliary (avoir/être) in the futur simple + past participle.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">j'aurai fini / elle sera partie / ils se seront levés</span><span class=\"en\">I will have finished / she will have left / they will have gotten up</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Il exprime une action future antérieure à une autre action future, souvent après \"quand\", \"dès que\", \"une fois que\".</span>\n<span class=\"en\">It expresses a future action completed before another future action — very common after \"quand\", \"dès que\", \"une fois que\" (all + futur antérieur when the first action must finish first).</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Quand j'aurai fini mes études, je chercherai un emploi.</span><span class=\"en\">When I've finished my studies, I'll look for a job.</span></div>\n<div class=\"ex\"><span class=\"fr\">Appelle-moi dès que tu seras arrivé.</span><span class=\"en\">Call me as soon as you've arrived.</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref back-style\" data-target=\"plus-que-parfait\">← Plus-que-parfait (the same logic, in the past)</a>\n</div>"}, {"id": "conditionnel", "level": "B1", "frTitle": "Le conditionnel présent", "enSub": "Present conditional — \"would\"", "desc": "Formation: future stem + imparfait endings. So if you know the future stem and the imparfait endings, you already know the conditional.", "body": "<div class=\"rule\">\n<span class=\"fr\">Formation : radical du futur + terminaisons de l'imparfait.</span>\n<span class=\"en\">Formation: future stem + imparfait endings. So if you know the future stem and the imparfait endings, you already know the conditional.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\
