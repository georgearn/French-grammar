1", "frTitle": "Exprimer la nécessité et l'obligation", "enSub": "Ways to express necessity and obligation", "desc": "Ways to express necessity and obligation", "body": "<table class=\"gtable\">\n<tr><th>French</th><th>Nuance</th><th>Example</th></tr>\n<tr><td class=\"fr\">il faut que + subjonctif</td><td>necessity, impersonal</td><td class=\"fr\">Il faut que tu partes.</td></tr>\n<tr><td class=\"fr\">devoir + infinitif</td><td>obligation, personal</td><td class=\"fr\">Tu dois partir.</td></tr>\n<tr><td class=\"fr\">il est nécessaire de + infinitif</td><td>necessity, no subject named</td><td class=\"fr\">Il est nécessaire de réserver.</td></tr>\n<tr><td class=\"fr\">être obligé(e) de + infinitif</td><td>external constraint</td><td class=\"fr\">Je suis obligé de partir tôt.</td></tr>\n<tr><td class=\"fr\">avoir besoin de + infinitif/nom</td><td>need</td><td class=\"fr\">J'ai besoin de me reposer.</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">\"Il faut que\" est suivi du subjonctif ; \"il faut\" + infinitif s'utilise quand on ne précise pas qui.</span>\n<span class=\"en\">\"Il faut que\" takes the subjunctive (naming who); \"il faut\" + infinitive is used when the obligation isn't tied to a specific person: <em>Il faut réserver à l'avance.</em></span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"exprimer-volonte-souhait\">→ Exprimer la volonté, le souhait</a>\n</div>"}, {"id": "opinion", "level": "B1/B2", "frTitle": "L'expression de l'opinion", "enSub": "Opinion verbs — when they take the indicative and when they take the subjunctive", "desc": "Opinion verbs in the affirmative (penser que, croire que, trouver que) take the indicative — you're stating something as fact.", "body": "<div class=\"rule\">\n<span class=\"fr\">Les verbes d'opinion à la forme affirmative (penser que, croire que, trouver que) sont suivis de l'indicatif.</span>\n<span class=\"en\">Opinion verbs in the affirmative (penser que, croire que, trouver que) take the indicative — you're stating something as fact.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je pense que ce projet est utile.</span><span class=\"en\">I think this project is useful.</span></div>\n<div class=\"ex\"><span class=\"fr\">Je trouve que c'est une bonne idée.</span><span class=\"en\">I think it's a good idea.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">À la forme négative ou interrogative, ces mêmes verbes sont souvent suivis du subjonctif, car le doute s'installe.</span>\n<span class=\"en\">In the negative or interrogative, the same verbs often shift to the subjunctive, because doubt enters the picture.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je ne pense pas que ce projet soit utile.</span><span class=\"en\">I don't think this project is useful.</span></div>\n<div class=\"ex\"><span class=\"fr\">Penses-tu que ce soit une bonne idée ?</span><span class=\"en\">Do you think it's a good idea? (real doubt implied)</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Douter que, ne pas être sûr(e) que, ne pas être certain(e) que sont toujours suivis du subjonctif.</span>\n<span class=\"en\">Verbs of doubt (douter que, ne pas être sûr(e) que, ne pas être certain(e) que) always take the subjunctive, since they express uncertainty.</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"exprimer-sentiments\">→ Exprimer ses sentiments</a>\n</div>"}, {"id": "exprimer-sentiments", "level": "B1", "frTitle": "Exprimer ses sentiments", "enSub": "Expressing feelings", "desc": "De + infinitif when the feeling is about your own action; que + subjonctif when it's about someone else's.", "body": "<div class=\"rule\">\n<span class=\"fr\">Pour exprimer un sentiment sur sa propre action ou une chose en général, on utilise <strong>de + infinitif</strong>.</span>\n<span class=\"en\">To express a feeling about your own action or something in general, use <strong>de + infinitive</strong> — same subject throughout.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je suis content(e) d'avoir ce nouveau projet.</span><span class=\"en\">I'm happy to have this new project.</span></div>\n<div class=\"ex\"><span class=\"fr\">C'est dommage de devoir partir si tôt.</span><span class=\"en\">It's a shame to have to leave so soon.</span></div>\n<div class=\"ex\"><span class=\"fr\">J'en ai assez d'attendre.</span><span class=\"en\">I'm fed up with waiting.</span></div>\n</div></details>\n<div class=\"rule\" style=\"margin-top:10px;\">\n<span class=\"fr\">Pour exprimer un sentiment sur l'action ou l'état d'une autre personne (sujet différent), on utilise <strong>que + subjonctif</strong>.</span>\n<span class=\"en\">When the feeling is about someone or something else — a different subject — use <strong>que + subjunctive</strong>.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je suis ravi(e) que ce magasin ait ouvert des blabla caisses.</span><span class=\"en\">I'm delighted that this shop has opened self-checkouts.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ça m'énerve que ma mère doive attendre.</span><span class=\"en\">It annoys me that my mother has to wait.</span></div>\n<div class=\"ex\"><span class=\"fr\">Je trouve ça bien qu'ils aient la possibilité d'échanger.</span><span class=\"en\">I think it's good that they have the chance to talk it over.</span></div>\n</div></details>\n<table class=\"gtable\">\n<tr><th>Sentiment</th><th>+ de + infinitif (même sujet)</th><th>+ que + subjonctif (sujet différent)</th></tr>\n<tr><td>Positif</td><td class=\"fr\">Je suis content(e)/ravi(e)/heureux(-se) de...<br>J'apprécie de...<br>Ça me plaît de...</td><td class=\"fr\">Je suis content(e) que...<br>J'apprécie que...<br>Ça me plaît que...</td></tr>\n<tr><td>Négatif</td><td class=\"fr\">C'est dommage de...<br>J'en ai assez de...<br>J'ai peur de...</td><td class=\"fr\">C'est dommage que...<br>J'en ai assez que...<br>Ça m'énerve que...</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">Verbes courants au subjonctif : que ce soit, qu'il/elle ait, que je/tu sois, que nous soyons, qu'ils/elles fassent...</span>\n<span class=\"en\">These constructions almost always take an irregular-subjunctive verb (être, avoir, faire, pouvoir), so review those forms alongside this pattern.</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"subjonctif\">→ Le subjonctif présent</a>\n<a class=\"xref\" data-target=\"opinion\">→ L'expression de l'opinion</a>\n</div>"}, {"id": "exprimer-volonte-souhait", "level": "B1", "frTitle": "Exprimer la volonté, le souhait", "enSub": "Expressing wishes and will", "desc": "Espérer que + indicatif is the exception — every other wish verb takes the subjonctif (or infinitif with same subject).", "body": "<div class=\"rule\">\n<span class=\"fr\">Après le verbe <strong>espérer que</strong>, on emploie l'<strong>indicatif</strong> (souvent le futur).</span>\n<span class=\"en\">After <strong>espérer que</strong> (\"to hope that\"), use the <strong>indicative</strong> — it's the one wish-verb that behaves like an opinion verb.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">J'espère qu'il y aura beaucoup de monde pour célébrer la gastronomie martiniquaise !</span><span class=\"en\">I hope there will be a big crowd to celebrate Martinican cuisine!</span></div>\n<div class=\"ex\"><span class=\"fr\">J'espère qu'on peut participer aux ateliers culinaires.</span><span class=\"en\">I hope we can take part in the cooking workshops.</span></div>\n</div></details>\n<div class=\"rule\" style=\"margin-top:10px;\">\n<span class=\"fr\">Toutes les autres constructions qui expriment une volonté ou un souhait sont suivies du <strong>subjonctif</strong> (si le sujet change) ou de l'<strong>infinitif</strong> (si le sujet est le même).</span>\n<span class=\"en\">Every other wish/will expression takes the <strong>subjunctive</strong> when the subject changes, or the <strong>infinitive</strong> when the subject stays the same.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Expression</th><th>Construction</th></tr>\n<tr><td class=\"fr\">j'aimerais (bien) que / j'apprécierais que</td><td>+ subjonctif</td></tr>\n<tr><td class=\"fr\">je désire que / je désirerais que</td><td>+ subjonctif</td></tr>\n<tr><td class=\"fr\">je préfère que / je préférerais que</td><td>+ subjonctif</td></tr>\n<tr><td class=\"fr\">je rêve que / je rêverais que</td><td>+ subjonctif</td></tr>\n<tr><td class=\"fr\">je souhaite que / je souhaiterais que</td><td>+ subjonctif</td></tr>\n<tr><td class=\"fr\">je suggère que / je suggérerais que</td><td>+ subjonctif</td></tr>\n<tr><td class=\"fr\">je tiens à ce que</td><td>+ subjonctif</td></tr>\n<tr><td class=\"fr\">je veux que / je voudrais que</td><td>+ subjonctif</td></tr>\n<tr><td class=\"fr\">cela/ça me ferait plaisir que</td><td>+ subjonctif</td></tr>\n<tr><td class=\"fr\">ce serait bien/bon que ; pourvu que</td><td>+ subjonctif</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">J'aimerais que vous sachiez à quel point j'ai adoré ce plat.</span><span class=\"en\">I'd like you to know how much I loved this dish.</span></div>\n<div class=\"ex\"><span class=\"fr\">Que souhaites-tu que je te prépare pour le déjeuner ?</span><span class=\"en\">What do you want me to make you for lunch?</span></div>\n<div class=\"ex\"><span class=\"fr\">Pourvu qu'il prenne des leçons de cuisine !</span><span class=\"en\">Let's hope he takes cooking lessons!</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Pour exprimer un souhait de façon polie, on utilise volontiers le <strong>conditionnel</strong> : je souhaiterais, j'aimerais, je voudrais...</span>\n<span class=\"en\">The conditional softens a wish into a polite request: <em>je souhaiterais que vous me donniez la recette</em> is more polite than the plain indicative/subjunctive-triggering present.</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"subjonctif\">→ Le subjonctif présent</a>\n<a class=\"xref\" data-target=\"conditionnel\">→ Le conditionnel présent</a>\n<a class=\"xref\" data-target=\"necessite-obligation\">→ Exprimer la nécessité et l'obligation</a>\n</div>"}, {"id": "modalisation", "level": "B2", "frTitle": "La modalisation", "enSub": "Marking how certain, or how personal, a statement is", "desc": "Modalizing means signaling your degree of certainty, or flagging an opinion as personal, rather than stating something as an absolute fact — essential for nuanced, credible opinion writing.", "body": "<div class=\"rule\">\n<span class=\"fr\">Modaliser, c'est indiquer son degré de certitude ou marquer qu'une opinion est personnelle, plutôt que présenter un fait comme absolu.</span>\n<span class=\"en\">Modalizing means signaling your degree of certainty, or flagging an opinion as personal, rather than stating something as an absolute fact — essential for nuanced, credible opinion writing.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Fonction</th><th>Expressions</th></tr>\n<tr><td>Certitude forte</td><td class=\"fr\">sans doute, à coup sûr, il est certain que</td></tr>\n<tr><td>Probabilité</td><td class=\"fr\">probablement, sans doute, il est probable que</td></tr>\n<tr><td>Possibilité / doute</td><td class=\"fr\">peut-être, il se peut que, il semble que</td></tr>\n<tr><td>Opinion personnelle</td><td class=\"fr\">à mon avis, selon moi, il me semble que, personnellement</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il va sans doute pleuvoir cet après-midi.</span><span class=\"en\">It will probably rain this afternoon.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il me semble que cette décision est prématurée.</span><span class=\"en\">It seems to me that this decision is premature.</span></div>\n<div class=\"ex\"><span class=\"fr\">À mon avis, ce choix n'est pas le bon.</span><span class=\"en\">In my opinion, this isn't the right choice.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">\"Il semble que\" et \"il se peut que\" sont suivis du subjonctif ; \"il me semble que\" (opinion personnelle) est suivi de l'indicatif.</span>\n<span class=\"en\">\"Il semble que\" and \"il se peut que\" take the subjunctive (impersonal, expressing doubt); \"il me semble que\" (personal opinion) takes the indicative — a subtle but common distinction.</span>\n</div>"}, {"id": "anteriorite-simultaneite-posteriorite", "level": "B1/B2", "frTitle": "L'antériorité, la simultanéité, la postériorité", "enSub": "Linking two actions: before, at the same time, or after", "desc": "Linking two actions: before, at the same time, or after", "body": "<table class=\"gtable\">\n<tr><th></th><th>French</th><th>Example</th></tr>\n<tr><td>Avant (antériorité)</td><td class=\"fr\">avant de + infinitif</td><td class=\"fr\">Ferme la porte avant de partir.</td></tr>\n<tr><td></td><td class=\"fr\">avant que + subjonctif</td><td class=\"fr\">Appelle-moi avant qu'il n'arrive.</td></tr>\n<tr><td>En même temps (simultanéité)</td><td class=\"fr\">pendant que + indicatif</td><td class=\"fr\">Elle lisait pendant que je cuisinais.</td></tr>\n<tr><td></td><td class=\"fr\">gérondif (en + participe présent)</td><td class=\"fr\">Il chante en conduisant.</td></tr>\n<tr><td>Après (postériorité)</td><td class=\"fr\">après + infinitif passé</td><td class=\"fr\">Après avoir mangé, il est sorti.</td></tr>\n<tr><td></td><td class=\"fr\">après que + indicatif</td><td class=\"fr\">Il est sorti après qu'il a mangé.</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">Infinitif passé = avoir/être à l'infinitif + participe passé. On l'utilise quand les deux verbes ont le même sujet.</span>\n<span class=\"en\">The infinitif passé (avoir/être + past participle) is used with \"après\" when both actions share the same subject: <em>après avoir mangé</em> (\"after eating\").</span>\n</div>\n<div class=\"note\">\n<span class=\"fr\">\"Tant que\" (+ indicatif) exprime une durée liée à une condition : l'action continue tant que la condition est vraie.</span>\n<span class=\"en\">\"Tant que\" (+ indicative) expresses a duration tied to a condition: the action continues as long as the condition holds. <em>Je resterai tant que tu auras besoin de moi.</em> (\"I'll stay as long as you need me.\")</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"gerondif\">→ Le gérondif</a>\n</div>"}, {"id": "participe-passe-compose", "level": "B2", "frTitle": "Le participe passé composé", "enSub": "\"Having done\" — a compact way to express a prior action", "desc": "Formation: ayant/étant + past participle. Mostly used in writing to compress a cause or a prior action into one clause, avoiding \"parce que\" or \"après que\".", "body": "<div class=\"rule\">\n<span class=\"fr\">Formation : ayant/étant + participe passé. S'utilise surtout à l'écrit pour exprimer une cause ou une antériorité de façon condensée.</span>\n<span class=\"en\">Formation: ayant/étant + past participle. Mostly used in writing to compress a cause or a prior action into one clause, avoiding \"parce que\" or \"après que\".</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Ayant terminé son travail, il est parti se promener.</span><span class=\"en\">Having finished his work, he went for a walk. (= Comme il avait terminé son travail…)</span></div>\n<div class=\"ex\"><span class=\"fr\">Étant arrivée en retard, elle a raté le début de la réunion.</span><span class=\"en\">Having arrived late, she missed the start of the meeting.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Le sujet doit être le même dans les deux parties de la phrase.</span>\n<span class=\"en\">Both parts of the sentence must share the same subject — like the gérondif and the infinitif passé.</span>\n</div>"}, {"id": "prepositions-lieu", "level": "A2/B1", "frTitle": "Les prépositions et adverbes de lieu", "enSub": "Prepositions and adverbs describing where something is", "desc": "With cities, countries, and continents, the preposition depends on the noun's gender and number.", "body": "<table class=\"gtable\">\n<tr><th>French</th><th>Meaning</th></tr>\n<tr><td class=\"fr\">devant / derrière</td><td>in front of / behind</td></tr>\n<tr><td class=\"fr\">dessus / dessous</td><td>on top / underneath (no noun follows)</td></tr>\n<tr><td class=\"fr\">au-dessus de / au-dessous de</td><td>above / below (+ noun)</td></tr>\n<tr><td class=\"fr\">au milieu de</td><td>in the middle of</td></tr>\n<tr><td class=\"fr\">autour de</td><td>around</td></tr>\n<tr><td class=\"fr\">à côté de / près de</td><td>next to / near</td></tr>\n<tr><td class=\"fr\">loin de</td><td>far from</td></tr>\n<tr><td class=\"fr\">au bord de</td><td>at the edge of</td></tr>\n<tr><td class=\"fr\">chez</td><td>at (someone)'s place</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">Dessus/dessous/dedans/dehors sont des adverbes (jamais suivis d'un nom) ; les formes en \"de\" sont des prépositions (toujours suivies d'un nom).</span>\n<span class=\"en\">Dessus/dessous/dedans/dehors are adverbs and never take a noun directly after them; the \"de\" forms are prepositions and always need a noun: <em>Le chat est dessus.</em> vs <em>Le chat est au-dessus de la table.</em></span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Avec les villes, pays et continents, la préposition dépend du genre et du nombre du nom.</span>\n<span class=\"en\">With cities, countries, and continents, the preposition depends on the noun's gender and number.</span>\n</div>\n<table class=\"gtable\">\n<tr><th></th><th>à / en / au / aux</th><th>Example</th></tr>\n<tr><td>Ville</td><td class=\"fr\">à</td><td class=\"fr\">à Paris, à Tokyo</td></tr>\n<tr><td>Pays féminin (ou commençant par une voyelle)</td><td class=\"fr\">en</td><td class=\"fr\">en France, en Espagne, en Iran</td></tr>\n<tr><td>Pays masculin</td><td class=\"fr\">au</td><td class=\"fr\">au Japon, au Canada, au Brésil</td></tr>\n<tr><td>Pays pluriel</td><td class=\"fr\">aux</td><td class=\"fr\">aux États-Unis, aux Pays-Bas</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">La plupart des pays qui se terminent par -e sont féminins (exceptions : le Mexique, le Cambodge…).</span>\n<span class=\"en\">Most countries ending in -e are feminine (exceptions: le Mexique, le Cambodge…) — a useful rule of thumb for picking \"en\" vs \"au\".</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"prepositions-a-de-en-par-pour\">→ Les prépositions à, de, en, par, pour</a>\n</div>"}, {"id": "prepositions-a-de-en-par-pour", "level": "B1", "frTitle": "Les prépositions à, de, en, par, pour", "enSub": "The prepositions à, de, en, par, pour", "desc": "The non-locative uses of the five core prepositions: attitude, cause, means, manner, material, measure, agent, purpose — one at a time.", "body": "<div class=\"rule\">\n<span class=\"fr\">Au-delà du lieu, <strong>à, de, en, par, pour</strong> introduisent des compléments de sens très variés. Voici leurs emplois les plus fréquents en dehors de la localisation.</span>\n<span class=\"en\">Beyond location, these five prepositions cover a wide range of other meanings. Here are their most common non-locative uses.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>À</th><th>Sens / usage</th></tr>\n<tr><td class=\"fr\">arracher, voler, prendre qqch <strong>à</strong> qqn</td><td>taking something away from someone</td></tr>\n<tr><td class=\"fr\">penser à, s'intéresser à, aspirer à qqch</td><td>a mental tendency toward something</td></tr>\n<tr><td class=\"fr\">arriver à, réussir à, parvenir à qqch</td><td>achieving a goal</td></tr>\n<tr><td class=\"fr\">prêt à, hostile à, supérieur à, comparable à</td><td>adjective + à: attitude or comparison</td></tr>\n<tr><td class=\"fr\">à voix basse, à reculons, peu à peu, au fur et à mesure</td><td>manner or gradation</td></tr>\n<tr><td class=\"fr\">une tasse à thé, un moulin à café</td><td>purpose/function of an object</td></tr>\n</table>\n<table class=\"gtable\">\n<tr><th>De</th><th>Sens / usage</th></tr>\n<tr><td class=\"fr\">parler de, se souvenir de, se moquer de, dépendre de</td><td>complement of many common verbs</td></tr>\n<tr><td class=\"fr\">content de, sûr de, fier de + adjectif</td><td>adjective + de</td></tr>\n<tr><td class=\"fr\">la veste <strong>de</strong> ma sœur ; une tasse <strong>de</strong> thé</td><td>possession, or the category/content of a thing</td></tr>\n<tr><td class=\"fr\">trembler de peur, mourir de faim, crier de douleur</td><td>cause behind a physical/emotional reaction</td></tr>\n<tr><td class=\"fr\">une centaine de personnes ; il a vieilli de dix ans</td><td>quantity, or a measured difference</td></tr>\n</table>\n<table class=\"gtable\">\n<tr><th>En</th><th>Sens / usage</th></tr>\n<tr><td class=\"fr\">en train, en avion, en métro</td><td>means of transport</td></tr>\n<tr><td class=\"fr\">une bague en or ; un pot en terre</td><td>material something is made of</td></tr>\n<tr><td class=\"fr\">en colère, en forme, en bonne santé</td><td>a physical or psychological state</td></tr>\n<tr><td class=\"fr\">je l'ai fait en dix minutes</td><td>time needed to complete something (closed duration)</td></tr>\n<tr><td class=\"fr\">croire en, avoir confiance en</td><td>trust/belief (vs \"croire à\" for facts/ideas)</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\"><strong>En</strong> exprime une généralité, <strong>dans</strong> une spécificité : il vit <em>en</em> banlieue / dans <em>une</em> banlieue calme.</span>\n<span class=\"en\"><strong>En</strong> expresses a generality, <strong>dans</strong> a specific instance: \"il vit en banlieue\" (generally, in the suburbs) vs \"dans une banlieue calme\" (in a specific, quiet suburb).</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Par</th><th>Sens / usage</th></tr>\n<tr><td class=\"fr\">envoyer par avion, appeler par son nom</td><td>the means used</td></tr>\n<tr><td class=\"fr\">aider par gentillesse, agir par jalousie</td><td>the motive/cause behind an action</td></tr>\n<tr><td class=\"fr\">une fois par semaine, trois fois par an</td><td>distribution/rate</td></tr>\n<tr><td class=\"fr\">Ce tableau a été peint <strong>par</strong> mon père.</td><td>the agent of a passive sentence</td></tr>\n<tr><td class=\"fr\">commencer par, finir par, terminer par</td><td>the start or end point of an action</td></tr>\n</table>\n<table class=\"gtable\">\n<tr><th>Pour</th><th>Sens / usage</th></tr>\n<tr><td class=\"fr\">il est parti <strong>pour</strong> New York</td><td>destination</td></tr>\n<tr><td class=\"fr\">j'ai bu un café <strong>pour</strong> ne pas dormir</td><td>purpose/goal</td></tr>\n<tr><td class=\"fr\">condamné <strong>pour</strong> vol ; apprécié <strong>pour</strong> sa gentillesse</td><td>cause/reason (often for a judgment)</td></tr>\n<tr><td class=\"fr\">elle est partie <strong>pour</strong> deux semaines</td><td>a duration that was planned in advance</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je dois lui rendre ce livre, je l'ai emprunté à Julien.</span><span class=\"en\">I have to return this book to him, I borrowed it from Julien — \"à\" for the person something is taken/borrowed from.</span></div>\n<div class=\"ex\"><span class=\"fr\">Elle a vieilli de dix ans en un an.</span><span class=\"en\">She's aged ten years in one — \"de\" for the measured difference, \"en\" for the closed duration it took.</span></div>\n<div class=\"ex\"><span class=\"fr\">Le magasin est fermé pour travaux.</span><span class=\"en\">The shop is closed for renovation work — \"pour\" giving the reason.</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"prepositions-lieu\">→ Les prépositions et adverbes de lieu</a>\n<a class=\"xref\" data-target=\"verbe-preposition\">→ Verbes + préposition</a>\n</div>"}, {"id": "interrogation", "level": "A2/B1", "frTitle": "L'interrogation", "enSub": "Three ways to ask a question, by register", "desc": "Three ways to ask a question, by register", "body": "<table class=\"gtable\">\n<tr><th>Register</th><th>Structure</th><th>Example</th></tr>\n<tr><td>Familier</td><td class=\"fr\">intonation montante, ordre normal</td><td class=\"fr\">Tu viens ce soir ?</td></tr>\n<tr><td>Standard</td><td class=\"fr\">est-ce que + ordre normal</td><td class=\"fr\">Est-ce que tu viens ce soir ?</td></tr>\n<tr><td>Soutenu</td><td class=\"fr\">inversion sujet-verbe</td><td class=\"fr\">Viens-tu ce soir ?</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">À l'inversion, si le verbe se termine par une voyelle et le sujet est il/elle/on, on ajoute \"-t-\".</span>\n<span class=\"en\">With inversion, if the verb ends in a vowel and the subject is il/elle/on, a \"-t-\" is inserted for pronunciation: <em>Parle-t-il français ?</em></span>\n</div>"}, {"id": "connecteurs-argumentation", "level": "B2", "frTitle": "Argumenter : les connecteurs logiques", "enSub": "Connectors for building and structuring an argument", "desc": "Connectors for building and structuring an argument", "body": "<table class=\"gtable\">\n<tr><th>Fonction</th><th>Connecteurs</th></tr>\n<tr><td>Ajouter un argument</td><td class=\"fr\">de plus, en outre, par ailleurs, d'ailleurs</td></tr>\n<tr><td>Nuancer / opposer</td><td class=\"fr\">cependant, néanmoins, toutefois, en revanche</td></tr>\n<tr><td>Illustrer</td><td class=\"fr\">par exemple, ainsi, notamment</td></tr>\n<tr><td>Conclure</td><td class=\"fr\">en somme, en conclusion, finalement, en définitive</td></tr>\n<tr><td>Justifier</td><td class=\"fr\">en effet, effectivement</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Ce projet est ambitieux. De plus, il est réaliste.</span><span class=\"en\">This project is ambitious. Moreover, it's realistic. (adding an argument)</span></div>\n<div class=\"ex\"><span class=\"fr\">Le prix a baissé ; en revanche, la qualité s'est dégradée.</span><span class=\"en\">The price dropped; on the other hand, the quality has declined. (contrast)</span></div>\n<div class=\"ex\"><span class=\"fr\">Le projet est risqué. En effet, le budget n'est pas assuré.</span><span class=\"en\">The project is risky. Indeed, the budget isn't secured. (justifying the previous claim)</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"cause\">→ Cause</a>\n<a class=\"xref\" data-target=\"consequence\">→ Consequence</a>\n<a class=\"xref\" data-target=\"opposition-concession\">→ Opposition &amp; concession</a>\n</div>"}, {"id": "chiffres-proportion", "level": "B2", "frTitle": "Les données chiffrées et la proportion", "enSub": "Talking about statistics, quantities, and proportions", "desc": "Talking about statistics, quantities, and proportions", "body": "<table class=\"gtable\">\n<tr><th>Fonction</th><th>Expressions</th></tr>\n<tr><td>Évolution à la hausse</td><td class=\"fr\">augmenter, croître, progresser, une hausse de</td></tr>\n<tr><td>Évolution à la baisse</td><td class=\"fr\">diminuer, chuter, baisser, une baisse de</td></tr>\n<tr><td>Stabilité</td><td class=\"fr\">stagner, rester stable, se maintenir</td></tr>\n<tr><td>Proportion</td><td class=\"fr\">la moitié de, un tiers de, la majorité de, la plupart de</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Le chômage a augmenté de 2 % en un an.</span><span class=\"en\">Unemployment increased by 2% in a year.</span></div>\n<div class=\"ex\"><span class=\"fr\">Le taux de participation est passé de 40 % à 55 %.</span><span class=\"en\">The participation rate went from 40% to 55%.</span></div>\n<div class=\"ex\"><span class=\"fr\">La majorité des sondés se disent favorables au projet.</span><span class=\"en\">The majority of respondents say they support the project.</span></div>\n<div class=\"ex\"><span class=\"fr\">Plus de la moitié des salariés travaillent à distance.</span><span class=\"en\">More than half of employees work remotely.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">\"La majorité/la moitié/un tiers de\" + nom pluriel : le verbe s'accorde en général avec le nom complément.</span>\n<span class=\"en\">With \"la majorité/la moitié/un tiers de\" + plural noun, the verb usually agrees with the noun that follows \"de\" (la majorité des gens pensent…) rather than with \"majorité\" itself.</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"nombres-heure-date\">→ Les nombres, l'heure et la date (basics)</a>\n<a class=\"xref\" data-target=\"accord-sujet-verbe\">→ Full subject-verb agreement rules (collective nouns, coordinated subjects…)</a>\n</div>"}, {"id": "accord-sujet-verbe", "level": "B2", "frTitle": "L'accord du verbe avec le sujet", "enSub": "Special cases: collective nouns, multiple subjects, coordination", "desc": "With a collective noun (foule, tas, majorité, dizaine…) + plural noun, the verb can be singular (emphasizing the group as a whole) or plural (emphasizing the individual members) — both are correct, the choice is a matter of emphasis.", "body": "<div class=\"rule\">\n<span class=\"fr\">Avec un nom collectif (foule, tas, majorité, dizaine…) + nom pluriel, le verbe s'accorde au singulier pour insister sur le collectif, ou au pluriel pour insister sur les éléments.</span>\n<span class=\"en\">With a collective noun (foule, tas, majorité, dizaine…) + plural noun, the verb can be singular (emphasizing the group as a whole) or plural (emphasizing the individual members) — both are correct, the choice is a matter of emphasis.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Une dizaine de spectateurs resta / restèrent dans la salle.</span><span class=\"en\">About ten spectators stayed in the room — both singular and plural work here.</span></div>\n<div class=\"ex\"><span class=\"fr\">La plupart des spectateurs restèrent dans la salle.</span><span class=\"en\">Most spectators stayed — with \"la plupart de\", the plural is by far the most common choice.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Avec des sujets coordonnés par \"et\", le verbe est au pluriel. Avec \"ou\" ou \"ni\", le pluriel est le plus fréquent, mais le singulier est possible si \"ou\" est exclusif.</span>\n<span class=\"en\">Subjects joined by \"et\" always take a plural verb. Subjects joined by \"ou\"/\"ni\" usually take a plural verb too, but a singular verb is possible when \"ou\" is exclusive (only one of the two applies).</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">La boulangerie, la boucherie et le bar-tabac maintiennent une vie dans le village.</span><span class=\"en\">The bakery, the butcher's, and the bar-tabac keep the village alive — \"et\" → plural.</span></div>\n<div class=\"ex\"><span class=\"fr\">Le médecin ou une infirmière vous remettra votre dossier.</span><span class=\"en\">The doctor or a nurse will hand you your file — only one of the two will, so the singular is used.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">\"Comme\", \"ainsi que\" : comparaison → singulier ; équivalent de \"et\" → pluriel.</span>\n<span class=\"en\">\"Comme\", \"ainsi que\": when they express a comparison, the verb stays singular; when they function like \"et\" (coordinating two equal subjects), the verb is plural.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Son mari, comme beaucoup de jeunes cadres, fait de sa carrière une priorité.</span><span class=\"en\">Her husband, like many young executives, makes his career a priority — comparison, singular.</span></div>\n<div class=\"ex\"><span class=\"fr\">Sa femme comme son fils aimeraient le voir travailler moins.</span><span class=\"en\">His wife as well as his son would like to see him work less — coordination, plural.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Avec \"nous\"/\"vous\" de politesse ou de majesté, le verbe est au pluriel, mais le participe passé s'accorde selon le sens réel (souvent au singulier).</span>\n<span class=\"en\">With the polite/formal \"nous\"/\"vous\" (standing for a single person), the verb itself is plural, but the past participle agrees with the real, singular referent: <em>Avez-vous été contrôlé dans le train ?</em> (asked to one person).</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Les adverbes de quantité (beaucoup, peu, trop, assez…) + de + nom pluriel entraînent un verbe au pluriel. Mais \"le peu de\" (avec déterminant) peut entraîner le singulier, l'accent étant mis sur la petite quantité.</span>\n<span class=\"en\">Quantity adverbs (beaucoup, peu, trop, assez…) + de + plural noun take a plural verb. But \"le peu de\" (with a determiner) can take a singular verb instead, when the focus is on the small quantity itself rather than the individual items.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Beaucoup de réalisateurs utilisent aujourd'hui des effets spéciaux.</span><span class=\"en\">Many directors use special effects today — plural is obligatory here.</span></div>\n<div class=\"ex\"><span class=\"fr\">Le peu de réalisateurs qui tourne encore en noir et blanc passe pour élitiste.</span><span class=\"en\">The few directors who still shoot in black and white are seen as elitist — singular possible, emphasizing \"the small number\" as a concept.</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"pronom-on\">→ Le pronom on</a>\n</div>\n<div class=\"rule\" style=\"margin-top:10px;\">\n<span class=\"fr\">Avec le pronom relatif <strong>qui</strong> sujet, le verbe s'accorde avec l'antécédent de \"qui\", pas avec \"qui\" lui-même.</span>\n<span class=\"en\">With the relative pronoun <strong>qui</strong> as subject, the verb agrees with \"qui\"'s antecedent, not with \"qui\" itself.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Moi qui ai toujours cru à son innocence, je suis déçu.</span><span class=\"en\">I, who always believed in his innocence, am disappointed — antecedent \"moi\" (1st person), so \"ai\", not \"a\".</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Avec un sujet <strong>ce/cela/ça</strong>, le verbe est à la 3e personne du singulier — sauf \"c'est\" suivi d'un pluriel, où le pluriel est possible.</span>\n<span class=\"en\">With <strong>ce/cela/ça</strong> as subject, the verb is 3rd person singular — except \"c'est\" followed by a plural, where a plural verb (\"ce sont\") is also used.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Cela fit beaucoup de bruit dans la presse.</span><span class=\"en\">That made a lot of noise in the press — singular.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ce sont des sujets rarement abordés. (ou : C'est des sujets...)</span><span class=\"en\">These are rarely discussed topics — plural is more formal, singular is common in everyday speech.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Avec un sujet en fraction ou pourcentage (la moitié de, les deux tiers de, 90 % de…) + nom pluriel, l'accord se fait le plus souvent au pluriel, mais le singulier est possible si l'on insiste sur la fraction elle-même.</span>\n<span class=\"en\">With a fraction/percentage subject (la moitié de, les deux tiers de, 90 % de…) + plural noun, the verb usually agrees with the plural noun, but a singular verb is possible when the fraction itself is emphasized.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">La moitié des invités sont partis avant minuit.</span><span class=\"en\">Half the guests left before midnight — plural, the most common choice.</span></div>\n</div></details>"}]}, {"id": "cat-conj", "label": "6. Conjugation Reference", "frLabel": "Tableaux de conjugaison", "desc": "Full conjugation tables for reference — the regular patterns spelled out in full.", "levelRange": "A1–B1", "lessons": [{"id": "verbes-reguliers", "level": "A1/A2", "frTitle": "Les verbes réguliers au présent", "enSub": "Present-tense endings for regular -er, -ir, and -re verbs", "desc": "Present-tense endings for regular -er, -ir, and -re verbs", "body": "<table class=\"gtable\">\n<tr><th></th><th>-er (parler)</th><th>-ir (finir)</th><th>-re (vendre)</th></tr>\n<tr><td>je</td><td class=\"fr\">parle</td><td class=\"fr\">finis</td><td class=\"fr\">vends</td></tr>\n<tr><td>tu</td><td class=\"fr\">parles</td><td class=\"fr\">finis</td><td class=\"fr\">vends</td></tr>\n<tr><td>il/elle/on</td><td class=\"fr\">parle</td><td class=\"fr\">finit</td><td class=\"fr\">vend</td></tr>\n<tr><td>nous</td><td class=\"fr\">parlons</td><td class=\"fr\">finissons</td><td class=\"fr\">vendons</td></tr>\n<tr><td>vous</td><td class=\"fr\">parlez</td><td class=\"fr\">finissez</td><td class=\"fr\">vendez</td></tr>\n<tr><td>ils/elles</td><td class=\"fr\">parlent</td><td class=\"fr\">finissent</td><td class=\"fr\">vendent</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">-er est le groupe le plus régulier et le plus fréquent ; -ir (type finir) ajoute -iss- au pluriel ; -re perd son -d au singulier sauf à la 3e personne.</span>\n<span class=\"en\">-er is the largest, most regular group. -ir verbs like \"finir\" insert -iss- before the plural endings. -re verbs drop the final consonant sound in the singular except il/elle/on, which just keeps the bare stem + -d.</span>\n</div>\n<div class=\"note\">\n<span class=\"fr\">Attention : beaucoup de verbes en -ir ne suivent pas ce modèle (partir, sortir, venir…) — ce sont des irréguliers, voir le tableau ci-dessous.</span>\n<span class=\"en\">Careful: many -ir verbs (partir, sortir, venir…) don't follow this pattern at all — they're irregular and conjugate differently (see the table below).</span>\n</div>\n<div class=\"note\">\n<span class=\"fr\">Terminologie des dictionnaires de conjugaison (type Bescherelle) : 1er groupe = verbes en -er (sauf aller) ; 2e groupe = verbes en -ir type \"finir\" (avec -iss-) ; 3e groupe = tous les autres verbes, y compris \"aller\" et tous les irréguliers.</span>\n<span class=\"en\">Terminology used in conjugation reference books (like Bescherelle): \"1er groupe\" = -er verbs (except aller); \"2e groupe\" = -ir verbs following the \"finir\" pattern (with -iss-); \"3e groupe\" = everything else, including \"aller\" and all irregular verbs — this is just a classification label, not a different rule.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Group</th><th>Past participle ending</th><th>Example</th></tr>\n<tr><td>1er groupe (-er)</td><td class=\"fr\">-é</td><td class=\"fr\">aimer → aimé</td></tr>\n<tr><td>2e groupe (-ir/finir)</td><td class=\"fr\">-i</td><td class=\"fr\">finir → fini</td></tr>\n<tr><td>3e groupe (irregular)</td><td class=\"fr\">-i / -u / -s / -t</td><td class=\"fr\">sorti, couru, mis, craint</td></tr>\n</table>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"verbes-changements-orthographiques\">→ Les verbes à changements orthographiques</a>\n</div>"}, {"id": "conj-tables", "level": "A2/B1", "frTitle": "Verbes fréquents et irréguliers", "enSub": "Quick-reference forms for high-frequency irregular verbs", "desc": "Every person, spelled out in full. Switch tenses with the buttons below — the table updates in place.", "body": "<h4 style=\"margin:14px 0 4px 0; font-size:0.92rem; color:var(--accent);\">Full conjugation — 20 most frequent irregular verbs</h4>\n<div class=\"rule\">\n<span class=\"en\">Every person, spelled out in full. Switch tenses with the buttons below — the table updates in place.</span>\n</div>\n<div class=\"tense-tabs\" id=\"tenseTabs\">\n<button class=\"tense-tab active\" data-tense=\"present\" type=\"button\">Présent</button>\n<button class=\"tense-tab\" data-tense=\"pc\" type=\"button\">Passé composé</button>\n<button class=\"tense-tab\" data-tense=\"imparfait\" type=\"button\">Imparfait</button>\n<button class=\"tense-tab\" data-tense=\"futur\" type=\"button\">Futur</button>\n<button class=\"tense-tab\" data-tense=\"conditionnel\" type=\"button\">Conditionnel</button>\n<button class=\"tense-tab\" data-tense=\"subjonctif\" type=\"button\">Subjonctif*</button>\n</div>\n<div class=\"table-scroll\">\n<table class=\"gtable\" id=\"conjTable\">\n<thead>\n<tr><th>Verb</th><th>je</th><th>tu</th><th>il/elle</th><th>nous</th><th>vous</th><th>ils/elles</th></tr>\n</thead>\n<tbody id=\"conjTableBody\"></tbody>\n</table>\n</div>\n<div class=\"note\" id=\"subjNote\" style=\"display:none;\">\n<span class=\"fr\">*Le subjonctif s'utilise toujours après \"que\" : que je sois, que tu aies…</span>\n<span class=\"en\">*The subjunctive is always introduced by \"que\" in real use (que je sois, que tu aies…) — the table shows the bare forms for compactness.</span>\n</div>\n<div class=\"note\">\n<span class=\"fr\">Attention aux verbes à \"double radical\" : boire (buvons/buvez, mais boivent) et prendre (prenons/prenez, mais prennent) changent de radical à la 3e pers. du pluriel.</span>\n<span class=\"en\">Watch for \"stem-changing\" verbs: boire and prendre (and their families — apprendre, comprendre, surprendre) use one stem for nous/vous and a different one for ils/elles. In the passé composé, verbs marked with être use \"(e)(s)\" to show optional agreement with the subject.</span>\n</div>\n<h4 style=\"margin:18px 0 4px 0; font-size:0.92rem; color:var(--accent);\">Additional common verbs (single-tense reference)</h4>\n<table class=\"gtable\">\n<tr><th>Verb</th><th>Present (je)</th><th>Passé composé (j')</th><th>Futur (je)</th><th>Subjonctif (que je)</th></tr>\n<tr><td class=\"fr\">voir</td><td class=\"fr\">vois</td><td class=\"fr\">ai vu</td><td class=\"fr\">verrai</td><td class=\"fr\">voie</td></tr>\n<tr><td class=\"fr\">dire</td><td class=\"fr\">dis</td><td class=\"fr\">ai dit</td><td class=\"fr\">dirai</td><td class=\"fr\">dise</td></tr>\n<tr><td class=\"fr\">mettre</td><td class=\"fr\">mets</td><td class=\"fr\">ai mis</td><td class=\"fr\">mettrai</td><td class=\"fr\">mette</td></tr>\n<tr><td class=\"fr\">ouvrir</td><td class=\"fr\">ouvre</td><td class=\"fr\">ai ouvert</td><td class=\"fr\">ouvrirai</td><td class=\"fr\">ouvre</td></tr>\n<tr><td class=\"fr\">conduire</td><td class=\"fr\">conduis</td><td class=\"fr\">ai conduit</td><td class=\"fr\">conduirai</td><td class=\"fr\">conduise</td></tr>\n<tr><td class=\"fr\">suivre</td><td class=\"fr\">suis</td><td class=\"fr\">ai suivi</td><td class=\"fr\">suivrai</td><td class=\"fr\">suive</td></tr>\n<tr><td class=\"fr\">peindre</td><td class=\"fr\">peins</td><td class=\"fr\">ai peint</td><td class=\"fr\">peindrai</td><td class=\"fr\">peigne</td></tr>\n<tr><td class=\"fr\">se souvenir</td><td class=\"fr\">me souviens</td><td class=\"fr\">me suis souvenu(e)</td><td class=\"fr\">me souviendrai</td><td class=\"fr\">me souvienne</td></tr>\n<tr><td class=\"fr\">s'installer</td><td class=\"fr\">m'installe</td><td class=\"fr\">me suis installé(e)</td><td class=\"fr\">m'installerai</td><td class=\"fr\">m'installe</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">Familles : ouvrir (découvrir, accueillir, offrir) ; conduire (produire, construire) ; peindre (éteindre) ; mettre (permettre, promettre).</span>\n<span class=\"en\">These verbs follow patterns shared by whole \"families\" of related verbs — learn one, get several for free.</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref back-style\" data-target=\"passe-compose\">← Passé composé rules</a>\n<a class=\"xref back-style\" data-target=\"subjonctif\">← Subjonctif formation</a>\n</div>"}]}, {"id": "cat-c1", "label": "7. C1–C2 — Advanced (Édito & CLE Perfectionnement)", "frLabel": "Points de grammaire avancés (C1-C2)", "desc": "Contrastive grammar for English speakers, grammar pages from the Édito C1 textbook, and advanced nuances from the CLE International Grammaire Progressive du Français (Perfectionnement) — subtle usage, tricky agreement, register, and refinements on topics covered more simply elsewhere in the guide. Related C1 and B2-C2 lessons sit next to each other and cross-link.", "levelRange": "C1-C2", "lessons": [{"id": "c1-tout", "level": "C1", "frTitle": "Tout : adjectif, nom, pronom, adverbe", "enSub": "The many faces of tout", "desc": "Tout can be an adjective, a noun, a pronoun or an adverb — English needs a different word each time (all, every, entirely...).", "body": "<div class=\"rule\">\n<span class=\"fr\">Tout n'a pas d'équivalent unique en anglais ; sa forme et son sens changent selon sa fonction dans la phrase.</span>\n<span class=\"en\">Tout can be an adjective, a noun, a pronoun or an adverb — English needs a different word each time (all, every, entirely...).</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Function</th><th>Meaning</th><th>Example</th></tr>\n<tr><td>Adjective</td><td>all / every, agrees with the noun</td><td class=\"fr\">Tous les colis sont arrivés.</td></tr>\n<tr><td>Noun</td><td>the whole (rare, plural touts)</td><td class=\"fr\">J'achète le tout.</td></tr>\n<tr><td>Pronoun</td><td>everything / all of them, agrees</td><td class=\"fr\">Elles sont toutes arrivées.</td></tr>\n<tr><td>Adverb</td><td>entirely / very, mostly invariable</td><td class=\"fr\">Ils sont tout tristes.</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">Ils sont tout tristes ≠ Ils sont tous tristes.</span>\n<span class=\"en\">Watch out: as an adverb tout stays invariable before a masculine adjective (\"very sad\") — as a pronoun tous agrees (\"all of them are sad\"). Same spelling trap, opposite meaning.</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Devant un adjectif féminin commençant par une consonne, l'adverbe tout s'accorde ; devant une voyelle ou un h muet, l'accord est facultatif.</span>\n<span class=\"en\">As an adverb, tout agrees before a feminine adjective starting with a consonant (elles sont toutes sales) but agreement is optional before a vowel/mute h.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Tout Rome brûlait.</span><span class=\"en\">All of Rome was burning — before a city name, tout does not agree.</span></div>\n<div class=\"ex\"><span class=\"fr\">à toute allure, en toutes lettres, de tout cœur</span><span class=\"en\">Many set expressions are frozen in the singular or plural only — worth learning as chunks rather than deriving from a rule.</span></div>\n</div></details>"}, {"id": "c1-on-un", "level": "C1", "frTitle": "On/l'on, un/l'un", "enSub": "The euphonic l' before on and un", "desc": "L'on and l'un aren't grammatically required — they're added purely for smoother sound, mostly after a word ending in a vowel (que, et, où, si...).", "body": "<div class=\"rule\">\n<span class=\"fr\">Devant on et un en début de proposition, le l' euphonique n'a pas de valeur grammaticale mais adoucit la prononciation.</span>\n<span class=\"en\">L'on and l'un aren't grammatically required — they're added purely for smoother sound, mostly after a word ending in a vowel (que, et, où, si...).</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il faut que l'on parte.</span><span class=\"en\">We need to go — l'on flows better than qu'on here, though both are correct.</span></div>\n<div class=\"ex\"><span class=\"fr\">L'un des plus beaux villages que je connaisse est Gordes.</span><span class=\"en\">One of the most beautiful villages I know is Gordes — l'un is common and agrees (l'une, les uns/unes).</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Il faut qu'on lise ce livre. (pas \"l'on lise\")</span>\n<span class=\"en\">Watch out: skip l' before a word starting with \"l\" — too many l-sounds in a row (qu'on lise, not qu'on l'on lise).</span>\n</div>"}, {"id": "c1-ca-cest-il-est", "level": "C1", "frTitle": "Ça, c'est ou il/elle est ?", "enSub": "Neutral ça/c'est vs personal il/elle est", "desc": "Ça ≠ il: Il marche (he's walking) vs Ça marche (it's working / that's fine).", "body": "<div class=\"rule\">\n<span class=\"fr\">Ça est un pronom neutre ; il/elle est un pronom personnel. Les deux se traduisent par \"it\" ou \"he/she\" en anglais, ce qui prête à confusion.</span>\n<span class=\"en\">Ça ≠ il: <em>Il marche</em> (he's walking) vs <em>Ça marche</em> (it's working / that's fine).</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Structure</th><th>Use</th><th>Example</th></tr>\n<tr><td class=\"fr\">C'est + nom (article)</td><td>identification</td><td class=\"fr\">C'est ma tante.</td></tr>\n<tr><td class=\"fr\">Il/elle est + adjectif</td><td>description</td><td class=\"fr\">Elle est grande.</td></tr>\n<tr><td class=\"fr\">Il/elle est + métier/religion (sans article)</td><td>catégorie/appartenance</td><td class=\"fr\">Elle est professeure.</td></tr>\n<tr><td class=\"fr\">C'est + adjectif</td><td>commentaire général</td><td class=\"fr\">C'est intéressant.</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">Elle est professeure. ≠ C'est une professeure très compétente.</span>\n<span class=\"en\">Watch out: no article after il/elle est + profession, but c'est + article lets you add a personal, qualified comment (a very good teacher).</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Il est / C'est + adjectif + de + infinitif : les deux sont possibles, il est étant plus formel.</span>\n<span class=\"en\">Il est normal de pleurer. = C'est normal de pleurer — c'est is informal but very common in speech; il est is the formal/written register.</span>\n</div>"}, {"id": "c1-ce-demonstratif", "level": "C1", "frTitle": "Ce : pronom démonstratif neutre", "enSub": "Ce as neutral demonstrative pronoun", "desc": "Ce covers \"it/this/that/these/those\" depending on context, always referring to an idea rather than a specific named thing.", "body": "<div class=\"rule\">\n<span class=\"fr\">Ce, comme pronom neutre, remplace une idée abstraite ou toute une phrase — pas un nom précis.</span>\n<span class=\"en\">Ce covers \"it/this/that/these/those\" depending on context, always referring to an idea rather than a specific named thing.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Elle a réussi son examen, et ce sans réviser.</span><span class=\"en\">She passed her exam, and this without revising — ce sums up the previous clause (formal register).</span></div>\n<div class=\"ex\"><span class=\"fr\">Ce qui se vend bien en ligne, ce sont les livres.</span><span class=\"en\">What sells well online is books — ce qui/que + c'est/ce sont is used for emphasis.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">C'est + nom singulier ; ce sont + nom pluriel — sauf avec nous/vous, où l'on garde c'est.</span>\n<span class=\"en\">C'est des enfants is common in speech, but ce sont des enfants is the written norm. With nous/vous, c'est is always used (c'est nous, c'est vous) but ce sont eux/elles.</span>\n</div>\n<div class=\"note\">\n<span class=\"fr\">pour ce faire, ce faisant, c'en est fait, si ce n'est</span>\n<span class=\"en\">A handful of fixed, fairly formal expressions built on ce are worth recognizing in reading even if you don't produce them yourself.</span>\n</div>"}, {"id": "c1-que-quoi", "level": "C1", "frTitle": "Que, qu'est-ce que ou quoi ?", "enSub": "Three ways to ask \"what?\"", "desc": "English has one word (\"what\"); French picks the form based on grammatical function and formality.", "body": "<div class=\"rule\">\n<span class=\"fr\">\"Quoi\" en français prend trois formes selon sa fonction et le registre : qu'est-ce qui (sujet), que/qu'est-ce que/quoi (objet).</span>\n<span class=\"en\">English has one word (\"what\"); French picks the form based on grammatical function and formality.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Function</th><th>Form</th><th>Register</th></tr>\n<tr><td>Subject</td><td class=\"fr\">qu'est-ce qui</td><td>only option</td></tr>\n<tr><td>Object, sentence-initial</td><td class=\"fr\">que + inversion / qu'est-ce que</td><td>formal / standard</td></tr>\n<tr><td>Object, sentence-final</td><td class=\"fr\">quoi</td><td>informal</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Qu'est-ce qui a déclenché cet événement ?</span><span class=\"en\">What triggered this event? — subject, only qu'est-ce qui works.</span></div>\n<div class=\"ex\"><span class=\"fr\">Que fait Julien ? = Qu'est-ce que Julien fait ? = Julien fait quoi ?</span><span class=\"en\">Three registers, same question: formal, standard, informal.</span></div>\n<div class=\"ex\"><span class=\"fr\">À quoi fait-elle référence ? / De quoi as-tu besoin ?</span><span class=\"en\">After a preposition, que always becomes quoi: à quoi, de quoi, avec quoi...</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"b2c2-interrogation-renforcee\">→ Qui est-ce qui / qu'est-ce qui (renforcé)</a>\n</div>"}, {"id": "b2c2-interrogation-renforcee", "level": "C2", "frTitle": "Qui est-ce qui / qu'est-ce qui : l'interrogation renforcée", "enSub": "Long-form interrogative pronouns for subject and object, formal vs informal registers", "desc": "The \"long forms\" of qui and que sort out subject from object without needing inversion, and shift the register up or down depending on which form is chosen.", "body": "<div class=\"rule\">\n<span class=\"fr\">Pour une personne sujet : qui / qui est-ce qui. Pour une personne objet : qui / qui est-ce que. Pour une chose sujet : qu'est-ce qui (jamais que seul). Pour une chose objet : que / qu'est-ce que.</span>\n<span class=\"en\">Person, subject: qui or qui est-ce qui. Person, object: qui or qui est-ce que. Thing, subject: only qu'est-ce qui — que alone can never be a subject. Thing, object: que or qu'est-ce que.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Qui vient ce soir ? = Qui est-ce qui vient ce soir ?</span><span class=\"en\">Who's coming tonight? — person, subject; both forms possible, qui est-ce qui is more spoken/emphatic.</span></div>\n<div class=\"ex\"><span class=\"fr\">Qui cherches-tu ? = Qui est-ce que tu cherches ?</span><span class=\"en\">Who are you looking for? — person, object; the long form avoids inversion.</span></div>\n<div class=\"ex\"><span class=\"fr\">Qu'est-ce qui te dérange ?</span><span class=\"en\">What's bothering you? — thing, subject; qu'est-ce qui is obligatory here, que sujet does not exist.</span></div>\n<div class=\"ex\"><span class=\"fr\">Que fais-tu ? = Qu'est-ce que tu fais ?</span><span class=\"en\">What are you doing? — thing, object; both work, the long form is the everyday spoken choice.</span></div>\n</div></details><div class=\"note\">\n<span class=\"fr\">À l'oral familier, on entend aussi 'qu'est-ce que c'est que ça ?' ou 'c'est qui ?' — des tours très courants mais réservés au registre familier.</span>\n<span class=\"en\">In casual speech you'll also hear qu'est-ce que c'est que ça? or c'est qui? — both very common, but strictly informal register; avoid them in writing or formal speech.</span>\n</div><div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"mots-interrogatifs\">→ Interrogative words</a>\n<a class=\"xref\" data-target=\"interrogatifs\">→ Interrogatives</a>\n<a class=\"xref\" data-target=\"c1-que-quoi\">→ Que / quoi</a>\n</div>"}, {"id": "c1-accord-sujet-verbe", "level": "C1", "frTitle": "Accord sujet-verbe : cas particuliers", "enSub": "Subject-verb agreement, the tricky cases", "desc": "Unlike English (always singular here), French allows singular or plural depending on emphasis: exclusion, opposition, or togetherness.", "body": "<div class=\"rule\">\n<span class=\"fr\">Avec ni... ni, soit... soit, ou entre deux sujets au singulier, le verbe peut être au singulier ou au pluriel selon le sens visé (exclusion, opposition ou ensemble).</span>\n<span class=\"en\">Unlike English (always singular here), French allows singular or plural depending on emphasis: exclusion, opposition, or togetherness.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Ni le président ni le Premier ministre ne sera/seront là.</span><span class=\"en\">Neither the President nor the PM will attend — either works.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ni ses parents ni sa sœur n'étaient présents.</span><span class=\"en\">If one subject is plural, the verb must be plural.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Avec un nom collectif (équipe, foule, groupe...), le verbe reste généralement au singulier en français.</span>\n<span class=\"en\">Collective nouns take a singular verb in French even where English allows the plural (the team have/has arrived).</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">L'équipe est arrivée.</span><span class=\"en\">The team has/have arrived.</span></div>\n<div class=\"ex\"><span class=\"fr\">Tout le monde est venu à mon anniversaire.</span><span class=\"en\">Everyone came to my party — tout le monde is always singular.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">C'est moi qui ai fait cela. (pas \"qui a fait\")</span>\n<span class=\"en\">With qui as subject, the verb agrees with the antecedent before qui, not with qui itself — easy to get wrong when the antecedent isn't il/elle.</span>\n</div>"}, {"id": "c1-de-des", "level": "C1", "frTitle": "De ou des ?", "enSub": "Article or preposition (1/2): de vs des", "desc": "Three triggers turn des into de/d': an adjective placed before the noun, a negation, or a quantity expression.", "body": "<div class=\"rule\">\n<span class=\"fr\">Des devient de (d') devant un adjectif antéposé, à la forme négative, et après une expression de quantité.</span>\n<span class=\"en\">Three triggers turn des into de/d': an adjective placed before the noun, a negation, or a quantity expression.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Vous avez de beaux enfants.</span><span class=\"en\">You have beautiful children — adjective before the noun.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ils n'ont pas de réponses à nous donner.</span><span class=\"en\">They have no answers to give — negation.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il y a beaucoup de voitures. / Un kilo d'amandes.</span><span class=\"en\">Quantity expressions (beaucoup de, un kilo de, assez de...) always take de.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Nous ne voulons pas des mots mais des actions.</span>\n<span class=\"en\">Watch out: when a negative is opposed to a positive alternative, des stays des.</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Quand le nom est précisé/spécifique, on garde des (= de + les).</span>\n<span class=\"en\">If the noun is specific rather than a vague quantity, the definite article contraction des is kept — as after la plupart de, la majorité de, or a percentage.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">La plupart des étudiants travaillent bien.</span><span class=\"en\">Most students are doing well.</span></div>\n</div></details>"}, {"id": "c1-du-de-la-de", "level": "C1", "frTitle": "Du, de la ou de ?", "enSub": "Article or preposition (2/2): du/de la vs de", "desc": "Generic link (a category/function) → bare de. Specific, identified entity → definite article kept.", "body": "<div class=\"rule\">\n<span class=\"fr\">De seul relie deux noms quand le second exprime une catégorie générale, une fonction ; du/de la/de l' s'utilisent pour une entité précise et unique.</span>\n<span class=\"en\">Generic link (a category/function) → bare de. Specific, identified entity → definite article kept.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">une directrice de projet</span><span class=\"en\">a project director — generic role, bare de.</span></div>\n<div class=\"ex\"><span class=\"fr\">la directrice du projet auquel j'ai participé</span><span class=\"en\">the director of the project I took part in — one specific project, article kept.</span></div>\n<div class=\"ex\"><span class=\"fr\">le ministre du Travail</span><span class=\"en\">the Minister of Labour — a specific, named ministry.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">un gâteau d'anniversaire ≠ le gâteau de l'anniversaire de Juliette</span>\n<span class=\"en\">Same words, different grammar: generic \"birthday cake\" vs one particular birthday's cake.</span>\n</div>"}, {"id": "c1-count-noncount", "level": "C1", "frTitle": "Noms comptables et non comptables", "enSub": "Count nouns vs non-count nouns", "desc": "Identifying count vs non-count nouns matters more in French than English, since it decides the article (du/de la/des) and singular/plural.", "body": "<div class=\"rule\">\n<span class=\"fr\">Les noms non comptables (du sable, de la patience) prennent l'article partitif ; certains noms comptables en français sont non comptables en anglais, et inversement.</span>\n<span class=\"en\">Identifying count vs non-count nouns matters more in French than English, since it decides the article (du/de la/des) and singular/plural.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Le soir, je bois du vin et j'écoute de la musique.</span><span class=\"en\">In the evening I drink wine and listen to music — partitive article for non-count nouns.</span></div>\n</div></details>\n<table class=\"gtable\">\n<tr><th>Countable in French</th><th>English (non-count)</th></tr>\n<tr><td class=\"fr\">des conseils</td><td>advice</td></tr>\n<tr><td class=\"fr\">des meubles</td><td>furniture</td></tr>\n<tr><td class=\"fr\">des bagages</td><td>luggage</td></tr>\n<tr><td class=\"fr\">des données</td><td>data</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">Les gens sont sympas. / Il y avait trois personnes à la réunion.</span>\n<span class=\"en\">Watch out: gens (people in general) is always plural and non-count; personne(s) is a true countable noun — switch to personnes as soon as you're being specific about a number.</span>\n</div>"}, {"id": "c1-groupe-nominal-de-des", "level": "C1", "frTitle": "Former un groupe nominal avec de, d' ou des + nom pluriel", "enSub": "When a plural des shrinks to de: the three triggers for the swap", "body": "<div class=\"rule\">\n<span class=\"fr\">Des devient de/d' devant un nom pluriel dans trois cas : quand le groupe nominal comporte un adjectif antéposé (placé avant le nom) ; quand des/de + nom est précédé d'une expression de quantité ; quand de + des se contracte (complément du nom).</span>\n<span class=\"en\">This is a small but very frequent trap: plural \"des\" isn't always the article to use — three specific triggers force it to shrink to \"de\" (or \"d'\" before a vowel).</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Règle</th><th>Exemple</th></tr>\n<tr><td>des → de/d' : groupe nominal avec adjectif antéposé</td><td class=\"fr\">de magnifiques paysages (= des paysages magnifiques), d'énormes fougères arborescentes</td></tr>\n<tr><td>de/d' + nom : expression de quantité</td><td class=\"fr\">une trentaine d'éleveurs, un peu de réconfort, beaucoup de gens</td></tr>\n<tr><td>de + des → de/d' : complément du nom</td><td class=\"fr\">la réception et l'interprétation d'informations</td></tr>\n<tr><td>de + les → des : complément du nom (article défini pluriel, no contraction needed)</td><td class=\"fr\">le travail des insectes pollinisateurs</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">De minuscules caméléons aux couleurs changeantes, une profusion de grenouilles aux yeux d'or, et une pléthore de papillons dansant dans l'air.</span><span class=\"en\">\"De minuscules caméléons\" (adjective before the noun triggers de), \"une profusion de grenouilles\" and \"une pléthore de papillons\" (quantity expressions + de) — all three des→de triggers stacked in one sentence.</span></div>\n<div class=\"ex\"><span class=\"fr\">Les phénomènes observés peuvent alors donner lieu à de nouvelles interprétations.</span><span class=\"en\">\"de nouvelles interprétations\": nouvelles is antéposé (before the noun), so des becomes de.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">de nombreux(-euses), d'autres, de tel(le)s + nom pluriel sont également des groupes nominaux avec adjectif antéposé, d'où la substitution de de à des.</span>\n<span class=\"en\">A handful of common quantifiers (de nombreux, d'autres, de tels) count as \"adjective before the noun\" for this rule too, even though they don't look like ordinary adjectives.</span>\n</div>", "desc": "Plural des shrinks to de/d' before an antéposé adjective, after a quantity expression, or in certain de+des contractions."}, {"id": "c1-prefixes-suffixes", "level": "C1", "frTitle": "Maîtriser les préfixes et les suffixes", "enSub": "Reading word-formation for meaning: prefixes and suffixes as a vocabulary-building tool", "body": "<div class=\"rule\">\n<span class=\"fr\">Un préfixe se place avant le radical et en modifie le sens (souvent sans changer la nature du mot) ; un suffixe se place après le radical et peut en changer la nature (nom, adjectif, verbe) ainsi que la valeur (diminutif, péjoratif, etc.).</span>\n<span class=\"en\">Recognizing prefixes and suffixes lets you guess the meaning of words you've never seen — useful for reading quickly and for building your own vocabulary (including deliberate néologismes).</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Préfixe</th><th>Valeur</th></tr>\n<tr><td>co-, con-, com-, col-, cor-</td><td>réciprocité, ensemble (coopérer, convivialité, collaborer, correspondre)</td></tr>\n<tr><td>re-, ré-, r-</td><td>à nouveau (refaire, réévaluer, rouvrir)</td></tr>\n<tr><td>ex-</td><td>hors de, ancien (exporter, ex-mari)</td></tr>\n<tr><td>mis-</td><td>mal, négatif (mésentente/misanthrope)</td></tr>\n<tr><td>inter-</td><td>entre (interdépendant, interagir)</td></tr>\n<tr><td>néo-</td><td>nouveau (néologisme, néolibéral)</td></tr>\n<tr><td>mal-</td><td>négation, mauvais (malaimé, malchance)</td></tr>\n<tr><td>il-, im-, in-, ir-</td><td>négation (illisible, impossible, inutile, irréel)</td></tr>\n<tr><td>a-</td><td>privation (apolitique, amoral)</td></tr>\n<tr><td>éco-, cis-</td><td>maison/habitat ; en-deçà de (écosystème, cisalpin)</td></tr>\n</table>\n<div class=\"rule\">\n<span class=\"fr\">Les suffixes peuvent porter une valeur diminutive, péjorative, ou indiquer un domaine (science, idéologie, relation à).</span>\n<span class=\"en\">Suffixes carry their own shades of meaning — some diminish, some belittle, some just classify.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Suffixe</th><th>Valeur</th></tr>\n<tr><td>-ard, -asse, -ace, -âtre</td><td>péjoratif ou diminutif (chauffard, vantard, verdâtre)</td></tr>\n<tr><td>-ique</td><td>relatif à, domaine scientifique (économique, biologique)</td></tr>\n<tr><td>-able, -ible</td><td>possibilité (faisable, lisible)</td></tr>\n<tr><td>-al</td><td>relatif à (national, culturel)</td></tr>\n<tr><td>-iste</td><td>adepte d'une idéologie (capitaliste, écologiste)</td></tr>\n<tr><td>-et, -ette</td><td>diminutif (garçonnet, fillette)</td></tr>\n<tr><td>-isme</td><td>doctrine, mouvement (néologisme, capitalisme)</td></tr>\n<tr><td>-logie</td><td>étude de, science de (biologie, psychologie)</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">Les néologismes se forment très souvent par préfixation ou suffixation à partir d'un radical existant.</span>\n<span class=\"en\">This is exactly how new words like \"transpartisan\" or \"alterpolitique\" get coined — a familiar prefix or suffix bolted onto a recognizable root.</span>\n</div>", "desc": "Common prefixes (co-, re-, inter-, il-/im-/in-/ir-...) and suffixes (-ique, -able, -iste, -logie...) and what they add to a root word."}, {"id": "genre-noms-pieges", "level": "C2", "frTitle": "Le genre des noms : pièges et cas particuliers", "enSub": "Exceptions to the ending clues, masculine words in -e, feminine words in -eur, and noun pairs that change meaning with gender", "desc": "The basic ending-based clues for noun gender have real exceptions, and a handful of common nouns change meaning entirely depending on which gender you give them.", "body": "<div class=\"rule\">\n<span class=\"fr\">Les terminaisons indicatives ont des exceptions fréquentes à connaître : -age est masculin sauf la plage, la cage, la page, la nage, l'image ; -eau est masculin sauf l'eau, la peau ; -aire est masculin sauf la grammaire, une affaire.</span>\n<span class=\"en\">The basic ending clues have well-known exceptions worth memorizing as a set, since they're common words: -age is masculine except la plage (beach), la cage, la page, la nage (swimming), l'image; -eau is masculine except l'eau (water), la peau (skin); -aire is masculine except la grammaire, une affaire (matter/business).</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Beaucoup de noms très courants en -e sont masculins, alors que l'on attendrait un nom féminin : un problème, un système, un programme, un exemple, un groupe, un modèle, un musée, un rôle, un siècle, un texte, un rêve, un risque...</span>\n<span class=\"en\">A large set of very common nouns ending in -e are masculine, even though -e \"feels\" feminine to English speakers — this is one of the most persistent gender traps in French.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Le problème est clair, mais la solution est compliquée.</span><span class=\"en\">The problem is clear, but the solution is complicated — problème (masc.) and solution (fem.) are a classic side-by-side reminder that the -e ending alone proves nothing.</span></div>\n<div class=\"ex\"><span class=\"fr\">un axe, un chapitre, un contexte, un contraste, un domaine, un mélange, un nombre, un paragraphe, un phénomène, un symbole, un volume</span><span class=\"en\">More members of the same masculine-in-e family — worth learning as a set rather than one at a time.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">À l'inverse, beaucoup de noms abstraits en -eur (sensation, qualité) sont féminins : la douleur, la peur, la chaleur, la valeur, une odeur, une couleur, une erreur. Exceptions notables : le bonheur, le malheur (masculins).</span>\n<span class=\"en\">Going the other way, abstract nouns of sensation or quality ending in -eur are feminine: la douleur (pain), la peur (fear), la chaleur (heat), la valeur (value), une odeur (smell), une couleur (color), une erreur (mistake). Two frequent exceptions stay masculine: le bonheur, le malheur (happiness, misfortune) — worth memorizing precisely because they buck the pattern.</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Certains noms ont un double genre et changent de sens selon qu'ils sont masculins ou féminins.</span>\n<span class=\"en\">A handful of common nouns exist in both genders with two unrelated meanings — the gender itself carries the meaning, so getting it wrong changes what you say.</span>\n</div>\n<div class=\"table-scroll\">\n<table class=\"gtable\">\n<tr><th>Masculin</th><th>Féminin</th></tr>\n<tr><td class=\"fr\">le poste (emploi ; poste de radio/TV)</td><td class=\"fr\">la poste (le courrier, le bureau de poste)</td></tr>\n<tr><td class=\"fr\">le mode (manière, façon)</td><td class=\"fr\">la mode (les vêtements, les tendances)</td></tr>\n<tr><td class=\"fr\">le manche (d'un outil, d'une poêle)</td><td class=\"fr\">la manche (d'un vêtement ; la Manche)</td></tr>\n<tr><td class=\"fr\">le tour (promenade ; tour de magie)</td><td class=\"fr\">la tour (construction, bâtiment)</td></tr>\n<tr><td class=\"fr\">le voile (tissu qui couvre)</td><td class=\"fr\">la voile (de bateau ; le sport)</td></tr>\n<tr><td class=\"fr\">le livre (à lire)</td><td class=\"fr\">la livre (monnaie ; unité de poids)</td></tr>\n<tr><td class=\"fr\">le foie (organe)</td><td class=\"fr\">la foi (religion) / la fois (une occurrence)</td></tr>\n<tr><td class=\"fr\">le cours (de langue) / le court (de tennis)</td><td class=\"fr\">la cour (de récréation, d'un immeuble)</td></tr>\n</table>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Elle a un nouveau poste à la banque. / Elle est passée à la poste ce matin.</span><span class=\"en\">She has a new position at the bank. / She stopped by the post office this morning.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ce n'est pas ma mode de vie. / Ce n'est plus à la mode.</span><span class=\"en\">Careful — \"mode de vie\" (way of life) is actually always masculine as a fixed expression (le mode de vie); but la mode alone means fashion. Context and the article are what disambiguate in speech.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ils ont visité la tour Eiffel après leur tour de la ville.</span><span class=\"en\">They visited the Eiffel Tower after their tour of the city — la tour (the tower, a structure) vs le tour (a round trip/tour).</span></div>\n</div></details>\n\n<div class=\"rule\" style=\"margin-top:10px;\">\n<span class=\"fr\">Noms <strong>masculins</strong> malgré une terminaison typiquement féminine :</span>\n<span class=\"en\">Common <strong>masculine</strong> nouns despite a typically-feminine ending — worth learning as fixed lists:</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Ending</th><th>Masculine exceptions</th></tr>\n<tr><td class=\"fr\">-é / -ée</td><td class=\"fr\">le café, le musée, le lycée, le trophée, le scarabée, le comité, le côté, l'été, le pâté</td></tr>\n<tr><td class=\"fr\">-ie</td><td class=\"fr\">le génie, l'incendie, le parapluie, le foie</td></tr>\n<tr><td class=\"fr\">-son</td><td class=\"fr\">le poisson, le bison, le frisson</td></tr>\n<tr><td class=\"fr\">-ence / -ance</td><td class=\"fr\">le silence</td></tr>\n<tr><td class=\"fr\">-ette</td><td class=\"fr\">le squelette</td></tr>\n<tr><td class=\"fr\">-ure</td><td class=\"fr\">le mercure, l'augure</td></tr>\n</table>\n<div class=\"rule\">\n<span class=\"fr\">Noms <strong>féminins</strong> malgré une terminaison typiquement masculine :</span>\n<span class=\"en\">Common <strong>feminine</strong> nouns despite a typically-masculine ending:</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Ending</th><th>Feminine exceptions</th></tr>\n<tr><td class=\"fr\">-in</td><td class=\"fr\">la main, la fin, la faim</td></tr>\n<tr><td class=\"fr\">-ment</td><td class=\"fr\">la jument</td></tr>\n<tr><td class=\"fr\">-oir</td><td class=\"fr\">la mémoire (also spelled with -oire)</td></tr>\n<tr><td class=\"fr\">-age</td><td class=\"fr\">la plage, la cage, la page, la nage, l'image, la rage</td></tr>\n<tr><td class=\"fr\">-eau</td><td class=\"fr\">l'eau, la peau</td></tr>\n<tr><td class=\"fr\">-al</td><td class=\"fr\">(none common — -al is almost always masculine)</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Le café est fermé, mais le musée reste ouvert.</span><span class=\"en\">The café is closed, but the museum stays open — both masculine despite ending in -é/-ée.</span></div>\n<div class=\"ex\"><span class=\"fr\">Elle lui a tenu la main jusqu'à la fin.</span><span class=\"en\">She held his hand until the end — main and fin are feminine, despite -in normally signaling masculine.</span></div>\n<div class=\"ex\"><span class=\"fr\">Le silence régnait après l'incendie.</span><span class=\"en\">Silence reigned after the fire — silence (-ence) and incendie (-ie) are both masculine, against the usual pattern.</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"genre-noms\">→ Noun gender (basic ending clues)</a>\n<a class=\"xref\" data-target=\"genre-professions\">→ Gender of profession nouns</a>\n</div>"}, {"id": "b2c2-prepositions-lieu-nuances", "level": "C2", "frTitle": "Prépositions de lieu : les nuances", "enSub": "dans/sur vs à/chez, contact ou non (devant/dessus...), entre/parmi", "desc": "Beyond the basic à/en/dans list: general vs particular location, contact vs no-contact, and the entre/parmi distinction.", "body": "<div class=\"rule\">\n<span class=\"fr\">Dans / sur situent dans un espace précis et concret ; à / chez situent de façon plus générale (un lieu, une activité, une personne).</span>\n<span class=\"en\">Dans and sur locate something inside or on a concrete, bounded space; à and chez locate more generally — a type of place, an activity, or a person's home/practice, without describing the physical container.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il travaille dans une banque. / Il travaille à la banque du coin.</span><span class=\"en\">He works in a bank (a workplace, general) / at the bank down the street (a specific, named place).</span></div>\n<div class=\"ex\"><span class=\"fr\">Le chat dort sur le canapé. / Elle es
