h>Meaning</th><th>Example</th></tr>\n<tr><td>Adjective</td><td>all / every, agrees with the noun</td><td class=\"fr\">Tous les colis sont arrivés.</td></tr>\n<tr><td>Noun</td><td>the whole (rare, plural touts)</td><td class=\"fr\">J'achète le tout.</td></tr>\n<tr><td>Pronoun</td><td>everything / all of them, agrees</td><td class=\"fr\">Elles sont toutes arrivées.</td></tr>\n<tr><td>Adverb</td><td>entirely / very, mostly invariable</td><td class=\"fr\">Ils sont tout tristes.</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">Ils sont tout tristes ≠ Ils sont tous tristes.</span>\n<span class=\"en\">Watch out: as an adverb tout stays invariable before a masculine adjective (\"very sad\") — as a pronoun tous agrees (\"all of them are sad\"). Same spelling trap, opposite meaning.</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Devant un adjectif féminin commençant par une consonne, l'adverbe tout s'accorde ; devant une voyelle ou un h muet, l'accord est facultatif.</span>\n<span class=\"en\">As an adverb, tout agrees before a feminine adjective starting with a consonant (elles sont toutes sales) but agreement is optional before a vowel/mute h.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Tout Rome brûlait.</span><span class=\"en\">All of Rome was burning — before a city name, tout does not agree.</span></div>\n<div class=\"ex\"><span class=\"fr\">à toute allure, en toutes lettres, de tout cœur</span><span class=\"en\">Many set expressions are frozen in the singular or plural only — worth learning as chunks rather than deriving from a rule.</span></div>\n</div></details>"}, {"id": "c1-si-whether-if", "level": "C1", "frTitle": "Si : question indirecte ou hypothèse ?", "enSub": "Si = \"whether\" or \"if\"? (Fiche 3)", "desc": "Test: if si can be translated by BOTH \"if\" and \"whether\", it's an indirect question. If only \"if\" works, it's a hypothesis (conditional clause).", "body": "<div class=\"rule\">\n<span class=\"fr\">Si introduit soit une question indirecte (= whether/if), soit une hypothèse (= if seulement).</span>\n<span class=\"en\">Test: if si can be translated by BOTH \"if\" and \"whether\", it's an indirect question. If only \"if\" works, it's a hypothesis (conditional clause).</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Je me demande si elle accepte cette offre.</span><span class=\"en\">I wonder if/whether she accepts this offer — indirect question, any tense can follow.</span></div>\n<div class=\"ex\"><span class=\"fr\">Si elle accepte, je serai très contente.</span><span class=\"en\">If she accepts, I'll be delighted — hypothesis; \"whether\" is impossible here.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Dans une hypothèse, si n'est jamais suivi du futur ou du conditionnel : la séquence des temps est fixe.</span>\n<span class=\"en\">In a conditional clause (not an indirect question), si is never followed by a future or conditional verb — the tense pairing is strict.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Si + …</th><th>… + main clause</th></tr>\n<tr><td class=\"fr\">présent</td><td class=\"fr\">présent / futur / futur proche / impératif</td></tr>\n<tr><td class=\"fr\">imparfait</td><td class=\"fr\">conditionnel présent</td></tr>\n<tr><td class=\"fr\">plus-que-parfait</td><td class=\"fr\">conditionnel passé</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Si elle venait, je resterais.</span><span class=\"en\">If she came, I would stay.</span></div>\n<div class=\"ex\"><span class=\"fr\">Si elle était venue, je serais restée.</span><span class=\"en\">Had she come, I would have stayed.</span></div>\n</div></details>\n<div class=\"xref-box\"><span class=\"xref-label\">See also:</span><a class=\"xref\" data-target=\"c1-si-cinq-valeurs\">→ Les cinq valeurs de si (textbook)</a></div>"}, {"id": "c1-accord-sujet-verbe", "level": "C1", "frTitle": "Accord sujet-verbe : cas particuliers", "enSub": "Subject-verb agreement, the tricky cases (Fiche 4)", "desc": "Unlike English (always singular here), French allows singular or plural depending on emphasis: exclusion, opposition, or togetherness.", "body": "<div class=\"rule\">\n<span class=\"fr\">Avec ni... ni, soit... soit, ou entre deux sujets au singulier, le verbe peut être au singulier ou au pluriel selon le sens visé (exclusion, opposition ou ensemble).</span>\n<span class=\"en\">Unlike English (always singular here), French allows singular or plural depending on emphasis: exclusion, opposition, or togetherness.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Ni le président ni le Premier ministre ne sera/seront là.</span><span class=\"en\">Neither the President nor the PM will attend — either works.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ni ses parents ni sa sœur n'étaient présents.</span><span class=\"en\">If one subject is plural, the verb must be plural.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Avec un nom collectif (équipe, foule, groupe...), le verbe reste généralement au singulier en français.</span>\n<span class=\"en\">Collective nouns take a singular verb in French even where English allows the plural (the team have/has arrived).</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">L'équipe est arrivée.</span><span class=\"en\">The team has/have arrived.</span></div>\n<div class=\"ex\"><span class=\"fr\">Tout le monde est venu à mon anniversaire.</span><span class=\"en\">Everyone came to my party — tout le monde is always singular.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">C'est moi qui ai fait cela. (pas \"qui a fait\")</span>\n<span class=\"en\">With qui as subject, the verb agrees with the antecedent before qui, not with qui itself — easy to get wrong when the antecedent isn't il/elle.</span>\n</div>"}, {"id": "c1-ca-cest-il-est", "level": "C1", "frTitle": "Ça, c'est ou il/elle est ?", "enSub": "Neutral ça/c'est vs personal il/elle est (Fiche 5)", "desc": "Ça ≠ il: Il marche (he's walking) vs Ça marche (it's working / that's fine).", "body": "<div class=\"rule\">\n<span class=\"fr\">Ça est un pronom neutre ; il/elle est un pronom personnel. Les deux se traduisent par \"it\" ou \"he/she\" en anglais, ce qui prête à confusion.</span>\n<span class=\"en\">Ça ≠ il: <em>Il marche</em> (he's walking) vs <em>Ça marche</em> (it's working / that's fine).</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Structure</th><th>Use</th><th>Example</th></tr>\n<tr><td class=\"fr\">C'est + nom (article)</td><td>identification</td><td class=\"fr\">C'est ma tante.</td></tr>\n<tr><td class=\"fr\">Il/elle est + adjectif</td><td>description</td><td class=\"fr\">Elle est grande.</td></tr>\n<tr><td class=\"fr\">Il/elle est + métier/religion (sans article)</td><td>catégorie/appartenance</td><td class=\"fr\">Elle est professeure.</td></tr>\n<tr><td class=\"fr\">C'est + adjectif</td><td>commentaire général</td><td class=\"fr\">C'est intéressant.</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">Elle est professeure. ≠ C'est une professeure très compétente.</span>\n<span class=\"en\">Watch out: no article after il/elle est + profession, but c'est + article lets you add a personal, qualified comment (a very good teacher).</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Il est / C'est + adjectif + de + infinitif : les deux sont possibles, il est étant plus formel.</span>\n<span class=\"en\">Il est normal de pleurer. = C'est normal de pleurer — c'est is informal but very common in speech; il est is the formal/written register.</span>\n</div>"}, {"id": "c1-ce-demonstratif", "level": "C1", "frTitle": "Ce : pronom démonstratif neutre", "enSub": "Ce as neutral demonstrative pronoun (Fiche 6)", "desc": "Ce covers \"it/this/that/these/those\" depending on context, always referring to an idea rather than a specific named thing.", "body": "<div class=\"rule\">\n<span class=\"fr\">Ce, comme pronom neutre, remplace une idée abstraite ou toute une phrase — pas un nom précis.</span>\n<span class=\"en\">Ce covers \"it/this/that/these/those\" depending on context, always referring to an idea rather than a specific named thing.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Elle a réussi son examen, et ce sans réviser.</span><span class=\"en\">She passed her exam, and this without revising — ce sums up the previous clause (formal register).</span></div>\n<div class=\"ex\"><span class=\"fr\">Ce qui se vend bien en ligne, ce sont les livres.</span><span class=\"en\">What sells well online is books — ce qui/que + c'est/ce sont is used for emphasis.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">C'est + nom singulier ; ce sont + nom pluriel — sauf avec nous/vous, où l'on garde c'est.</span>\n<span class=\"en\">C'est des enfants is common in speech, but ce sont des enfants is the written norm. With nous/vous, c'est is always used (c'est nous, c'est vous) but ce sont eux/elles.</span>\n</div>\n<div class=\"note\">\n<span class=\"fr\">pour ce faire, ce faisant, c'en est fait, si ce n'est</span>\n<span class=\"en\">A handful of fixed, fairly formal expressions built on ce are worth recognizing in reading even if you don't produce them yourself.</span>\n</div>"}, {"id": "c1-que-quoi", "level": "C1", "frTitle": "Que, qu'est-ce que ou quoi ?", "enSub": "Three ways to ask \"what?\" (Fiche 7)", "desc": "English has one word (\"what\"); French picks the form based on grammatical function and formality.", "body": "<div class=\"rule\">\n<span class=\"fr\">\"Quoi\" en français prend trois formes selon sa fonction et le registre : qu'est-ce qui (sujet), que/qu'est-ce que/quoi (objet).</span>\n<span class=\"en\">English has one word (\"what\"); French picks the form based on grammatical function and formality.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Function</th><th>Form</th><th>Register</th></tr>\n<tr><td>Subject</td><td class=\"fr\">qu'est-ce qui</td><td>only option</td></tr>\n<tr><td>Object, sentence-initial</td><td class=\"fr\">que + inversion / qu'est-ce que</td><td>formal / standard</td></tr>\n<tr><td>Object, sentence-final</td><td class=\"fr\">quoi</td><td>informal</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Qu'est-ce qui a déclenché cet événement ?</span><span class=\"en\">What triggered this event? — subject, only qu'est-ce qui works.</span></div>\n<div class=\"ex\"><span class=\"fr\">Que fait Julien ? = Qu'est-ce que Julien fait ? = Julien fait quoi ?</span><span class=\"en\">Three registers, same question: formal, standard, informal.</span></div>\n<div class=\"ex\"><span class=\"fr\">À quoi fait-elle référence ? / De quoi as-tu besoin ?</span><span class=\"en\">After a preposition, que always becomes quoi: à quoi, de quoi, avec quoi...</span></div>\n</div></details>"}, {"id": "c1-on-un", "level": "C1", "frTitle": "On/l'on, un/l'un", "enSub": "The euphonic l' before on and un (Fiche 8)", "desc": "L'on and l'un aren't grammatically required — they're added purely for smoother sound, mostly after a word ending in a vowel (que, et, où, si...).", "body": "<div class=\"rule\">\n<span class=\"fr\">Devant on et un en début de proposition, le l' euphonique n'a pas de valeur grammaticale mais adoucit la prononciation.</span>\n<span class=\"en\">L'on and l'un aren't grammatically required — they're added purely for smoother sound, mostly after a word ending in a vowel (que, et, où, si...).</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il faut que l'on parte.</span><span class=\"en\">We need to go — l'on flows better than qu'on here, though both are correct.</span></div>\n<div class=\"ex\"><span class=\"fr\">L'un des plus beaux villages que je connaisse est Gordes.</span><span class=\"en\">One of the most beautiful villages I know is Gordes — l'un is common and agrees (l'une, les uns/unes).</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Il faut qu'on lise ce livre. (pas \"l'on lise\")</span>\n<span class=\"en\">Watch out: skip l' before a word starting with \"l\" — too many l-sounds in a row (qu'on lise, not qu'on l'on lise).</span>\n</div>"}, {"id": "c1-imparfait-pc", "level": "C1", "frTitle": "Imparfait ou passé composé ?", "enSub": "Choosing between imparfait and passé composé (Fiche 9)", "desc": "English often translates both the same way, so the choice is about the speaker's angle, not the English tense used.", "body": "<div class=\"rule\">\n<span class=\"fr\">Le passé composé présente une action achevée et bornée dans le temps ; l'imparfait décrit une situation sans en préciser le début ni la fin.</span>\n<span class=\"en\">English often translates both the same way, so the choice is about the speaker's angle, not the English tense used.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Ce week-end, il a fait chaud.</span><span class=\"en\">It was hot this weekend — a finished, bounded fact; implicitly it's over.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ce week-end, il faisait chaud, et du coup je suis allé à la mer.</span><span class=\"en\">It was hot, so I went to the seaside — imparfait sets the scene, passé composé is the event on top of it.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Dans un récit, l'imparfait est le décor (arrière-plan), le passé composé fait avancer l'action.</span>\n<span class=\"en\">Think theatre: imparfait = the set and backdrop, passé composé = what the actors actually do.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il pleuvait quand nous sommes rentrés.</span><span class=\"en\">It was raining (background) when we got back (event).</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Il a toujours habité dans la même maison (et il y habite encore). / Jusqu'à maintenant, il habitait là, mais il a déménagé.</span>\n<span class=\"en\">Toujours/jamais/jusqu'à maintenant + passé composé = the situation continues today; the same words + imparfait = it has since ended.</span>\n</div>"}, {"id": "c1-pc-ps", "level": "C1", "frTitle": "Passé composé ou passé simple ?", "enSub": "Passé simple vs passé composé (Fiche 10)", "desc": "In a narrative, passé simple and passé composé are interchangeable — the choice is register, not meaning: passé simple is written/formal, mostly 3rd person.", "body": "<div class=\"rule\">\n<span class=\"fr\">Le passé simple et le passé composé expriment tous deux une action achevée ; le passé simple appartient surtout à l'écrit littéraire, journalistique ou historique.</span>\n<span class=\"en\">In a narrative, passé simple and passé composé are interchangeable — the choice is register, not meaning: passé simple is written/formal, mostly 3rd person.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Nous étions presque au sommet quand la foudre frappa. = ... quand la foudre a frappé.</span><span class=\"en\">We were nearly at the summit when the lightning struck — imparfait sets the scene either way.</span></div>\n<div class=\"ex\"><span class=\"fr\">Je vins, je vis, je conquis.</span><span class=\"en\">I came, I saw, I conquered — a string of passé simple verbs gives rhythm and punch that passé composé can't match.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Il partit sans se retourner. Je ne l'ai jamais oublié.</span>\n<span class=\"en\">Watch out: passé simple has no link to the present moment; passé composé can. Here \"leaving\" is closed (passé simple) but \"never forgetting\" still holds true now (passé composé) — the two combine in the same passage.</span>\n</div>"}, {"id": "c1-concordance-1", "level": "C1", "frTitle": "Concordance des temps (1) — verbe principal au présent ou au futur", "enSub": "Sequence of tenses when the main verb is present/future (Fiche 11)", "desc": "The tense of the second verb depends purely on the timing of its action relative to the main verb — not on some fixed rule of thumb.", "body": "<div class=\"rule\">\n<span class=\"fr\">Quand le verbe principal est au présent ou au futur, le second verbe se met au présent (simultanéité), à un temps du passé (antériorité) ou au futur/subjonctif (postériorité).</span>\n<span class=\"en\">The tense of the second verb depends purely on the timing of its action relative to the main verb — not on some fixed rule of thumb.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Relation</th><th>Tense of 2nd verb</th><th>Example</th></tr>\n<tr><td>Same time</td><td>présent (indicatif/subjonctif)</td><td class=\"fr\">Je sais qu'il est parti… non — qu'il part.</td></tr>\n<tr><td>Before</td><td>passé composé / imparfait / plus-que-parfait / futur antérieur</td><td class=\"fr\">Je pense qu'il est parti ce matin.</td></tr>\n<tr><td>After</td><td>futur / subjonctif présent</td><td class=\"fr\">J'espère que vous irez bientôt mieux.</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Tu iras jouer quand tu auras fini tes devoirs.</span><span class=\"en\">You'll play once you've finished your homework — futur antérieur for a future action completed before another future action.</span></div>\n</div></details>"}, {"id": "c1-concordance-2", "level": "C1", "frTitle": "Concordance des temps (2) — verbe principal au passé ou au conditionnel", "enSub": "Sequence of tenses when the main verb is past/conditional (Fiche 12)", "desc": "French is stricter than English here: an action further back in the past than the main past verb needs the plus-que-parfait, even when English just uses the simple past.", "body": "<div class=\"rule\">\n<span class=\"fr\">Quand le verbe principal est au passé, le français exige souvent le plus-que-parfait là où l'anglais garde le prétérit ou le present perfect.</span>\n<span class=\"en\">French is stricter than English here: an action further back in the past than the main past verb needs the plus-que-parfait, even when English just uses the simple past.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">La police a demandé à quelle heure ils étaient partis.</span><span class=\"en\">The Police asked what time they left/had left — French needs plus-que-parfait.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ils ont dit qu'ils viendraient demain.</span><span class=\"en\">They said they would come tomorrow — conditionnel présent for \"after the main action\".</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Après un verbe principal au conditionnel, le second verbe (souvent au subjonctif) ne change pas selon le moment.</span>\n<span class=\"en\">After a conditional main verb, the dependent verb — often subjunctive — stays present or past subjunctive regardless of relative timing.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">J'aurais voulu qu'elle soit là.</span><span class=\"en\">I would have liked her to be there.</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref back-style\" data-target=\"c1-concordance-1\">← Sequence of tenses (1) — present/future</a>\n</div>"}, {"id": "c1-place-adverbes", "level": "C1", "frTitle": "La place des adverbes", "enSub": "Where French adverbs go (Fiche 13)", "desc": "Unlike English, French almost never puts a frequency/manner adverb between subject and verb — it sits after the (auxiliary) verb instead.", "body": "<div class=\"rule\">\n<span class=\"fr\">Avec un verbe simple, l'adverbe se place après le verbe ; avec un temps composé, il se glisse entre l'auxiliaire et le participe passé.</span>\n<span class=\"en\">Unlike English, French almost never puts a frequency/manner adverb between subject and verb — it sits after the (auxiliary) verb instead.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il chante souvent. (pas \"Il souvent chante\")</span><span class=\"en\">He often sings — adverb after the verb, not before.</span></div>\n<div class=\"ex\"><span class=\"fr\">Je suis bien arrivé. / On devrait toujours refuser.</span><span class=\"en\">With compound tenses, the adverb goes between the auxiliary and the past participle.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Elle a habité ici. (pas \"Elle a ici habité\")</span>\n<span class=\"en\">Watch out: place adverbs (ici, là, partout...) go after the past participle, not between it and the auxiliary.</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">La place de l'adverbe peut changer le sens de la phrase.</span>\n<span class=\"en\">Position isn't just style — it can flip the meaning.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Elle ne travaille toujours pas. ≠ Elle ne travaille pas toujours.</span><span class=\"en\">She still doesn't work ≠ She doesn't always work.</span></div>\n</div></details>"}, {"id": "c1-discours-rapporte-1", "level": "C1", "frTitle": "Le discours rapporté (1/2) — pronoms et verbes introducteurs", "enSub": "Reported speech: pronoun changes and reporting verbs (Fiche 14)", "desc": "Direct speech turns into a que-clause: pronouns shift, and question/exclamation marks and quotation marks are dropped.", "body": "<div class=\"rule\">\n<span class=\"fr\">Au discours rapporté, les pronoms personnels et possessifs changent pour refléter le point de vue du rapporteur ; la ponctuation du discours direct (guillemets, ?, !) disparaît.</span>\n<span class=\"en\">Direct speech turns into a que-clause: pronouns shift, and question/exclamation marks and quotation marks are dropped.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Elle dit : « J'aime le chocolat ! » → Elle dit qu'elle aime le chocolat.</span><span class=\"en\">She says: \"I love chocolate!\" → She says (that) she loves chocolate.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Dans une question rapportée, on garde le mot interrogatif mais on retrouve l'ordre sujet-verbe (plus d'inversion).</span>\n<span class=\"en\">Reported questions keep quand/où/pourquoi/comment but lose the subject-verb inversion of the direct question.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Direct</th><th>Reported</th></tr>\n<tr><td class=\"fr\">Qu'est-ce que / Que… ?</td><td class=\"fr\">ce que</td></tr>\n<tr><td class=\"fr\">Qui est-ce qui / Qui est-ce que… ?</td><td class=\"fr\">qui</td></tr>\n<tr><td class=\"fr\">Est-ce que… ?</td><td class=\"fr\">si</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il me demande : « Quand pars-tu ? » → Il me demande quand je pars.</span><span class=\"en\">He asks me: \"When are you leaving?\" → He asks me when I'm leaving.</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"c1-discours-rapporte-2\">→ Reported speech (2/2) — tense and time-adverb changes</a>\n</div>"}, {"id": "c1-discours-rapporte-2", "level": "C1", "frTitle": "Le discours rapporté (2/2) — temps et adverbes de temps", "enSub": "Reported speech: tense and time-adverb changes (Fiche 15)", "desc": "A past-tense reporting verb pushes the reported verb one step further into the past — this is the classic \"backshift\", same logic as in English.", "body": "<div class=\"rule\">\n<span class=\"fr\">Si le verbe introducteur est au passé, le verbe rapporté recule d'un cran dans le temps (présent → imparfait, passé composé → plus-que-parfait, futur → conditionnel).</span>\n<span class=\"en\">A past-tense reporting verb pushes the reported verb one step further into the past — this is the classic \"backshift\", same logic as in English.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Direct speech</th><th>Reported (past introducer)</th></tr>\n<tr><td class=\"fr\">présent</td><td class=\"fr\">imparfait</td></tr>\n<tr><td class=\"fr\">passé composé</td><td class=\"fr\">plus-que-parfait</td></tr>\n<tr><td class=\"fr\">futur simple</td><td class=\"fr\">conditionnel présent</td></tr>\n<tr><td class=\"fr\">impératif</td><td class=\"fr\">infinitif</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Le ministre a déclaré que le prix de l'essence augmentait au 1er janvier.</span><span class=\"en\">The minister declared that gas prices would go up on January 1st.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il nous crie : « Sortez ! » → Il nous crie de sortir.</span><span class=\"en\">He shouts at us: \"Get out!\" → He shouts at us to get out — imperative becomes infinitive, no tense-of-introducer exception here.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Les adverbes de temps changent aussi au discours rapporté (aujourd'hui → ce jour-là, hier → la veille, demain → le lendemain).</span>\n<span class=\"en\">Time adverbs shift the same way they do in English reported speech, just with different words.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">« Tu pars demain ? » → Elle a demandé si tu partais le lendemain.</span><span class=\"en\">\"Are you leaving tomorrow?\" → She asked if you were leaving the next day.</span></div>\n</div></details>"}, {"id": "c1-de-des", "level": "C1", "frTitle": "De ou des ?", "enSub": "Article or preposition (1/2): de vs des (Fiche 16)", "desc": "Three triggers turn des into de/d': an adjective placed before the noun, a negation, or a quantity expression.", "body": "<div class=\"rule\">\n<span class=\"fr\">Des devient de (d') devant un adjectif antéposé, à la forme négative, et après une expression de quantité.</span>\n<span class=\"en\">Three triggers turn des into de/d': an adjective placed before the noun, a negation, or a quantity expression.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Vous avez de beaux enfants.</span><span class=\"en\">You have beautiful children — adjective before the noun.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ils n'ont pas de réponses à nous donner.</span><span class=\"en\">They have no answers to give — negation.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il y a beaucoup de voitures. / Un kilo d'amandes.</span><span class=\"en\">Quantity expressions (beaucoup de, un kilo de, assez de...) always take de.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Nous ne voulons pas des mots mais des actions.</span>\n<span class=\"en\">Watch out: when a negative is opposed to a positive alternative, des stays des.</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Quand le nom est précisé/spécifique, on garde des (= de + les).</span>\n<span class=\"en\">If the noun is specific rather than a vague quantity, the definite article contraction des is kept — as after la plupart de, la majorité de, or a percentage.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">La plupart des étudiants travaillent bien.</span><span class=\"en\">Most students are doing well.</span></div>\n</div></details>"}, {"id": "c1-du-de-la-de", "level": "C1", "frTitle": "Du, de la ou de ?", "enSub": "Article or preposition (2/2): du/de la vs de (Fiche 17)", "desc": "Generic link (a category/function) → bare de. Specific, identified entity → definite article kept.", "body": "<div class=\"rule\">\n<span class=\"fr\">De seul relie deux noms quand le second exprime une catégorie générale, une fonction ; du/de la/de l' s'utilisent pour une entité précise et unique.</span>\n<span class=\"en\">Generic link (a category/function) → bare de. Specific, identified entity → definite article kept.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">une directrice de projet</span><span class=\"en\">a project director — generic role, bare de.</span></div>\n<div class=\"ex\"><span class=\"fr\">la directrice du projet auquel j'ai participé</span><span class=\"en\">the director of the project I took part in — one specific project, article kept.</span></div>\n<div class=\"ex\"><span class=\"fr\">le ministre du Travail</span><span class=\"en\">the Minister of Labour — a specific, named ministry.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">un gâteau d'anniversaire ≠ le gâteau de l'anniversaire de Juliette</span>\n<span class=\"en\">Same words, different grammar: generic \"birthday cake\" vs one particular birthday's cake.</span>\n</div>"}, {"id": "c1-count-noncount", "level": "C1", "frTitle": "Noms comptables et non comptables", "enSub": "Count nouns vs non-count nouns (Fiche 18)", "desc": "Identifying count vs non-count nouns matters more in French than English, since it decides the article (du/de la/des) and singular/plural.", "body": "<div class=\"rule\">\n<span class=\"fr\">Les noms non comptables (du sable, de la patience) prennent l'article partitif ; certains noms comptables en français sont non comptables en anglais, et inversement.</span>\n<span class=\"en\">Identifying count vs non-count nouns matters more in French than English, since it decides the article (du/de la/des) and singular/plural.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Le soir, je bois du vin et j'écoute de la musique.</span><span class=\"en\">In the evening I drink wine and listen to music — partitive article for non-count nouns.</span></div>\n</div></details>\n<table class=\"gtable\">\n<tr><th>Countable in French</th><th>English (non-count)</th></tr>\n<tr><td class=\"fr\">des conseils</td><td>advice</td></tr>\n<tr><td class=\"fr\">des meubles</td><td>furniture</td></tr>\n<tr><td class=\"fr\">des bagages</td><td>luggage</td></tr>\n<tr><td class=\"fr\">des données</td><td>data</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">Les gens sont sympas. / Il y avait trois personnes à la réunion.</span>\n<span class=\"en\">Watch out: gens (people in general) is always plural and non-count; personne(s) is a true countable noun — switch to personnes as soon as you're being specific about a number.</span>\n</div>"}, {"id": "c1-voix-passive", "level": "C1", "frTitle": "Choisir la voix active ou passive", "enSub": "Active vs passive voice, and passive-flavoured verbs (Édito C1, Thème 1)", "desc": "Only transitive verbs (with a direct object) can go passive. The passive voice lets you foreground the process or the result instead of who did it.", "body": "<div class=\"rule\">\n<span class=\"fr\">Seuls les verbes ayant un COD peuvent se mettre au passif. Formation : être (au temps du verbe actif) + participe passé.</span>\n<span class=\"en\">Only transitive verbs (with a direct object) can go passive. The passive voice lets you foreground the process or the result instead of who did it.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Les processus de justice restaurative sont animés par des personnes spécialement formées.</span><span class=\"en\">Restorative-justice processes are run by specially trained people — passive shifts focus onto the process, not the people running it.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Le complément d'agent est en général introduit par \"par\", mais par \"de\" avec les verbes de sentiment (admirer, aimer, détester, estimer...) et certains verbes comme connaître, oublier, ignorer.</span>\n<span class=\"en\">Most agent complements use par (\"by\"), but a specific set of feeling/state verbs use de instead — a common near-miss for learners.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il est aimé de tous. / Il est détesté de ses voisins.</span><span class=\"en\">He is loved by everyone. / He is hated by his neighbours — de, not par, after verbs of feeling.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Au passif, il n'y a pas de complément d'agent quand le sujet actif était \"on\", quand il est sous-entendu, ou quand on ne veut/peut pas le nommer.</span>\n<span class=\"en\">Three reasons a passive sentence can drop the \"by ...\" agent entirely: the active subject was the impersonal on, it's understood from context, or the speaker chooses not to name it.</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Certains verbes pronominaux (se dérouler, se vendre, se boire, s'apprendre, se lire...) sont à la forme active mais ont un sens passif ; à l'inverse, certains verbes non pronominaux (subir, endurer, souffrir, être la cible de...) sont actifs en forme mais passifs en sens.</span>\n<span class=\"en\">Two more disguises for the passive: some pronominal verbs read as active but mean passive (this wine drinks well = is drunk), and some ordinary verbs mean \"have X done to you\" without any passive marking at all.</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Se faire, se laisser, se voir, s'entendre, se sentir + infinitif = sens passif. Aux temps composés, le participe passé s'accorde avec le COD placé avant s'il fait l'action de l'infinitif ; se faire et se laisser restent invariables.</span>\n<span class=\"en\">The pronominal-passive family from Fiche 1 gets one more nuance here: se faire and se laisser never agree, even when the other rule would call for it — a fixed exception worth memorizing as such.</span>\n</div>\n<div class=\"note\">\n<span class=\"fr\">Durant les médiations restauratives, il est recouru au bâton de parole.</span>\n<span class=\"en\">The impersonal passive (il est + past participle) is mostly found in administrative and legal writing — recognize it in formal texts more than you'll need to produce it.</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"c1-pronominal-passif\">→ Les verbes pronominaux à sens passif (fiche anglophones)</a>\n</div>"}, {"id": "c1-connecteurs-logiques", "level": "C1", "frTitle": "Les connecteurs logiques", "enSub": "Linking words for cause, consequence, purpose, opposition, concession (Édito C1, Thème 2)", "desc": "Choosing the right connector means choosing the right logical relationship first — the mode that follows isn't free, it's locked to the connector.", "body": "<div class=\"rule\">\n<span class=\"fr\">Chaque relation logique (cause, conséquence, but, opposition, concession) a sa propre famille de connecteurs et son propre mode (indicatif, subjonctif ou infinitif).</span>\n<span class=\"en\">Choosing the right connector means choosing the right logical relationship first — the mode that follows isn't free, it's locked to the connector.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Relation</th><th>Connectors</th><th>Mode</th></tr>\n<tr><td>Cause</td><td class=\"fr\">comme, puisque, étant donné que, vu que, sous prétexte que, d'autant que, grâce à, à force de, faute de</td><td>indicatif (+ subj. after non pas que, soit que...soit que)</td></tr>\n<tr><td>Conséquence</td><td class=\"fr\">si bien que, de sorte que, de manière que, tellement/tant que, par conséquent, au point que, assez/trop... pour que</td><td>indicatif (pour que + subj.)</td></tr>\n<tr><td>But</td><td class=\"fr\">pour que, afin que, pour, afin de, de manière à, de peur que, dans l'espoir que</td><td>subjonctif / infinitif</td></tr>\n<tr><td>Opposition</td><td class=\"fr\">alors que, cependant, tandis que, au contraire, pourtant, en revanche, contrairement à, à l'inverse, or</td><td>indicatif</td></tr>\n<tr><td>Concession</td><td class=\"fr\">toutefois, néanmoins, même si, certes, malgré, bien que, quoique, avoir beau, quitte à</td><td>subjonctif after bien que / quoique</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">de sorte que, de manière que, de façon que + indicatif = conséquence ; de sorte de, de manière à, de façon à + infinitif ou de façon à ce que + subjonctif = insistent sur la manière d'agir pour atteindre un but.</span>\n<span class=\"en\">Watch out: the same root words (sorte, manière, façon) express either consequence or purpose depending on what follows — que + indicative is a result already achieved, à + infinitive is a goal being pursued.</span>\n</div>"}, {"id": "c1-si-cinq-valeurs", "level": "C1", "frTitle": "Les cinq valeurs de si", "enSub": "Si: condition, concession, cleft emphasis, comparison, or intensity — five different jobs, one word (Édito C1, Thème 4)", "desc": "This goes well beyond the whether/if distinction (Fiche 3) — in narrative and essay French, si has five distinct jobs, each with its own structure.", "body": "<div class=\"rule\">\n<span class=\"fr\">Si est un mot polysémique : selon le contexte, il exprime la condition, la concession, la mise en relief, la comparaison ou la conséquence (intensité). Attention aux contresens !</span>\n<span class=\"en\">This goes well beyond the whether/if distinction (Fiche 3) — in narrative and essay French, si has five distinct jobs, each with its own structure.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Value</th><th>Structure</th><th>≈ Meaning</th></tr>\n<tr><td>Condition / hypothèse</td><td class=\"fr\">si + indicatif, …</td><td>à condition que / dans l'hypothèse où</td></tr>\n<tr><td>Concession</td><td class=\"fr\">si + adj. + subj. (sujet inversé) / si + adj. + que + subj.</td><td>certes… mais / il est vrai que… mais</td></tr>\n<tr><td>Mise en relief</td><td class=\"fr\">si + proposition, c'est…</td><td>highlights the cause or purpose</td></tr>\n<tr><td>Comparaison (négative)</td><td class=\"fr\">ne pas si + adj. + que</td><td>aussi (as ... as)</td></tr>\n<tr><td>Conséquence / intensité</td><td class=\"fr\">si + adj. + que + proposition</td><td>tellement (so ... that)</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Si motivé soit-il, il ne pourra pas réduire son empreinte carbone par trois en un tel délai.</span><span class=\"en\">However motivated he is, he won't be able to cut his carbon footprint threefold in that time — concession, subject-verb inversion after si + adjective.</span></div>\n<div class=\"ex\"><span class=\"fr\">Si cette technologie a pu être mise en place à Tahiti, c'est parce que l'eau froide des profondeurs est rapidement accessible.</span><span class=\"en\">This technology could be set up in Tahiti because deep cold water is quickly accessible there — si...c'est puts the cause in the spotlight.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ce dispositif n'est pas si efficace qu'on le prétend.</span><span class=\"en\">This system isn't as effective as claimed — negative comparison, si...que = aussi...que.</span></div>\n<div class=\"ex\"><span class=\"fr\">Le niveau des nappes phréatiques est si bas que l'on s'attend à des pénuries d'eau.</span><span class=\"en\">Groundwater levels are so low that shortages are expected — intensity/consequence, si...que = tellement...que.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">De nombreuses combinaisons de temps sont possibles, mais si-condition est toujours suivi d'un verbe à l'indicatif.</span>\n<span class=\"en\">Whatever the tense pairing, the si-condition clause itself is always indicative — the future/conditional restriction from Fiche 3 still holds for this first value only.</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"c1-si-whether-if\">→ Si: \"whether\" or \"if\"? (fiche anglophones)</a>\n</div>"}, {"id": "c1-mise-en-relief", "level": "C1", "frTitle": "La mise en relief", "enSub": "Cleft sentences: pulling one element of a sentence into the spotlight (Édito C1, Thème 5)", "desc": "French has several ways to spotlight one piece of information — more varied than English's single \"it is ... that\" cleft.", "body": "<div class=\"rule\">\n<span class=\"fr\">La mise en relief déplace ou encadre un élément de la phrase pour le souligner : en tête de phrase, repris par un pronom, ou encadré par c'est/ce sont... qui/que/dont/où.</span>\n<span class=\"en\">French has several ways to spotlight one piece of information — more varied than English's single \"it is ... that\" cleft.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Structure</th><th>Example</th></tr>\n<tr><td>Déplacement en tête de phrase</td><td class=\"fr\">Au sein des musées, la question du public est cruciale.</td></tr>\n<tr><td>Tête de phrase + reprise par pronom</td><td class=\"fr\">Cette proposition, elle pousse le curseur assez loin.</td></tr>\n<tr><td>C'est/ce sont + … + qui/que/dont/où</td><td class=\"fr\">Ce sont des gens qui viennent pour la première fois au musée.</td></tr>\n<tr><td>Ce qui/que/dont/à quoi... c'est</td><td class=\"fr\">Ce qui me frappe, c'est la définition française de la culture.</td></tr>\n<tr><td>C'est + … + que (conjonction)</td><td class=\"fr\">C'est grâce au pass Culture que j'ai pu aller à ce concert.</td></tr>\n<tr><td>Si… c'est</td><td class=\"fr\">Si le musée n'a pas de primo-visiteurs, c'est faute d'innovation.</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">C'est l'une des réussites du pass Culture que d'avoir fait entrer certains jeunes dans les librairies.</span><span class=\"en\">One of the pass Culture's successes is having gotten young people into bookshops — c'est ... que frames an infinitive clause as the highlighted element.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Si... c'est s'emploie pour la mise en relief de la cause ou du but.</span>\n<span class=\"en\">Si...c'est (also covered under the five values of si) is really a cleft construction in disguise, dedicated to spotlighting a cause or purpose.</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"c1-ce-demonstratif\">→ Ce: pronom démonstratif neutre</a>\n<a class=\"xref\" data-target=\"c1-si-cinq-valeurs\">→ Les cinq valeurs de si</a>\n</div>"}, {"id": "c1-prefixes-suffixes", "level": "C1", "frTitle": "Maîtriser les préfixes et les suffixes", "enSub": "Reading word-formation for meaning: prefixes and suffixes as a vocabulary-building tool (Édito C1, Thème 6)", "body": "<div class=\"rule\">\n<span class=\"fr\">Un préfixe se place avant le radical et en modifie le sens (souvent sans changer la nature du mot) ; un suffixe se place après le radical et peut en changer la nature (nom, adjectif, verbe) ainsi que la valeur (diminutif, péjoratif, etc.).</span>\n<span class=\"en\">Recognizing prefixes and suffixes lets you guess the meaning of words you've never seen — useful for reading quickly and for building your own vocabulary (including deliberate néologismes).</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Préfixe</th><th>Valeur</th></tr>\n<tr><td>co-, con-, com-, col-, cor-</td><td>réciprocité, ensemble (coopérer, convivialité, collaborer, correspondre)</td></tr>\n<tr><td>re-, ré-, r-</td><td>à nouveau (refaire, réévaluer, rouvrir)</td></tr>\n<tr><td>ex-</td><td>hors de, ancien (exporter, ex-mari)</td></tr>\n<tr><td>mis-</td><td>mal, négatif (mésentente/misanthrope)</td></tr>\n<tr><td>inter-</td><td>entre (interdépendant, interagir)</td></tr>\n<tr><td>néo-</td><td>nouveau (néologisme, néolibéral)</td></tr>\n<tr><td>mal-</td><td>négation, mauvais (malaimé, malchance)</td></tr>\n<tr><td>il-, im-, in-, ir-</td><td>négation (illisible, impossible, inutile, irréel)</td></tr>\n<tr><td>a-</td><td>privation (apolitique, amoral)</td></tr>\n<tr><td>éco-, cis-</td><td>maison/habitat ; en-deçà de (écosystème, cisalpin)</td></tr>\n</table>\n<div class=\"rule\">\n<span class=\"fr\">Les suffixes peuvent porter une valeur diminutive, péjorative, ou indiquer un domaine (science, idéologie, relation à).</span>\n<span class=\"en\">Suffixes carry their own shades of meaning — some diminish, some belittle, some just classify.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Suffixe</th><th>Valeur</th></tr>\n<tr><td>-ard, -asse, -ace, -âtre</td><td>péjoratif ou diminutif (chauffard, vantard, verdâtre)</td></tr>\n<tr><td>-ique</td><td>relatif à, domaine scientifique (économique, biologique)</td></tr>\n<tr><td>-able, -ible</td><td>possibilité (faisable, lisible)</td></tr>\n<tr><td>-al</td><td>relatif à (national, culturel)</td></tr>\n<tr><td>-iste</td><td>adepte d'une idéologie (capitaliste, écologiste)</td></tr>\n<tr><td>-et, -ette</td><td>diminutif (garçonnet, fillette)</td></tr>\n<tr><td>-isme</td><td>doctrine, mouvement (néologisme, capitalisme)</td></tr>\n<tr><td>-logie</td><td>étude de, science de (biologie, psychologie)</td></tr>\n</table>\n<div class=\"note\">\n<span class=\"fr\">Les néologismes se forment très souvent par préfixation ou suffixation à partir d'un radical existant.</span>\n<span class=\"en\">This is exactly how new words like \"transpartisan\" or \"alterpolitique\" get coined — a familiar prefix or suffix bolted onto a recognizable root.</span>\n</div>", "desc": "Common prefixes (co-, re-, inter-, il-/im-/in-/ir-...) and suffixes (-ique, -able, -iste, -logie...) and what they add to a root word."}, {"id": "c1-participe-gerondif-adjectif-verbal", "level": "C1", "frTitle": "Le participe présent, le gérondif et l'adjectif verbal", "enSub": "Three -ant forms that look alike but work differently: verbal form, adverbial clause, and true adjective (Édito C1, Thème 7)", "body": "<div class=\"rule\">\n<span class=\"fr\">Le participe présent se construit sur le radical de \"nous\" au présent de l'indicatif + -ant. Il exprime surtout une action ou un état, s'emploie souvent à l'écrit à la place d'une relative avec \"qui\", et peut avoir une valeur causale ou exprimer la simultanéité. Il est invariable.</span>\n<span class=\"en\">The participe présent is a verb form standing in for a \"qui\" relative clause: tous les supports permettant (= qui permettent) d'extériorister des émotions. It never agrees.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Tous les supports permettant d'extérioriser des émotions sont des supports ayant une vraie valeur thérapeutique.</span><span class=\"en\">All media that allow emotions to be expressed are media that have real therapeutic value — permettant and ayant both replace \"qui + verb\".</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Le gérondif se construit avec en + participe présent. Il peut exprimer la manière, le temps (simultanéité), la condition ou la cause. Avec \"tout\", il peut exprimer l'opposition.</span>\n<span class=\"en\">The gérondif always attaches to the sentence's own subject and is introduced by en — it answers \"how/when/if\" something is done, and tout + gérondif flips it into a concession (\"while/even though doing X\").</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">En sortant du métro, un match se termine.</span><span class=\"en\">As he's coming out of the metro, a match is ending — simultaneity/manner.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il continue de jouer tout en sachant que ses chances de gagner sont très faibles.</span><span class=\"en\">He keeps playing even though he knows his odds of winning are very low — tout + gérondif = opposition/concession.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">L'adjectif verbal est un participe présent employé comme adjectif : il s'accorde donc avec le nom, le sujet ou le complément auquel il se rapporte, et n'a jamais de complément d'objet. Certains adjectifs verbaux ont une orthographe différente de celle du participe présent correspondant.</span>\n<span class=\"en\">The adjectif verbal is the one of the three that behaves like a normal adjective — it agrees in gender and number, and a fixed list of common ones is spelled differently from their participe présent twin (below). Never has a direct object of its own.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Participe présent</th><th>Adjectif verbal</th></tr>\n<tr><td>adhérant, communiquant, convainquant, convergeant, différant, équivalant, excellant, naviguant, fatiguant, négligeant, précédant, provoquant, suffoquant</td><td>adhérent, communicant, convaincant, convergent, différent, équivalent, excellent, navigant, fatigant, négligent, précédent, provocant, suffocant</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Une offre d'une profession hallucinante.</span><span class=\"en\">A dizzying job offer — hallucinante agrees with \"offre\" like any adjective, with no object of its own.</span></div>\n<div class=\"ex\"><span class=\"fr\">Les arguments contre les jeux d'argent sont rarement convaincants auprès des joueurs pathologiques.</span><span class=\"en\">Arguments against gambling are rarely convincing to pathological gamblers — convaincants (adjectif verbal spelling, with a c) not convainquant.</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"gerondif\">→ Le gérondif (core grammar)</a>\n</div>", "desc": "Participe présent replaces a qui-clause; gérondif (en + -ant) answers how/when; adjectif verbal agrees like any adjective — and a handful are spelled differently from their participe présent twin."}, {"id": "c1-registre-langue", "level": "C1", "frTitle": "Adapter le registre de langue", "enSub": "Reading and producing familier, standard, and soutenu French: what actually changes across registers (Édito C1, Thème 8)", "body": "<div class=\"rule\">\n<span class=\"fr\">Le registre de langue varie selon plusieurs paramètres systématiques : la négation, l'interrogation, la complexité syntaxique, le lexique et la phonétique.</span>\n<span class=\"en\">Register isn't just vocabulary — it's a bundle of consistent choices across grammar, word choice, and pronunciation, and mixing registers within one utterance sounds off.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Élément</th><th>Familier</th><th>Standard</th><th>Soutenu</th></tr>\n<tr><td>Négation</td><td class=\"fr\">t'inquiète pas (no \"ne\")</td><td class=\"fr\">tu ne t'inquiète pas</td><td class=\"fr\">ne t'inquiète pas (ne maintained)</td></tr>\n<tr><td>Ne explétif</td><td>—</td><td>—</td><td class=\"fr\">je craignais que ça ne soit compliqué (optional, no negative meaning, after craindre/avoir peur/à moins que...)</td></tr>\n<tr><td>Interrogation</td><td class=\"fr\">Il apprécie sa nouvelle école ? (no inversion)</td><td class=\"fr\">Est-ce qu'il apprécie... ?</td><td class=\"fr\">Apprécie-t-il... ? (subject-verb inversion, euphonic -t-)</td></tr>\n<tr><td>Complexité syntaxique</td><td>short, juxtaposed clauses</td><td>—</td><td>multiplication of subordinate clauses (conjunctive, relative, circumstantial)</td></tr>\n<tr><td>Lexique</td><td>familiar/slang words, \"hyper\" as intensifier</td><td>—</td><td>precise, elegant word choice</td></tr>\n<tr><td>Phonétique</td><td class=\"fr\">effacement de certaines voyelles: j'sais pas, t'as</td><td>—</td><td>every sound pronounced, optional liaisons respected</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Ah mais t'inquiète pas, te culpabilise pas trop.</span><span class=\"en\">Registre familier: dropped \"ne\", clipped syntax, casual vocabulary.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il faut qu'elles ne soient ni trop mamans ni trop figurantes, qu'elles s'investissent dans une relation dont la durabilité est le plus souvent corrélée à celle de leur relation amoureuse.</span><span class=\"en\">Registre soutenu: full negation, subordinate clauses stacked (qu'elles... dont... à celle de...), elegant vocabulary.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Le niveau de langue doit rester cohérent sur l'ensemble d'un texte ou d'un échange : mélanger un lexique familier et une syntaxe soutenue produit un effet maladroit, sauf effet stylistique volontaire.</span>\n<span class=\"en\">Consistency matters more than any single feature — a soutenu sentence with one slangy word (or vice versa) reads as a mistake, not a deliberate register shift.</span>\n</div>", "desc": "Familier, standard, and soutenu differ systematically in negation, interrogation word order, sentence complexity, vocabulary, and pronunciation — not just in 'politeness'."}, {"id": "c1-reprise-continuite", "level": "C1", "frTitle": "Assurer la continuité du texte avec la reprise", "enSub": "Keeping a text cohesive: pronominal and nominal reprises that avoid clunky repetition (Édito C1, Thème 9)", "body": "<div class=\"rule\">\n<span class=\"fr\">Pour reprendre totalement un groupe nominal, on peut utiliser un pronom (personnel, démonstratif comme celui/celle, ou les pronoms y/en) ou un article défini avec changement de déterminant.</span>\n<span class=\"en\">A full reprise stands in for the whole noun phrase it points back to — the classic case is a pronoun, but a demonstrative like \"celui\" or \"celle\" works too.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Les jeunes gens bien élevés qui vous expédient sans coup férir dans le camp des faibles qu'il faut protéger.</span><span class=\"en\">\"qui\" and \"qu'\" here are relative pronouns fully reprising \"les jeunes gens\" and \"les faibles\".</span></div>\n<div class=\"ex\"><span class=\"fr\">Combien de fantômes de visages superposons-nous sur celui que nous voyons en face de nous ?</span><span class=\"en\">\"celui\" (a demonstrative pronoun) reprises \"un visage parmi tous les fantômes de visages\" — a partial reprise, standing for one out of the whole set just mentioned.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Pour reprendre partiellement un groupe nominal, on peut utiliser un pronom indéfini (certains, quelques-uns, la plupart, d'autres/l'autre...) ou un pronom possessif (le mien, la mienne...).</span>\n<span class=\"en\">A partial reprise picks out only some of what was just mentioned — useful when you want to single out a subset without renaming it.</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Pour reprendre une phrase ou un fragment du texte, on peut utiliser un pronom démonstratif neutre (ce, ça, ceci, cela) ou un pronom de 3e personne.</span>\n<span class=\"en\">When what you're pointing back to is a whole clause or idea rather than a single noun, the neutral demonstratives (ce, ça, cela) are the natural tool.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Ce jeune m'a laissé sa place, ce qui a détruit pour la journée mon humeur primesautière.</span><span class=\"en\">\"ce qui\" reprises the entire preceding clause (\"ce jeune m'a laissé sa place\"), not just a noun.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">La reprise nominale peut se faire en répétant le même nom avec un changement de déterminant, ou en changeant de terme (synonyme, métaphore, hyperonyme), ou par un nom générique / une nominalisation pour reprendre une phrase entière.</span>\n<span class=\"en\">Reprise doesn't have to be pronominal — swapping in a synonym, a broader category word (hyperonym), or even a metaphor keeps prose from repeating the same noun over and over.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Martha a sans doute des rides et un peu d'arthrite, mais ces signes du vieillissement ne sont pas visibles sur la photo.</span><span class=\"en\">\"ces signes du vieillissement\" is a nominal reprise using a hyperonym (a broader category) to sum up \"des rides et de l'arthrite\".</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">On peut aussi reprendre un groupe nominal par un autre groupe nominal avec lequel il existe une association de sens (les campagnes de pub sont une partie de la publicité).</span>\n<span class=\"en\">A final option: reprise by association — a related but not identical noun phrase, when the link is clear from context.</span>\n</div>", "desc": "Avoiding repetition across a text: pronouns, demonstratives, synonyms, hyperonyms, and nominalizations that all point back to something already mentioned."}, {"id": "c1-temps-recit-passe", "level": "C1", "frTitle": "Maîtriser les temps du récit au passé", "enSub": "Six past tenses, six distinct jobs: sequencing, backgrounding, and flash-forwarding a narrative (Édito C1, Thème 10)", "body": "<div class=\"rule\">\n<span class=\"fr\">Chaque temps du passé a une valeur précise dans un récit : le plus-que-parfait exprime un fait antérieur à un autre fait passé ; le passé simple exprime un fait ponctuel sans rapport direct avec le présent (ou une action de premier plan) ; l'imparfait exprime une habitude, une description ou une action en cours d'accomplissement ; l'imparfait des verbes aller/devoir/être sur le point de + infinitif exprime un futur dans le passé ; le conditionnel présent peut exprimer, comme l'imparfait, un futur dans le passé.</span>\n<span class=\"en\">A written narrative typically layers several past tenses at once, each doing a distinct job — this is the literary equivalent of camera angles: which event is foreground, which is backstory, which hasn't happened yet from the narrator's vantage point.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Temps</th><th>Valeur</th></tr>\n<tr><td>Plus-que-parfait</td><td>fait antérieur à un autre fait passé</td></tr>\n<tr><td>Passé simple</td><td>fait ponctuel sans rapport avec le présent ; action de premier plan</td></tr>\n<tr><td>Imparfait</td><td>habitude, description, action en cours d'accomplissement dans le passé</td></tr>\n<tr><td>Imparfait de aller/devoir/être sur le point de + infinitif</td><td>futur dans le passé (n'exploite ni le futur simple ni le futur antérieur)</td></tr>\n<tr><td>Conditionnel présent</td><td>futur dans le passé (registre plus littéraire)</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Suite au succès d'Horizon, un traité avait été signé entre plusieurs nations... Mais la Chine investit des milliards de dollars... Son objectif était simple et pratique : utiliser sa masse critique pour former la plus grande partie innovante qui allait gagner la bataille mondiale de l'intelligence artificielle.</span><span class=\"en\">Plus-que-parfait (background event before the story's \"now\"), passé simple (the main narrated events), imparfait (ongoing description), and \"allait gagner\" (imparfait of aller + infinitive = future-in-the-past) all work together in one passage.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Modifier les temps verbaux d'un récit permet de créer une ambiance ou un rythme particulier, de suciter des émotions et d'influencer la manière dont le récit est perçu par le lecteur — mais cela ne change jamais le contenu factuel de l'histoire.</span>\n<span class=\"en\">Choosing passé simple over passé composé (or imparfait over passé composé) changes the feel of a passage — distance vs. immediacy, a finished era vs. a lingering state — without changing what actually happened.</span>\n</div>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"passe-simple\">→ Le passé simple (core grammar)</a>\n<a class=\"xref\" data-target=\"plus-que-parfait\">→ Le plus-que-parfait (core grammar)</a>\n<a class=\"xref\" data-target=\"c1-imparfait-pc\">→ Imparfait ou passé composé ? (fiche anglophones)</a>\n</div>", "desc": "Plus-que-parfait, passé simple, imparfait, and the imparfait/conditionnel of aller+infinitive each carry a distinct narrative job when layered in one passage."}, {"id": "c1-modaliser-discours", "level": "C1", "frTitle": "Modaliser son discours", "enSub": "Signalling how committed you are to what you're saying: the toolkit of subjective and objective modalization (Édito C1, Thème 11)", "body": "<div class=\"rule\">\n<span class=\"fr\">La modalisation subjective permet à l'auteur(e) de montrer son engagement par rapport au sujet : choix du lexique (mélioratif/péjoratif), implication de l'auteur(e) et du destinataire (\"vous la connaissez sans doute\"), adverbe qui renforce l'énoncé, ponctuation expressive, choix des modes et des temps, référence à une figure qui fait autorité.</span>\n<span class=\"en\">Subjective modalization is how a writer signals \"I have a stake in this\" — through word choice, direct address to the reader, intensifying adverbs, exclamation points, and citing an authority.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Vous la connaissez sans doute, cette satisfaction que l'on ressent quand on a réalisé un geste désintéressé qui profite à autrui !</span><span class=\"en\">Meliorative vocabulary (satisfaction, désintéressé), direct address to the reader (vous la connaissez), and an exclamation point all signal engagement.</span></div>\n<div class=\"ex\"><span class=\"fr\">Le sentiment d'être autonome dans la réalisation de ses actions est fortement relié au bonheur et au bien-être.</span><span class=\"en\">\"fortement\" is an adverb that reinforces/intensifies the claim — a subjective modalizer even in an otherwise neutral-sounding sentence.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">La modalisation objective permet à l'auteur(e) de manifester sa distance par rapport au sujet : vocabulaire neutre/scientifique, effacement de l'auteur(e), absence d'implication des lecteurs, constructions passives mettant en avant une étude, conditionnel présent pour signaler un doute ou une hypothèse, indicatif présent pour rapporter des faits, ponctuation réduite à l'essentiel.</span>\n<span class=\"en\">Objective modalization is the opposite move: scientific vocabulary, the author disappearing from the sentence, passive constructions that foreground a study rather than a person, and the conditionnel used specifically to flag \"this is reported, not confirmed\".</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">D'après ces auteurs, les comportements d'aide engendreraient des conséquences positives.</span><span class=\"en\">The conditionnel (engendreraient) signals that this is the cited authors' claim, not a fact the writer is personally vouching for — classic objective/reportative modalization.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ce constat a été formulé pour la première fois en 1946 par le professeur de psychologie Fritz Heider dans sa théorie de « l'équilibre cognitif ».</span><span class=\"en\">Passive construction (a été formulé) puts the finding, not the author's opinion, at the center — objective register.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">L'ellipse (ne pas prononcer un son ou un mot à l'oral) est un marqueur du registre familier à l'oral, distinct de la modalisation mais lié au degré d'implication et de spontanéité du locuteur.</span>\n<span class=\"en\">In spoken French, dropping sounds or words (ellipse) — je sais pas → j'sais pas, tu as → t'as — is another way speech signals informality and spontaneity, alongside the modalization devices above.</span>\n</div>", "desc": "Subjective modalization (lexical choice, direct address, intensifiers) signals engagement; objective modalization (passive, neutral vocabulary, conditionnel for reported claims) signals distance."}, {"id": "c1-groupe-nominal-de-des", "level": "C1", "frTitle": "Former un groupe nominal avec de, d' ou des + nom pluriel", "enSub": "When a plural des shrinks to de: the three triggers for the swap (Édito C1, Thème 12)", "body": "<div class=\"rule\">\n<span class=\"fr\">Des devient de/d' devant un nom pluriel dans trois cas : quand le groupe nominal comporte un adjectif antéposé (placé avant le nom) ; quand des/de + nom est précédé d'une expression de quantité ; quand de + des se contracte (complément du nom).</span>\n<span class=\"en\">This is a small but very frequent trap: plural \"des\" isn't always the article to use — three specific triggers force it to shrink to \"de\" (or \"d'\" before a vowel).</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Règle</th><th>Exemple</th></tr>\n<tr><td>des → de/d' : groupe nominal avec adjectif antéposé</td><td class=\"fr\">de magnifiques paysages (= des paysages magnifiques), d'énormes fougères arborescentes</td></tr>\n<tr><td>de/d' + nom : expression de quantité</td><td class=\"fr\">une trentaine d'éleveurs, un peu de réconfort, beaucoup de gens</td></tr>\n<tr><td>de + des → de/d' : complément du nom</td><td class=\"fr\">la réception et l'interprétation d'informations</td></tr>\n<tr><td>de + les → des : complément du nom (article défini pluriel, no contraction needed)</td><td class=\"fr\">le travail des insectes pollinisateurs</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">De minuscules caméléons aux couleurs changeantes, une profusion de grenouilles aux yeux d'or, et une pléthore de papillons dansant dans l'air.</span><span class=\"en\">\"De minuscules caméléons\" (adjective before the noun triggers de), \"une profusion de grenouilles\" and \"une pléthore de papillons\" (quantity expressions + de) — all three des→de triggers stacked in one sentence.</span></div>\n<div class=\"ex\"><span class=\"fr\">Les phénomènes observés peuvent alors donner lieu à de nouvelles interprétations.</span><span class=\"en\">\"de nouvelles interprétations\": nouvelles is antéposé (before the noun), so des becomes de.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">de nombreux(-euses), d'autres, de tel(le)s + nom pluriel sont également des groupes nominaux avec adjectif antéposé, d'où la substitution de de à des.</span>\n<span class=\"en\">A handful of common quantifiers (de nombreux, d'autres, de tels) count as \"adjective before the noun\" for this rule too, even though they don't look like ordinary adjectives.</span>\n</div>", "desc": "Plural des shrinks to de/d' before an antéposé adjective, after a quantity expression, or in certain de+des contractions."}]}]</script>
<script>window.__FG_DATA__ = JSON.parse(document.getElementById('fg-data').textContent);</script>
<script>
(function(){
  var DATA = window.__FG_DATA__;
  var LEVEL_ORDER = {A1:0,A2:1,B1:2,B2:3};

  var catsById = {};
  var lessonsById = {};
  var lessonCat = {};
  DATA.forEach(function(c){
    catsById[c.id] = c;
    c.lessons.forEach(function(l){
      lessonsById[l.id] = l;
      lessonCat[l.id] = c.id;
    });
  });
  var totalLessons = Object.keys(lessonsById).length;

  function loadJSON(key, fallback){
    try{ var v = JSON.parse(localStorage.getItem(key)); return v || fallback; }catch(e){ return fallback; }
  }
  function saveJSON(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
  }
  var bookmarks = loadJSON('fg_bookmarks', []);
  var recent = loadJSON('fg_recent', []);

  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    var btn = document.getElementById('themeToggle');
    if(btn) btn.textContent = t === 'dark' ? '☀' : '☽';
  }
  function initTheme(){
    var saved = null;
    try{ saved = localStorage.getItem('fg_theme'); }catch(e){}
    var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(theme);
  }
  function toggleTheme(){
    var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    var next = cur === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try{ localStorage.setItem('fg_theme', next); }catch(e){}
  }
  initTheme();

  function isBookmarked(id){ return bookmarks.indexOf(id) !== -1; }
  function toggleBookmark(id){
    var i = bookmarks.indexOf(id);
    if(i === -1) bookmarks.unshift(id); else bookmarks.splice(i,1);
    saveJSON('fg_bookmarks', bookmarks);
  }
  function pushRecent(id){
    recent = recent.filter(function(x){ return x !== id; });
    recent.unshift(id);
    recent = recent.slice(0, 6);
    saveJSON('fg_recent', recent);
  }

  var app = document.getElementById('app');
  var navLinks = document.querySelectorAll('nav.topnav a[data-nav]');
  var navSearch = document.getElementById('navSearch');

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function bookmarkIcon(on){
    return '<svg width="16" height="16" viewBox="0 0 256 256" stroke="currentColor" stroke-width="14">' +
      '<path fill="'+(on?'currentColor':'none')+'" d="M184,32H72A16,16,0,0,0,56,48V224a8,8,0,0,0,12.65,6.51L128,193.43l59.35,37.08A8,8,0,0,0,200,224V48A16,16,0,0,0,184,32Z"></path></svg>';
  }

  function categoryCard(c){
    return '<div class="card" data-go="category" data-id="'+c.id+'">' +
      '<div class="card-kicker">'+esc(c.levelRange)+'</div>' +
      '<div class="card-title">'+esc(c.label.replace(/^\d+\.\s*/,''))+'</div>' +
      '<p class="card-body">'+esc(c.desc)+'</p>' +
      '<div class="card-meta">'+c.lessons.length+' lesson'+(c.lessons.length===1?'':'s')+'</div>' +
      '</div>';
  }

  function lessonCard(l){
    var bm = isBookmarked(l.id);
    return '<div class="card" data-go="lesson" data-id="'+l.id+'">' +
      '<button class="bookmark-btn" data-bookmark="'+l.id+'" aria-label="Bookmark">'+bookmarkIcon(bm)+'</button>' +
      '<div class="card-kicker">'+esc(l.level)+'</div>' +
      '<div class="card-title">'+esc(l.frTitle)+'</div>' +
      '<p class="card-body">'+esc(l.enSub)+'</p>' +
      '</div>';
  }

  function lessonRow(l){
    var bm = isBookmarked(l.id);
    return '<div class="lesson-row" data-go="lesson" data-id="'+l.id+'">' +
      '<span class="tag tag-outline">'+esc(l.level)+'</span>' +
      '<div class="row-main">' +
        '<div class="row-title">'+esc(l.frTitle)+' <span class="en" style="font-weight:400;">— '+esc(l.enSub)+'</span></div>' +
        '<div class="row-desc">'+esc(l.desc)+'</div>' +
      '</div>' +
      '<button class="bookmark-btn" data-bookmark="'+l.id+'" aria-label="Bookmark">'+bookmarkIcon(bm)+'</button>' +
      '</div>';
  }

  function crumb(parts){
    var html = '<div class="crumb">';
    html += parts.map(function(p,i){
      if(i === parts.length-1) return '<span class="cur">'+esc(p.label)+'</span>';
      return '<a data-go="'+p.go+'" data-id="'+(p.id||'')+'">'+esc(p.label)+'</a>';
    }).join(' &middot; ');
    html += '</div>';
    return html;
  }

  function renderHome(){
    var recentLessons = recent.map(function(id){ return lessonsById[id]; }).filter(Boolean);
    var bmLessons = bookmarks.map(function(id){ return lessonsById[id]; }).filter(Boolean);
    var continueList = recentLessons.length ? recentLessons : bmLessons;

    var html = '<div class="hero">' +
      '<span class="kicker">Grammaire fran&ccedil;aise</span>' +
      '<h1>Understand French grammar.<br>Finally, in plain English.</h1>' +
      '<p class="sub">Clear explanations, real example sentences and full conjugation tables &mdash; organized by grammar topic, spanning A1 to C1.</p>' +
      '<div class="stat-strip">' +
        '<span class="stat"><b>'+totalLessons+'</b> grammar lessons</span>' +
        '<span class="stat"><b>'+DATA.length+'</b> categories</span>' +
        '<span class="stat"><b>A1&ndash;C1</b> levels covered</span>' +
        '<span class="stat"><b>'+bmLessons.length+'</b> bookmarked</span>' +
      '</div>';

    if(continueList.length){
      html += '<span class="kicker">'+(recentLessons.length ? 'Continue where you left off' : 'Bookmarked')+'</span>' +
        '<div class="grid g3" style="margin:16px 0 34px;">' +
        continueList.slice(0,3).map(lessonCard).join('') + '</div>';
    }

    html += '<span class="kicker">Jump to a level</span>' +
      '<div class="level-row" style="margin:16px 0 30px;">' +
      ['A1','A2','B1','B2','C1'].map(function(lv){
        return '<button class="tag tag-outline level-chip" data-go="browse" data-id="" data-query="'+lv+'">'+lv+'</button>';
      }).join('') + '</div>';

    html += '<div class="cta-row"><button class="btn-cta" data-go="browse">Browse all topics &rarr;</button></div>' +
      '</div>';
    app.innerHTML = html;
    setActiveNav('home');
  }

  function renderBrowse(query){
    query = (query||'').trim().toLowerCase();
    var html = '<h1 style="font-size:1.9rem;margin-bottom:6px;">Browse grammar topics</h1>' +
      '<p class="sub" style="color:var(--muted);font-size:0.95rem;max-width:60ch;margin:0 0 20px;">Grouped by grammar category &mdash; each one spans every level.</p>' +
      '<input class="input" id="browseSearch" style="max-width:360px;margin-bottom:26px;" placeholder="Search topics &mdash; e.g. subjunctive, dont, si" value="'+esc(query)+'">';

    if(query){
      var matchedCats = DATA.filter(function(c){
        return c.label.toLowerCase().indexOf(query)!==-1 || c.desc.toLowerCase().indexOf(query)!==-1;
      });
      var matchedLessons = [];
      DATA.forEach(function(c){
        c.lessons.forEach(function(l){
          var hay = (l.frTitle+' '+l.enSub+' '+l.desc+' '+l.level).toLowerCase();
          if(hay.indexOf(query)!==-1) matchedLessons.push(l);
        });
      });
      if(matchedCats.length){
        html += '<span class="kicker">Categories</span><div class="grid g2" style="margin-bottom:26px;">'+matchedCats.map(categoryCard).join('')+'</div>';
      }
      if(matchedLessons.length){
        html += '<span class="kicker">Lessons</span><div style="display:grid;gap:2px;margin-top:10px;">'+matchedLessons.map(lessonRow).join('')+'</div>';
      }
      if(!matchedCats.length && !matchedLessons.length){
        html += '<p class="empty">No topics match &ldquo;'+esc(query)+'&rdquo;.</p>';
      }
    } else {
      html += '<div class="grid g2">'+DATA.map(categoryCard).join('')+'</div>';
    }
    app.innerHTML = html;
    setActiveNav('browse');
    var sb = document.getElementById('browseSearch');
    if(sb){
      sb.focus();
      sb.setSelectionRange(sb.value.length, sb.value.length);
      sb.addEventListener('input', function(){ go('browse', null, sb.value); });
    }
  }

  function renderCategory(id){
    var c = catsById[id];
    if(!c){ renderBrowse(); return; }
    var html = crumb([{label:'Browse', go:'browse'},{label:c.label.replace(/^\d+\.\s*/,'')}]);
    html += '<h1 style="font-size:1.9rem;margin-bottom:6px;">'+esc(c.label.replace(/^\d+\.\s*/,''))+'</h1>';
    html += '<p class="sub" style="color:var(--muted);font-size:0.95rem;max-width:60ch;margin:0 0 24px;">'+esc(c.desc)+'</p>';
    html += '<div style="display:grid;gap:2px;">' + c.lessons.map(lessonRow).join('') + '</div>';
    app.innerHTML = html;
    setActiveNav('');
  }

  function renderLesson(id){
    var l = lessonsById[id];
    if(!l){ renderBrowse(); return; }
    var c = catsById[lessonCat[id]];
    pushRecent(id);
    var bm = isBookmarked(id);
    var html = crumb([
      {label:'Browse', go:'browse'},
      {label:c.label.replace(/^\d+\.\s*/,''), go:'category', id:c.id},
      {label:l.frTitle}
    ]);
    html += '<div class="tag-row">' +
      '<span class="tag tag-accent">'+esc(l.level)+'</span>' +
      '<span class="tag tag-outline">'+esc(c.label.replace(/^\d+\.\s*/,''))+'</span>' +
      '<button class="bookmark-toggle'+(bm?' on':'')+'" id="lessonBookmarkBtn">'+bookmarkIcon(bm)+' '+(bm?'Bookmarked':'Bookmark')+'</button>' +
      '</div>';
    html += '<div class="reading" style="margin:0;">';
    html += '<h1 class="lesson-title"><span class="fr">'+esc(l.frTitle)+'</span></h1>';
    html += '<p class="lesson-sub">'+esc(l.enSub)+'</p>';
    html += l.body;
    html += '</div>';
    app.innerHTML = html;
    setActiveNav('');

    var bmBtn = document.getElementById('lessonBookmarkBtn');
    bmBtn.addEventListener('click', function(){
      toggleBookmark(id);
      renderLesson(id);
    });
    app.querySelectorAll('.xref[data-target]').forEach(function(a){
      a.addEventListener('click', function(e){
        e.preventDefault();
        go('lesson', a.getAttribute('data-target'));
      });
    });
    window.scrollTo(0,0);
  }

  function setActiveNav(name){
    navLinks.forEach(function(a){
      a.classList.toggle('active', a.getAttribute('data-nav') === name);
    });
  }

  function go(screen, id, query){
    var hash = '#/' + screen + (id ? '/' + id : '');
    if(screen === 'browse' && query) hash += '?q=' + encodeURIComponent(query);
    if(location.hash === hash){ render(); } else { location.hash = hash; }
  }

  function render(){
    var hash = location.hash.replace(/^#\/?/, '');
    var qIndex = hash.indexOf('?q=');
    var query = '';
    if(qIndex !== -1){ query = decodeURIComponent(hash.slice(qIndex+3)); hash = hash.slice(0,qIndex); }
    var parts = hash.split('/').filter(Boolean);
    var screen = parts[0] || 'home';
    var id = parts[1];
    if(screen === 'home') renderHome();
    else if(screen === 'browse') renderBrowse(query);
    else if(screen === 'category') renderCategory(id);
    else if(screen === 'lesson') renderLesson(id);
    else renderHome();
  }

  app.addEventListener('click', function(e){
    var bmBtn = e.target.closest('[data-bookmark]');
    if(bmBtn){
      e.preventDefault();
      e.stopPropagation();
      toggleBookmark(bmBtn.getAttribute('data-bookmark'));
      render();
      return;
    }
    var el = e.target.closest('[data-go]');
    if(el){
      go(el.getAttribute('data-go'), el.getAttribute('data-id') || null, el.getAttribute('data-query') || null);
    }
  });

  navLinks.forEach(function(a){
    a.addEventListener('click', function(){ go(a.getAttribute('data-nav')); });
  });
  document.querySelector('.brand').addEventListener('click', function(){ go('home'); });

  function runSearch(val){
    if(val.trim()) go('browse', null, val); else go('browse');
  }
  navSearch.addEventListener('keydown', function(e){
    if(e.key === 'Enter') runSearch(navSearch.value);
  });
  var themeToggle = document.getElementById('themeToggle');
  if(themeToggle) themeToggle.addEventListener('click', toggleTheme);

  window.addEventListener('hashchange', render);
  render();
})();
</script>

</body>
</html>
