 introduit un constat, une réalité que l'on affirme et présente comme nouvelle information.</span>\n<span class=\"en\">Le fait que + subjunctive foregrounds a fact in order to comment on or qualify it — the fact itself is treated as already known or presupposed. Le fait est que + indicative introduces a plain statement of reality, presented as new, asserted information.</span>\n</div><details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Le fait qu'il soit en retard ne me surprend pas.</span><span class=\"en\">The fact that he's late doesn't surprise me — the lateness is presupposed; the sentence comments on it.</span></div>\n<div class=\"ex\"><span class=\"fr\">Le fait est qu'il n'a jamais tenu ses promesses.</span><span class=\"en\">The fact is, he's never kept his promises — a flat assertion, presented as the key point.</span></div>\n</div></details><div class=\"note\">\n<span class=\"fr\">Le fait que peut aussi être suivi de l'indicatif quand il est repris en fin de phrase ou en position sujet insistant sur la réalité du fait plutôt que sur son commentaire — mais le subjonctif reste largement majoritaire et le choix le plus sûr.</span>\n<span class=\"en\">Le fait que can occasionally take the indicative when it stresses the reality of the fact rather than commenting on it, but the subjunctive is by far the safer and more common choice.</span>\n</div><div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"subjonctif\">→ The subjunctive</a>\n<a class=\"xref\" data-target=\"indicatif-subjonctif-infinitif\">→ Indicative, subjunctive or infinitive?</a>\n</div>"}, {"id": "c1-discours-rapporte-1", "level": "C1", "frTitle": "Le discours rapporté (1/2) — pronoms et verbes introducteurs", "enSub": "Reported speech: pronoun changes and reporting verbs", "desc": "Direct speech turns into a que-clause: pronouns shift, and question/exclamation marks and quotation marks are dropped.", "body": "<div class=\"rule\">\n<span class=\"fr\">Au discours rapporté, les pronoms personnels et possessifs changent pour refléter le point de vue du rapporteur ; la ponctuation du discours direct (guillemets, ?, !) disparaît.</span>\n<span class=\"en\">Direct speech turns into a que-clause: pronouns shift, and question/exclamation marks and quotation marks are dropped.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Elle dit : « J'aime le chocolat ! » → Elle dit qu'elle aime le chocolat.</span><span class=\"en\">She says: \"I love chocolate!\" → She says (that) she loves chocolate.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Dans une question rapportée, on garde le mot interrogatif mais on retrouve l'ordre sujet-verbe (plus d'inversion).</span>\n<span class=\"en\">Reported questions keep quand/où/pourquoi/comment but lose the subject-verb inversion of the direct question.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Direct</th><th>Reported</th></tr>\n<tr><td class=\"fr\">Qu'est-ce que / Que… ?</td><td class=\"fr\">ce que</td></tr>\n<tr><td class=\"fr\">Qui est-ce qui / Qui est-ce que… ?</td><td class=\"fr\">qui</td></tr>\n<tr><td class=\"fr\">Est-ce que… ?</td><td class=\"fr\">si</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Il me demande : « Quand pars-tu ? » → Il me demande quand je pars.</span><span class=\"en\">He asks me: \"When are you leaving?\" → He asks me when I'm leaving.</span></div>\n</div></details>\n<div class=\"xref-box\">\n<span class=\"xref-label\">See also:</span>\n<a class=\"xref\" data-target=\"c1-discours-rapporte-2\">→ Reported speech (2/2) — tense and time-adverb changes</a>\n</div>"}, {"id": "c1-discours-rapporte-2", "level": "C1", "frTitle": "Le discours rapporté (2/2) — temps et adverbes de temps", "enSub": "Reported speech: tense and time-adverb changes", "desc": "A past-tense reporting verb pushes the reported verb one step further into the past — this is the classic \"backshift\", same logic as in English.", "body": "<div class=\"rule\">\n<span class=\"fr\">Si le verbe introducteur est au passé, le verbe rapporté recule d'un cran dans le temps (présent → imparfait, passé composé → plus-que-parfait, futur → conditionnel).</span>\n<span class=\"en\">A past-tense reporting verb pushes the reported verb one step further into the past — this is the classic \"backshift\", same logic as in English.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Direct speech</th><th>Reported (past introducer)</th></tr>\n<tr><td class=\"fr\">présent</td><td class=\"fr\">imparfait</td></tr>\n<tr><td class=\"fr\">passé composé</td><td class=\"fr\">plus-que-parfait</td></tr>\n<tr><td class=\"fr\">futur simple</td><td class=\"fr\">conditionnel présent</td></tr>\n<tr><td class=\"fr\">impératif</td><td class=\"fr\">infinitif</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Le ministre a déclaré que le prix de l'essence augmentait au 1er janvier.</span><span class=\"en\">The minister declared that gas prices would go up on January 1st.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il nous crie : « Sortez ! » → Il nous crie de sortir.</span><span class=\"en\">He shouts at us: \"Get out!\" → He shouts at us to get out — imperative becomes infinitive, no tense-of-introducer exception here.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Les adverbes de temps changent aussi au discours rapporté (aujourd'hui → ce jour-là, hier → la veille, demain → le lendemain).</span>\n<span class=\"en\">Time adverbs shift the same way they do in English reported speech, just with different words.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">« Tu pars demain ? » → Elle a demandé si tu partais le lendemain.</span><span class=\"en\">\"Are you leaving tomorrow?\" → She asked if you were leaving the next day.</span></div>\n</div></details>"}, {"id": "c1-reprise-continuite", "level": "C1", "frTitle": "Assurer la continuité du texte avec la reprise", "enSub": "Keeping a text cohesive: pronominal and nominal reprises that avoid clunky repetition", "body": "<div class=\"rule\">\n<span class=\"fr\">Pour reprendre totalement un groupe nominal, on peut utiliser un pronom (personnel, démonstratif comme celui/celle, ou les pronoms y/en) ou un article défini avec changement de déterminant.</span>\n<span class=\"en\">A full reprise stands in for the whole noun phrase it points back to — the classic case is a pronoun, but a demonstrative like \"celui\" or \"celle\" works too.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Les jeunes gens bien élevés qui vous expédient sans coup férir dans le camp des faibles qu'il faut protéger.</span><span class=\"en\">\"qui\" and \"qu'\" here are relative pronouns fully reprising \"les jeunes gens\" and \"les faibles\".</span></div>\n<div class=\"ex\"><span class=\"fr\">Combien de fantômes de visages superposons-nous sur celui que nous voyons en face de nous ?</span><span class=\"en\">\"celui\" (a demonstrative pronoun) reprises \"un visage parmi tous les fantômes de visages\" — a partial reprise, standing for one out of the whole set just mentioned.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">Pour reprendre partiellement un groupe nominal, on peut utiliser un pronom indéfini (certains, quelques-uns, la plupart, d'autres/l'autre...) ou un pronom possessif (le mien, la mienne...).</span>\n<span class=\"en\">A partial reprise picks out only some of what was just mentioned — useful when you want to single out a subset without renaming it.</span>\n</div>\n<div class=\"rule\">\n<span class=\"fr\">Pour reprendre une phrase ou un fragment du texte, on peut utiliser un pronom démonstratif neutre (ce, ça, ceci, cela) ou un pronom de 3e personne.</span>\n<span class=\"en\">When what you're pointing back to is a whole clause or idea rather than a single noun, the neutral demonstratives (ce, ça, cela) are the natural tool.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Ce jeune m'a laissé sa place, ce qui a détruit pour la journée mon humeur primesautière.</span><span class=\"en\">\"ce qui\" reprises the entire preceding clause (\"ce jeune m'a laissé sa place\"), not just a noun.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">La reprise nominale peut se faire en répétant le même nom avec un changement de déterminant, ou en changeant de terme (synonyme, métaphore, hyperonyme), ou par un nom générique / une nominalisation pour reprendre une phrase entière.</span>\n<span class=\"en\">Reprise doesn't have to be pronominal — swapping in a synonym, a broader category word (hyperonym), or even a metaphor keeps prose from repeating the same noun over and over.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Martha a sans doute des rides et un peu d'arthrite, mais ces signes du vieillissement ne sont pas visibles sur la photo.</span><span class=\"en\">\"ces signes du vieillissement\" is a nominal reprise using a hyperonym (a broader category) to sum up \"des rides et de l'arthrite\".</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">On peut aussi reprendre un groupe nominal par un autre groupe nominal avec lequel il existe une association de sens (les campagnes de pub sont une partie de la publicité).</span>\n<span class=\"en\">A final option: reprise by association — a related but not identical noun phrase, when the link is clear from context.</span>\n</div>", "desc": "Avoiding repetition across a text: pronouns, demonstratives, synonyms, hyperonyms, and nominalizations that all point back to something already mentioned."}, {"id": "c1-registre-langue", "level": "C1", "frTitle": "Adapter le registre de langue", "enSub": "Reading and producing familier, standard, and soutenu French: what actually changes across registers", "body": "<div class=\"rule\">\n<span class=\"fr\">Le registre de langue varie selon plusieurs paramètres systématiques : la négation, l'interrogation, la complexité syntaxique, le lexique et la phonétique.</span>\n<span class=\"en\">Register isn't just vocabulary — it's a bundle of consistent choices across grammar, word choice, and pronunciation, and mixing registers within one utterance sounds off.</span>\n</div>\n<table class=\"gtable\">\n<tr><th>Élément</th><th>Familier</th><th>Standard</th><th>Soutenu</th></tr>\n<tr><td>Négation</td><td class=\"fr\">t'inquiète pas (no \"ne\")</td><td class=\"fr\">tu ne t'inquiète pas</td><td class=\"fr\">ne t'inquiète pas (ne maintained)</td></tr>\n<tr><td>Ne explétif</td><td>—</td><td>—</td><td class=\"fr\">je craignais que ça ne soit compliqué (optional, no negative meaning, after craindre/avoir peur/à moins que...)</td></tr>\n<tr><td>Interrogation</td><td class=\"fr\">Il apprécie sa nouvelle école ? (no inversion)</td><td class=\"fr\">Est-ce qu'il apprécie... ?</td><td class=\"fr\">Apprécie-t-il... ? (subject-verb inversion, euphonic -t-)</td></tr>\n<tr><td>Complexité syntaxique</td><td>short, juxtaposed clauses</td><td>—</td><td>multiplication of subordinate clauses (conjunctive, relative, circumstantial)</td></tr>\n<tr><td>Lexique</td><td>familiar/slang words, \"hyper\" as intensifier</td><td>—</td><td>precise, elegant word choice</td></tr>\n<tr><td>Phonétique</td><td class=\"fr\">effacement de certaines voyelles: j'sais pas, t'as</td><td>—</td><td>every sound pronounced, optional liaisons respected</td></tr>\n</table>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Ah mais t'inquiète pas, te culpabilise pas trop.</span><span class=\"en\">Registre familier: dropped \"ne\", clipped syntax, casual vocabulary.</span></div>\n<div class=\"ex\"><span class=\"fr\">Il faut qu'elles ne soient ni trop mamans ni trop figurantes, qu'elles s'investissent dans une relation dont la durabilité est le plus souvent corrélée à celle de leur relation amoureuse.</span><span class=\"en\">Registre soutenu: full negation, subordinate clauses stacked (qu'elles... dont... à celle de...), elegant vocabulary.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">Le niveau de langue doit rester cohérent sur l'ensemble d'un texte ou d'un échange : mélanger un lexique familier et une syntaxe soutenue produit un effet maladroit, sauf effet stylistique volontaire.</span>\n<span class=\"en\">Consistency matters more than any single feature — a soutenu sentence with one slangy word (or vice versa) reads as a mistake, not a deliberate register shift.</span>\n</div>", "desc": "Familier, standard, and soutenu differ systematically in negation, interrogation word order, sentence complexity, vocabulary, and pronunciation — not just in 'politeness'."}, {"id": "c1-modaliser-discours", "level": "C1", "frTitle": "Modaliser son discours", "enSub": "Signalling how committed you are to what you're saying: the toolkit of subjective and objective modalization", "body": "<div class=\"rule\">\n<span class=\"fr\">La modalisation subjective permet à l'auteur(e) de montrer son engagement par rapport au sujet : choix du lexique (mélioratif/péjoratif), implication de l'auteur(e) et du destinataire (\"vous la connaissez sans doute\"), adverbe qui renforce l'énoncé, ponctuation expressive, choix des modes et des temps, référence à une figure qui fait autorité.</span>\n<span class=\"en\">Subjective modalization is how a writer signals \"I have a stake in this\" — through word choice, direct address to the reader, intensifying adverbs, exclamation points, and citing an authority.</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">Vous la connaissez sans doute, cette satisfaction que l'on ressent quand on a réalisé un geste désintéressé qui profite à autrui !</span><span class=\"en\">Meliorative vocabulary (satisfaction, désintéressé), direct address to the reader (vous la connaissez), and an exclamation point all signal engagement.</span></div>\n<div class=\"ex\"><span class=\"fr\">Le sentiment d'être autonome dans la réalisation de ses actions est fortement relié au bonheur et au bien-être.</span><span class=\"en\">\"fortement\" is an adverb that reinforces/intensifies the claim — a subjective modalizer even in an otherwise neutral-sounding sentence.</span></div>\n</div></details>\n<div class=\"rule\">\n<span class=\"fr\">La modalisation objective permet à l'auteur(e) de manifester sa distance par rapport au sujet : vocabulaire neutre/scientifique, effacement de l'auteur(e), absence d'implication des lecteurs, constructions passives mettant en avant une étude, conditionnel présent pour signaler un doute ou une hypothèse, indicatif présent pour rapporter des faits, ponctuation réduite à l'essentiel.</span>\n<span class=\"en\">Objective modalization is the opposite move: scientific vocabulary, the author disappearing from the sentence, passive constructions that foreground a study rather than a person, and the conditionnel used specifically to flag \"this is reported, not confirmed\".</span>\n</div>\n<details class=\"examples-toggle\"><summary>Examples</summary><div class=\"examples\">\n<div class=\"ex\"><span class=\"fr\">D'après ces auteurs, les comportements d'aide engendreraient des conséquences positives.</span><span class=\"en\">The conditionnel (engendreraient) signals that this is the cited authors' claim, not a fact the writer is personally vouching for — classic objective/reportative modalization.</span></div>\n<div class=\"ex\"><span class=\"fr\">Ce constat a été formulé pour la première fois en 1946 par le professeur de psychologie Fritz Heider dans sa théorie de « l'équilibre cognitif ».</span><span class=\"en\">Passive construction (a été formulé) puts the finding, not the author's opinion, at the center — objective register.</span></div>\n</div></details>\n<div class=\"note\">\n<span class=\"fr\">L'ellipse (ne pas prononcer un son ou un mot à l'oral) est un marqueur du registre familier à l'oral, distinct de la modalisation mais lié au degré d'implication et de spontanéité du locuteur.</span>\n<span class=\"en\">In spoken French, dropping sounds or words (ellipse) — je sais pas → j'sais pas, tu as → t'as — is another way speech signals informality and spontaneity, alongside the modalization devices above.</span>\n</div>", "desc": "Subjective modalization (lexical choice, direct address, intensifiers) signals engagement; objective modalization (passive, neutral vocabulary, conditionnel for reported claims) signals distance."}]}]</script>

  function categoryCard(c){
    var icon = CATEGORY_ICONS[c.id] || '';
    return '<div class="card" data-go="category" data-id="'+c.id+'">' +
      (icon ? '<div class="card-icon">'+icon+'</div>' : '') +
      '<div class="card-kicker">'+esc(c.levelRange)+'</div>' +
      '<div class="card-title">'+esc(c.label.replace(/^\d+\.\s*/,''))+'</div>' +
      '<p class="card-body">'+esc(c.desc)+'</p>' +
      '<div class="card-meta">'+c.lessons.length+' lesson'+(c.lessons.length===1?'':'s')+'</div>' +
      '</div>';
  }

  function lessonCard(l){
    var bm = isBookmarked(l.id);
    return '<div class="card" data-go="lesson" data-id="'+l.id+'">' +
      '<button class="bookmark-btn" data-bookmark="'+l.id+'" aria-label="Bookmark">'+bookmarkIcon(bm)+'</button>' +
      '<div class="card-kicker">'+esc(l.level)+'</div>' +
      '<div class="card-title">'+esc(l.frTitle)+'</div>' +
      '<p class="card-body">'+esc(l.enSub)+'</p>' +
      '</div>';
  }

  function lessonRow(l){
    var bm = isBookmarked(l.id);
    return '<div class="lesson-row" data-go="lesson" data-id="'+l.id+'">' +
      '<span class="tag tag-outline">'+esc(l.level)+'</span>' +
      '<div class="row-main">' +
        '<div class="row-title">'+esc(l.frTitle)+' <span class="en" style="font-weight:400;">— '+esc(l.enSub)+'</span></div>' +
        '<div class="row-desc">'+esc(l.desc)+'</div>' +
      '</div>' +
      '<button class="bookmark-btn" data-bookmark="'+l.id+'" aria-label="Bookmark">'+bookmarkIcon(bm)+'</button>' +
      '</div>';
  }

  function backLink(){
    if(!canGoBack()) return '';
    return '<a class="back-link" data-back="1">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>' +
      'Back</a>';
  }

  function crumb(parts){
    var html = '<div class="crumb">';
    html += parts.map(function(p,i){
      if(i === parts.length-1) return '<span class="cur">'+esc(p.label)+'</span>';
      return '<a data-go="'+p.go+'" data-id="'+(p.id||'')+'">'+esc(p.label)+'</a>';
    }).join(' &middot; ');
    html += '</div>';
    return html;
  }

  function renderHome(query){
    query = (query||'').trim().toLowerCase();
    var recentLessons = recent.map(function(id){ return lessonsById[id]; }).filter(Boolean);
    var bmLessons = bookmarks.map(function(id){ return lessonsById[id]; }).filter(Boolean);

    var html = '<div class="hero">';
    html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:2px;">' +
      '<span style="color:var(--accent);display:inline-flex;width:26px;height:26px;">'+EIFFEL_MOTIF.replace('width="150" height="150"','width="26" height="26"')+'</span>' +
      '<span class="kicker" style="margin:0;">Grammaire fran&ccedil;aise</span>' +
      '</div>' +
      '<p class="sub" style="font-size:0.82rem;margin:0 0 18px;">'+totalLessons+' lessons &middot; '+DATA.length+' categories &middot; A1&ndash;C2</p>';

    html += '<input class="input search-hero" id="homeSearch" placeholder="Search a topic, a tense, a rule&hellip; (dont, subjonctif, B1)" value="'+esc(query)+'">';

    html += '<div class="level-row" style="margin:14px 0 28px;">' +
      ['A1','A2','B1','B2','C1','C2'].map(function(lv){
        var active = query === lv.toLowerCase();
        return '<button class="tag tag-outline level-chip'+(active?' active':'')+'" data-level="'+lv+'">'+lv+'</button>';
      }).join('') + '</div>';

    if(query){
      var matchedLessons = [];
      DATA.forEach(function(c){
        c.lessons.forEach(function(l){
          var hay = (l.frTitle+' '+l.enSub+' '+l.desc+' '+l.level).toLowerCase();
          if(hay.indexOf(query)!==-1) matchedLessons.push(l);
        });
      });
      if(matchedLessons.length){
        html += '<span class="kicker">Lessons</span><div style="display:grid;gap:2px;margin-top:10px;">'+matchedLessons.map(lessonRow).join('')+'</div>';
      } else {
        html += '<p class="empty">No topics match &ldquo;'+esc(query)+'&rdquo;.</p>';
      }
    } else {
      if(recentLessons.length || bmLessons.length){
        html += '<div class="grid g2" style="margin:16px 0 30px;">';
        if(recentLessons.length){
          html += '<details class="examples-toggle" open><summary>Continue where you left off ('+recentLessons.length+')</summary>' +
            '<div style="display:grid;gap:2px;background:var(--card);padding:2px 10px;">' + recentLessons.slice(0,3).map(lessonRow).join('') + '</div></details>';
        }
        if(bmLessons.length){
          html += '<details class="examples-toggle" open><summary>Bookmarked ('+bmLessons.length+')</summary>' +
            '<div style="display:grid;gap:2px;background:var(--card);padding:2px 10px;">' + bmLessons.slice(0,3).map(lessonRow).join('') + '</div></details>';
        }
        html += '</div>';
      }
      html += '<span class="kicker">All topics</span><div class="grid g2" style="margin:16px 0;">'+DATA.map(categoryCard).join('')+'</div>';
    }

    html += '</div>';
    app.innerHTML = html;
    setActiveNav('home');

    var hs = document.getElementById('homeSearch');
    if(hs){
      if(homeSearchHadFocus){
        hs.focus();
        hs.setSelectionRange(hs.value.length, hs.value.length);
      }
      hs.addEventListener('input', function(){ runSearch(hs.value, true); });
    }
    app.querySelectorAll('.level-chip').forEach(function(btn){
      btn.addEventListener('click', function(){
        var lv = btn.getAttribute('data-level');
        var isActive = btn.classList.contains('active');
        runSearch(isActive ? '' : lv, true);
      });
    });
  }

  function renderCategory(id){
    var c = catsById[id];
    if(!c){ renderHome(); return; }
    var html = backLink();
    html += crumb([{label:'Home', go:'home'},{label:c.label.replace(/^\d+\.\s*/,'')}]);
    var cicon = CATEGORY_ICONS[c.id];
    html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">' +
      (cicon ? '<span style="color:var(--accent);display:inline-flex;">'+cicon+'</span>' : '') +
      '<h1 style="font-size:1.9rem;margin:0;">'+esc(c.label.replace(/^\d+\.\s*/,''))+'</h1>' +
      '</div>';
    html += '<p class="sub" style="color:var(--muted);font-size:0.95rem;max-width:60ch;margin:0 0 24px;">'+esc(c.desc)+'</p>';
    html += '<div style="display:grid;gap:2px;">' + c.lessons.map(lessonRow).join('') + '</div>';
    app.innerHTML = html;
    setActiveNav('');
  }

  function renderLesson(id){
    var l = lessonsById[id];
    if(!l){ renderHome(); return; }
    var c = catsById[lessonCat[id]];
    pushRecent(id);
    var bm = isBookmarked(id);
    var html = backLink();
    html += crumb([
      {label:'Home', go:'home'},
      {label:c.label.replace(/^\d+\.\s*/,''), go:'category', id:c.id},
      {label:l.frTitle}
    ]);
    html += '<div class="tag-row">' +
      '<span class="tag tag-accent">'+esc(l.level)+'</span>' +
      '<span class="tag tag-outline">'+esc(c.label.replace(/^\d+\.\s*/,''))+'</span>' +
      '<button class="bookmark-toggle'+(bm?' on':'')+'" id="lessonBookmarkBtn">'+bookmarkIcon(bm)+' '+(bm?'Bookmarked':'Bookmark')+'</button>' +
      '</div>';
    html += '<div class="reading" style="margin:0;">';
    html += '<h1 class="lesson-title"><span class="fr">'+esc(l.frTitle)+'</span></h1>';
    html += '<p class="lesson-sub">'+esc(l.enSub)+'</p>';
    html += l.body;
    html += '</div>';
    app.innerHTML = html;
    setActiveNav('');

    var bmBtn = document.getElementById('lessonBookmarkBtn');
    bmBtn.addEventListener('click', function(){
      toggleBookmark(id);
      renderLesson(id);
    });
    app.querySelectorAll('.xref[data-target]').forEach(function(a){
      a.addEventListener('click', function(e){
        e.preventDefault();
        go('lesson', a.getAttribute('data-target'));
      });
    });
    window.scrollTo(0,0);
  }

  function setActiveNav(name){
    navLinks.forEach(function(a){
      a.classList.toggle('active', a.getAttribute('data-nav') === name);
    });
  }

  function go(screen, id, query, replace){
    var hash = '#/' + screen + (id ? '/' + id : '');
    if(screen === 'home' && query) hash += '?q=' + encodeURIComponent(query);
    if(replace){
      history.replaceState(null, '', hash);
      render();
      return;
    }
    if(location.hash && location.hash !== hash) appStack.push(location.hash);
    if(location.hash === hash){ render(); } else { location.hash = hash; }
  }

  function canGoBack(){
    return appStack.length > 0;
  }

  function goBack(){
    var prev = appStack.pop();
    if(prev){ location.hash = prev; } else { location.hash = '#/'; }
  }

  function render(){
    homeSearchHadFocus = document.activeElement && (document.activeElement.id === 'homeSearch' || document.activeElement.id === 'navSearch');
    var hash = location.hash.replace(/^#\/?/, '');
    var qIndex = hash.indexOf('?q=');
    var query = '';
    if(qIndex !== -1){ query = decodeURIComponent(hash.slice(qIndex+3)); hash = hash.slice(0,qIndex); }
    var parts = hash.split('/').filter(Boolean);
    var screen = parts[0] || 'home';
    if(screen === 'browse') screen = 'home';
    var id = parts[1];
    if(screen === 'home') renderHome(query);
    else if(screen === 'category') renderCategory(id);
    else if(screen === 'lesson') renderLesson(id);
    else renderHome();
    navSearch.style.display = (screen === 'home') ? 'none' : '';
    if(document.activeElement !== navSearch) navSearch.value = '';
  }

  app.addEventListener('click', function(e){
    var back = e.target.closest('[data-back]');
    if(back){
      e.preventDefault();
      goBack();
      return;
    }
    var bmBtn = e.target.closest('[data-bookmark]');
    if(bmBtn){
      e.preventDefault();
      e.stopPropagation();
      toggleBookmark(bmBtn.getAttribute('data-bookmark'));
      render();
      return;
    }
    var el = e.target.closest('[data-go]');
    if(el){
      go(el.getAttribute('data-go'), el.getAttribute('data-id') || null, el.getAttribute('data-query') || null);
    }
  });

  navLinks.forEach(function(a){
    a.addEventListener('click', function(){ go(a.getAttribute('data-nav')); });
  });
  document.querySelector('.brand').addEventListener('click', function(){ go('home'); });

  function runSearch(val, replace){
    go('home', null, val || null, replace);
  }
  navSearch.addEventListener('input', function(){
    runSearch(navSearch.value, false);
  });
  navSearch.addEventListener('keydown', function(e){
    if(e.key === 'Enter') runSearch(navSearch.value);
  });
  var themeToggle = document.getElementById('themeToggle');
  if(themeToggle) themeToggle.addEventListener('click', toggleTheme);

  window.addEventListener('hashchange', render);
  render();
})();
</script>

</body>
</html>
